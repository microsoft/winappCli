parameters:
  stable: 'false'
  DoEsrp: false
  signingIdentity:
    serviceName: ''
    appId: ''
    tenantId: ''
    akvName: ''
    authCertName: ''
    signCertName: ''

steps:
# Component Detection's RustSbomDetector otherwise shells out to `cargo metadata`, which reaches
# index.crates.io to refresh the registry index. CFSClean network isolation blocks that public feed,
# so it surfaces as a blocked-connection warning on every Build run (from the two Rust samples).
# DisableRustCliScan makes the detector skip the Cargo CLI and read the committed Cargo.lock files
# directly - both samples ship one, so component coverage is unchanged and no crates.io call is made.
# Set as a job-scoped variable via setvariable so the injected Component Detection task inherits it;
# a per-step env would not reach it. See
# https://github.com/microsoft/component-detection/blob/main/docs/detectors/rust.md
- pwsh: Write-Host "##vso[task.setvariable variable=DisableRustCliScan]true"
  displayName: Skip Rust CLI scan in Component Detection
- task: PowerShell@2
  displayName: Build CLI
  env:
    NPM_CONFIG_USERCONFIG: $(System.DefaultWorkingDirectory)\.npmrc
    # The CLI's own package downloads (and the live-feed NuGet tests) resolve their sources from the
    # nuget.config hierarchy, which the "Add release package source" step has already pointed at
    # pde-oss_Internal at both the repo and user scope, with NuGetAuthenticate providing credentials.
    # The live-feed tests write their own isolated config, so name the internal feed for them here.
    WINAPP_TEST_NUGET_SOURCE: https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/pde-oss_Internal/nuget/v3/index.json
  inputs:
    pwsh: true
    filePath: $(System.DefaultWorkingDirectory)\scripts\build-cli.ps1
    arguments: "-Stable:$${{ parameters.stable }} -SkipMsix"
- ${{ if eq(parameters['DoEsrp'], 'true') }}:
  - task: EsrpCodeSigning@6
    displayName: Code Sign ESRP - CLI
    inputs:
      ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
      AppRegistrationClientId: ${{ parameters.signingIdentity.appId }}
      AppRegistrationTenantId: ${{ parameters.signingIdentity.tenantId }}
      AuthAKVName: ${{ parameters.signingIdentity.akvName }}
      AuthCertName: ${{ parameters.signingIdentity.authCertName }}
      AuthSignCertName: ${{ parameters.signingIdentity.signCertName }}
      FolderPath: '$(System.DefaultWorkingDirectory)/artifacts/cli/'
      # A glob, not a file list. Everything under artifacts/cli is copied verbatim into the
      # portable zip, the MSIX, the npm package and the CLI tools NuGet package, and the zip
      # carries no container signature at all - so a native dependency dropped next to winapp.exe
      # would otherwise ship unsigned with nothing to catch it. Already-signed third-party
      # binaries are re-signed rather than excluded, so compliance does not rest on a publisher
      # staying on Guardian's approved-policy list. The "Verify shipped binaries are signed" step
      # below is the backstop if this pattern ever stops matching something.
      Pattern: |
        **/*.exe
        **/*.dll
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                    "OpusName": "Microsoft Windows Developer SDK CLI",
                    "OpusInfo": "https://github.com/Microsoft/WinAppCli",
                    "FileDigest": "/fd \"SHA256\"",
                    "PageHash": "/PH",
                    "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
            },
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
            }
        ]
  - task: EsrpCodeSigning@6
    displayName: Code Sign ESRP - managed libraries
    inputs:
      ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
      AppRegistrationClientId: ${{ parameters.signingIdentity.appId }}
      AppRegistrationTenantId: ${{ parameters.signingIdentity.tenantId }}
      AuthAKVName: ${{ parameters.signingIdentity.akvName }}
      AuthCertName: ${{ parameters.signingIdentity.authCertName }}
      AuthSignCertName: ${{ parameters.signingIdentity.signCertName }}
      FolderPath: '$(System.DefaultWorkingDirectory)/src/'
      # The managed assemblies packed into the library NuGet packages. Only the assembly each
      # project actually packs is listed; the ProjectReference copy of the base library sitting
      # in the recording project's output is not shipped, it comes in as a package dependency.
      # The WinUI analyzer DLL is signed here too so the repack below (-SkipBuild) embeds a signed
      # copy in Microsoft.Windows.SDK.BuildTools.WinUIAnalyzer; signing the .nupkg alone would not
      # Authenticode-sign the DLL inside it.
      Pattern: |
        winapp-CLI/WinApp.UIAutomation/bin/Release/**/Microsoft.Windows.SDK.BuildTools.WinApp.UIAutomation.dll
        winapp-CLI/WinApp.UIAutomation.Recording/bin/Release/**/Microsoft.Windows.SDK.BuildTools.WinApp.UIAutomation.Recording.dll
        winapp-Analyzer/Microsoft.WindowsAppSDK.Analyzers/bin/Release/**/Microsoft.WindowsAppSDK.Analyzers.dll
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                    "OpusName": "Microsoft Windows Developer SDK CLI",
                    "OpusInfo": "https://github.com/Microsoft/WinAppCli",
                    "FileDigest": "/fd \"SHA256\"",
                    "PageHash": "/PH",
                    "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
            },
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
            }
        ]
  # build-cli.ps1 packed the .nupkg files before any signing ran, so those copies embed unsigned
  # binaries. Re-pack now that winapp.exe and the library assemblies are signed; -SkipBuild keeps
  # dotnet from recompiling and discarding the signatures. The NuGet signing task below then signs
  # the resulting packages themselves.
  - task: PowerShell@2
    displayName: Repack NuGet packages with signed binaries
    inputs:
      pwsh: true
      filePath: $(System.DefaultWorkingDirectory)\scripts\package-nuget.ps1
      arguments: "-Stable:$${{ parameters.stable }} -SkipBuild"
- task: PowerShell@2
  displayName: Package NPM
  env:
    NPM_CONFIG_USERCONFIG: $(System.DefaultWorkingDirectory)\.npmrc
  inputs:
    pwsh: true
    filePath: $(System.DefaultWorkingDirectory)\scripts\package-npm.ps1
    arguments: "-Stable:$${{ parameters.stable }}"
- task: PowerShell@2
  displayName: Bundle MSIX Packages
  inputs:
    pwsh: true
    filePath: $(System.DefaultWorkingDirectory)\scripts\package-msix.ps1
    arguments: "-Stable:$${{ parameters.stable }}"
- ${{ if eq(parameters['DoEsrp'], 'true') }}:
  - task: EsrpCodeSigning@6
    displayName: Code Sign ESRP - MSIX Packages
    inputs:
      ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
      AppRegistrationClientId: ${{ parameters.signingIdentity.appId }}
      AppRegistrationTenantId: ${{ parameters.signingIdentity.tenantId }}
      AuthAKVName: ${{ parameters.signingIdentity.akvName }}
      AuthCertName: ${{ parameters.signingIdentity.authCertName }}
      AuthSignCertName: ${{ parameters.signingIdentity.signCertName }}
      FolderPath: '$(System.DefaultWorkingDirectory)/artifacts/msix-packages/'
      Pattern: '*.msix'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                    "OpusName": "Microsoft Windows Developer SDK CLI",
                    "OpusInfo": "https://github.com/Microsoft/WinAppCli",
                    "FileDigest": "/fd \"SHA256\"",
                    "PageHash": "/PH",
                    "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
            },
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolVerify",
                "Parameters": {},
                "ToolName": "sign",
                "ToolVersion": "1.0"
            }
        ]
  - task: EsrpCodeSigning@6
    displayName: Code Sign ESRP - NuGet Packages
    inputs:
      ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
      AppRegistrationClientId: ${{ parameters.signingIdentity.appId }}
      AppRegistrationTenantId: ${{ parameters.signingIdentity.tenantId }}
      AuthAKVName: ${{ parameters.signingIdentity.akvName }}
      AuthCertName: ${{ parameters.signingIdentity.authCertName }}
      AuthSignCertName: ${{ parameters.signingIdentity.signCertName }}
      FolderPath: '$(System.DefaultWorkingDirectory)/artifacts/nuget/'
      Pattern: '*.nupkg'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [ 
            {
                "KeyCode": "CP-401405",
                "OperationCode": "NuGetSign",
                "Parameters": { },
                "ToolName": "sign",
                "ToolVersion": "1.0"
            },
            {
                "KeyCode": "CP-401405",
                "OperationCode": "NuGetVerify",
                "Parameters": { },
                "ToolName": "sign",
                "ToolVersion": "1.0"
            }
        ]
  # Guardian's Code Sign Validation is the pipeline's other signing gate, but it cannot catch a
  # regression here. It runs in the release jobs, over downloaded artifacts, in audit mode - so it
  # reports a warning on a job that still succeeds - and it never opens .msix or .tgz, so the
  # binaries users actually install are never inspected.
  #
  # Release 0.6.0 shipped through exactly that gap: build-cli.ps1 packs the .nupkg before any
  # signing runs, so Microsoft.Windows.SDK.BuildTools.WinApp.0.6.0.nupkg went out with an unsigned
  # tools/win-x64/winapp.exe. The repack step above removes the cause; this asserts the result, and
  # covers the portable zip, whose binaries carry no container signature to fall back on.
  #
  # Inside the DoEsrp block on purpose. DoEsrp is ANDed with rel/v* in release.yml, so the weekly
  # rehearsal on main signs nothing - asserting signatures there would fail every Monday by design.
  - task: PowerShell@2
    displayName: Verify shipped binaries are signed
    inputs:
      pwsh: true
      errorActionPreference: stop
      filePath: $(System.DefaultWorkingDirectory)\scripts\verify-signatures.ps1
      arguments: '-Path "$(System.DefaultWorkingDirectory)/artifacts/cli","$(System.DefaultWorkingDirectory)/artifacts/msix-packages","$(System.DefaultWorkingDirectory)/artifacts/nuget","$(System.DefaultWorkingDirectory)/artifacts/*.tgz"'
- task: CopyFiles@2
  displayName: Copy Artifacts - Test Results
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/'
    contents: '**/*.trx'
    targetFolder: '$(Build.ArtifactStagingDirectory)/TestResults'
- task: 1ES.PublishPipelineArtifact@1
  displayName: Upload Artifact - Test Results
  inputs:
    path: '$(Build.ArtifactStagingDirectory)/TestResults'
    artifactName: test-results
- task: CopyFiles@2
  displayName: Copy Artifacts - CLI Binaries
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/cli/'
    contents: '**'
    targetFolder: '$(Build.ArtifactStagingDirectory)/cli'
- task: 1ES.PublishPipelineArtifact@1
  displayName: Upload Artifact - CLI Binaries
  inputs:
    path: '$(Build.ArtifactStagingDirectory)/cli'
    artifactName: cli-binaries
- task: CopyFiles@2
  displayName: Copy Artifacts - NPM Package
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/'
    contents: '*.tgz'
    targetFolder: '$(Build.ArtifactStagingDirectory)/npmpackage'
- task: 1ES.PublishPipelineArtifact@1
  displayName: Upload Artifact - NPM Package
  inputs:
    path: '$(Build.ArtifactStagingDirectory)/npmpackage'
    artifactName: npm-package
- task: CopyFiles@2
  displayName: Copy Artifacts - MSIX packages
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/msix-packages/'
    contents: '*.msix'
    targetFolder: '$(Build.ArtifactStagingDirectory)/msix-packages'
- task: 1ES.PublishPipelineArtifact@1
  displayName: Upload Artifact - MSIX packages
  inputs:
    path: '$(Build.ArtifactStagingDirectory)/msix-packages'
    artifactName: msix-packages
- task: CopyFiles@2
  # Picks up all four packages: the CLI tools package, the two UI Automation library packages
  # (...WinApp.UIAutomation and ...WinApp.UIAutomation.Recording), and the standalone WinUI
  # analyzer package (...WinUIAnalyzer). The '*.nupkg' glob captures them all; build-cli.ps1
  # verifies the full set exists, and the ESRP NuGet signing step above globs the same folder.
  displayName: Copy Artifacts - NuGet packages
  inputs:
    sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/nuget/'
    contents: '*.nupkg'
    targetFolder: '$(Build.ArtifactStagingDirectory)/nuget-packages'
- task: 1ES.PublishPipelineArtifact@1
  displayName: Upload Artifact - NuGet packages
  inputs:
    path: '$(Build.ArtifactStagingDirectory)/nuget-packages'
    artifactName: nuget-packages
