trigger:
  branches:
    include:
      - rel/v*
  tags:
    exclude:
      - '*'
pr: none

# Weekly release rehearsal.
#
# ES/1ES policies change continuously and we kept discovering the breakage mid-release. This runs
# the REAL release pipeline every Monday against main, with only the final publishing actions
# omitted, so a policy or credential failure shows up days before anyone cuts rel/v*.
#
# Running it here rather than in a lookalike pipeline is the point: same 1ES Official template,
# same stages, same jobs, same tasks, same service connections. A separate pipeline can only ever
# approximate those.
schedules:
  - cron: '0 9 * * Mon'
    displayName: Weekly release dry run
    branches:
      include:
        - main
    # Without this a quiet week produces no run, and a quiet week is exactly when an external
    # policy change slips in unnoticed.
    always: true

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
  - name: DoEsrp
    displayName: Sign the binaries and package (DoEsrp)
    type: boolean
    default: true
  - name: signingIdentity
    type: object
    default:
      serviceName: $(SigningServiceName)
      appId: $(SigningAppId)
      tenantId: $(SigningTenantId)
      akvName: $(SigningAKVName)
      authCertName: $(SigningAuthCertName)
      signCertName: $(SigningSignCertName)
      signTTSCertName: $(SigningSignTTSCertName)
  - name: GitHubReleaseAlreadyExists
    displayName: GitHub Release already exists, skip uploading GitHub release (GitHubReleaseAlreadyExists)
    type: boolean
    default: false
  - name: PublishSymbols
    displayName: Publish symbols to symweb and MSDL (PublishSymbols)
    type: boolean
    default: true
  - name: symbolsIdentity
    type: object
    default:
      serviceConnection: $(SymbolPublishingServiceConnection)
      project: $(SymbolPublishingProject)

variables:
  # ---------------------------------------------------------------------------------------------
  # Release vs. rehearsal
  #
  # Every publishing action in this file is gated on the source branch starting with `rel/v`.
  # That is deliberate and it is NOT interchangeable with a parameter: Azure DevOps compiles both
  # scheduled AND branch-triggered runs with the DEFAULT values of `parameters:`, so a `dryRun`
  # parameter could not distinguish a Monday rehearsal from a real release - defaulting it false
  # would make the weekly run publish, and defaulting it true would make every real release ship
  # nothing. The branch can tell them apart; a parameter cannot.
  #
  # The condition is written as a positive test for `rel/v*` at every site, so an unexpected
  # branch fails CLOSED (publishes nothing) rather than open.
  #
  # Grep for `refs/heads/rel/v` to find every gate.
  # ---------------------------------------------------------------------------------------------

  # Declared once so the URL and its hash cannot drift apart across the stages that install gh.
  # To bump: take the version and its SHA-256 from the gh_<version>_checksums.txt asset published
  # with the release at https://github.com/cli/cli/releases.
  - name: GhCliUrl
    value: https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_windows_amd64.zip
  - name: GhCliSha256
    value: 35D7FE05C4DD1411FFDA1E73DFC7C6F44B75C936CA51FA6595C657FDC0350CEC

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      # CFSClean blocks NuGet endpoints, including publishing to api.nuget.org.
      networkIsolationPolicy: Permissive,CFSClean2
    sdl:
      policheck:
        enabled: true
        break: true
        severity: 'Warning'
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build
      jobs:
      - job: Build
        # NativeAOT for two architectures plus tests now runs past the 60-minute default.
        timeoutInMinutes: 120
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
          - template: ./.pipelines/templates/build-env.yaml@self
            parameters:
              dotnetSixForEsrp: ${{ parameters.DoEsrp }}
          - task: PowerShell@2
            displayName: Replace Stubbed Files
            inputs:
              filePath: '.pipelines/Unstub.ps1'
              arguments: '-TelemetryProviderGuid "$(TelemetryProviderGuid)"' 
          - template: ./.pipelines/templates/build.yaml@self
            parameters:
              stable: 'true'
              # ANDed with the branch on purpose. DoEsrp defaults to true and a scheduled run
              # compiles with defaults, so passing the parameter straight through would make the
              # weekly rehearsal ESRP-sign real binaries.
              DoEsrp: ${{ and(parameters.DoEsrp, startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v')) }}
              signingIdentity: ${{ parameters.signingIdentity }}
          - task: PowerShell@2
            name: SetMeta
            displayName: Export version
            inputs:
              targetType: inline
              script: |
                # Get version info
                $versionJson = Get-Content "version.json" | ConvertFrom-Json
                $baseVersion = $versionJson.version
                $fullVersion = "$baseVersion"

                Write-Host "Version: $fullVersion"

                Write-Host "##vso[task.setvariable variable=version;isOutput=true]$fullVersion"
          - task: PowerShell@2
            displayName: "Generate Release Notes"
            # Unconditional: generate-release-notes.ps1 catches its own API and model failures and
            # falls back to a git-log changelog, so it exits 0 either way. Gating this on the
            # rehearsal branch to make it a "hard gate" would be inert.
            #
            # Note there is no credential check for the AI path: GitHub Models was retired on
            # 2026-07-30 and returns 410 for every token, so a probe could never pass.
            continueOnError: true
            # Tokens only on the two branches that legitimately run this pipeline. An unrelated
            # branch someone queues gets the build and the asset preflight and no credentials.
            ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
              env:
                GH_TOKEN: $(GITHUB_TOKEN_2)
                GH_MODELS_TOKEN: $(GH_MODELS_TOKEN)
            inputs:
              pwsh: true
              filePath: '$(System.DefaultWorkingDirectory)/scripts/generate-release-notes.ps1'
              arguments: '-CurrentTag "v$(SetMeta.version)" -CurrentRef "$(Build.SourceVersion)" -OutputPath "$(Build.ArtifactStagingDirectory)/release-notes/release-notes.md"'
          - task: PowerShell@2
            displayName: "Compose Full Release Body"
            inputs:
              pwsh: true
              targetType: 'inline'
              script: |
                $outDir = "$(Build.ArtifactStagingDirectory)/release-notes"
                if (-not (Test-Path $outDir)) { New-Item -ItemType Directory -Path $outDir -Force | Out-Null }

                $aiNotes = ""
                $notesPath = "$outDir/release-notes.md"
                if (Test-Path $notesPath) {
                    $aiNotes = Get-Content $notesPath -Raw
                }

                $versionJson = Get-Content "version.json" | ConvertFrom-Json
                $fullVersion = $versionJson.version

                $lines = @(
                    "## Installation Options"
                    ""
                    "### MSIX Installer (Recommended)"
                    "1. Download ``winappcli_x64.msix`` for x64 or ``winappcli_arm64.msix`` for ARM64"
                    "2. Double-click to install"
                    "3. Automatically added to PATH"
                    ""
                    "### Standalone CLI Binaries"
                    "1. Download ``winappcli-x64.zip`` for x64 or ``winappcli-arm64.zip`` for ARM64"
                    "2. Extract to your desired location"
                    "3. Add to PATH or run directly: ``winapp.exe``"
                    ""
                    "### NPM Package (for Electron or NodeJS)"
                    "``````bash"
                    "npm install microsoft-winappcli.tgz"
                    "``````"
                    ""
                    "## What's Included"
                    "- MSIX installer packages (x64 and ARM64)"
                    "- Standalone CLI binaries (x64 and ARM64)"
                    "- NPM package for NodeJS/Electron integration"
                )
                $installationNotes = $lines -join "`n"

                $fullBody = "Version: ``$fullVersion```n"
                $fullBody += "Commit: ``$(Build.SourceVersion)```n`n"
                if ($aiNotes) {
                    $fullBody += $aiNotes + "`n`n---`n`n"
                }
                $fullBody += $installationNotes

                $fullBody | Set-Content "$outDir/full-release-notes.md" -Encoding UTF8 -NoNewline
                Write-Host "Release body written ($($fullBody.Length) chars)"
          # Asset-name preflight. Runs on EVERY build, release or rehearsal.
          #
          # The real rename happens later in Release_GitHub, which has no checkout and so cannot
          # run the verifier. Doing a dry rename on a copy here catches a naming regression before
          # the release job needs it - on a real release that is the difference between failing
          # early and silently publishing versioned asset names the WinGet URLs do not match (#568).
          - task: PowerShell@2
            displayName: Stage a copy of the release assets
            inputs:
              pwsh: true
              errorActionPreference: stop
              targetType: inline
              script: |
                $staging = "$(Agent.TempDirectory)\release-staging"
                if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
                foreach ($n in 'msix-packages', 'npmpackage', 'nuget-packages') {
                  $t = Join-Path $staging $n
                  New-Item -ItemType Directory -Path $t -Force | Out-Null
                  $s = "$(Build.ArtifactStagingDirectory)\$n"
                  if (Test-Path $s) { Copy-Item "$s\*" $t -Recurse -Force -ErrorAction SilentlyContinue }
                }
                # Release_GitHub archives the real winappcli-<arch>.zip. Just assert the inputs
                # exist here; the zips themselves are verified there.
                foreach ($arch in 'x64', 'arm64') {
                  if (-not (Test-Path "$(Build.ArtifactStagingDirectory)\cli\win-$arch\winapp.exe")) {
                    throw "winapp.exe missing for $arch. The release would publish an incomplete asset set."
                  }
                }

          - template: ./.pipelines/templates/release-assets.yaml@self
            parameters:
              displayName: Preflight - rename release assets on a copy
              msixPath: $(Agent.TempDirectory)\release-staging\msix-packages
              npmPath: $(Agent.TempDirectory)\release-staging\npmpackage
              nugetPath: $(Agent.TempDirectory)\release-staging\nuget-packages

          - task: PowerShell@2
            displayName: Preflight - assert asset name contract
            inputs:
              pwsh: true
              errorActionPreference: stop
              filePath: '$(System.DefaultWorkingDirectory)/scripts/verify-release-assets.ps1'
              arguments: '-StagingPath "$(Agent.TempDirectory)\release-staging"'

          # Rehearsal-only gates, restricted to `main` rather than "not a release branch".
          #
          # These hand production credentials to whatever is checked out, so the condition is a
          # POSITIVE test like every other gate in this file: a branch that is neither `main` nor
          # `rel/v*` compiles to neither a release nor a credentialed rehearsal, and just gets the
          # build plus the asset preflight above.
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload Artifact - Release Notes
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/release-notes'
              artifactName: release-notes
          - task: PowerShell@2
            displayName: "Stage MS Learn doc source"
            inputs:
              pwsh: true
              targetType: 'inline'
              script: |
                # Publish the files the MS Learn port step needs as an artifact
                # (1ES release jobs can't checkout the repo). Layout mirrors the
                # repo so the script's $ProjectRoot resolves docs/ and version.json.
                $staging = "$(Build.ArtifactStagingDirectory)/mslearn-source"
                New-Item -ItemType Directory -Path "$staging/scripts" -Force | Out-Null
                Copy-Item "$(System.DefaultWorkingDirectory)/scripts/port-mslearn-docs.ps1" "$staging/scripts/" -Force
                Copy-Item "$(System.DefaultWorkingDirectory)/scripts/validate-mslearn-docs.ps1" "$staging/scripts/" -Force
                Copy-Item "$(System.DefaultWorkingDirectory)/scripts/prune-date-only-doc-changes.ps1" "$staging/scripts/" -Force
                Copy-Item "$(System.DefaultWorkingDirectory)/scripts/mslearn-doc-lib.ps1" "$staging/scripts/" -Force
                Copy-Item "$(System.DefaultWorkingDirectory)/docs" "$staging/docs" -Recurse -Force
                Copy-Item "$(System.DefaultWorkingDirectory)/version.json" "$staging/" -Force
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload Artifact - MS Learn Source
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/mslearn-source'
              artifactName: mslearn-source

    - stage: Release_GitHub
      displayName: Create GitHub Release
      dependsOn: Build
      variables:
        version: $[ stageDependencies.Build.Build.outputs['SetMeta.version'] ]
      jobs:
      - job: create_github_release
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        displayName: GitHub Release
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: cli-binaries
            targetPath: $(Pipeline.Workspace)/cli-binaries
          - input: pipelineArtifact
            artifactName: npm-package
            targetPath: $(Pipeline.Workspace)/npm-package
          - input: pipelineArtifact
            artifactName: msix-packages
            targetPath: $(Pipeline.Workspace)/msix-packages
          - input: pipelineArtifact
            artifactName: release-notes
            targetPath: $(Pipeline.Workspace)/release-notes
          - input: pipelineArtifact
            artifactName: nuget-packages
            targetPath: $(Pipeline.Workspace)/nuget-packages
        steps:
          - task: ArchiveFiles@2
            displayName: Archive CLI binaries - x64
            inputs:
              rootFolderOrFile: $(Pipeline.Workspace)/cli-binaries/win-x64
              includeRootFolder: false
              archiveFile: $(Pipeline.Workspace)/winappcli-x64.zip

          - task: ArchiveFiles@2
            displayName: Archive CLI binaries - arm64
            inputs:
              rootFolderOrFile: $(Pipeline.Workspace)/cli-binaries/win-arm64
              includeRootFolder: false
              archiveFile: $(Pipeline.Workspace)/winappcli-arm64.zip
          
          - template: ./.pipelines/templates/release-assets.yaml@self
            parameters:
              displayName: Rename files
              msixPath: $(Pipeline.Workspace)/msix-packages
              npmPath: $(Pipeline.Workspace)/npm-package
              nugetPath: $(Pipeline.Workspace)/nuget-packages

          # The Build preflight cannot check these - the archives do not exist until the two
          # ArchiveFiles steps above. Their names are hardcoded in the WinGet installer URLs
          # further down and in the documented download links, and the upload glob below is
          # winappcli-*.zip, so a renamed archive would upload happily under the wrong name and
          # only 404 later. Assert them here, where they exist.
          - task: PowerShell@2
            displayName: Verify portable archive names
            inputs:
              targetType: 'inline'
              errorActionPreference: 'stop'
              script: |
                foreach ($arch in 'x64', 'arm64') {
                  $zip = "$(Pipeline.Workspace)/winappcli-$arch.zip"
                  if (-not (Test-Path $zip)) {
                    Write-Error "Missing portable archive 'winappcli-$arch.zip'. The WinGet manifest hardcodes its URL."
                    exit 1
                  }
                  if ((Get-Item $zip).Length -le 0) {
                    Write-Error "Portable archive 'winappcli-$arch.zip' is empty."
                    exit 1
                  }
                  Write-Host "[ASSETS] ZIP: winappcli-$arch.zip"
                }

          - ${{ if and(ne(parameters.GitHubReleaseAlreadyExists, 'true'), startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v')) }}:
            - task: GitHubRelease@1
              displayName: "Create GitHub Release"
              inputs:
                gitHubConnection: 'github-service-connection'
                repositoryName: 'microsoft/winappcli'
                action: 'create'
                target: '$(Build.SourceVersion)'
                tagSource: 'userSpecifiedTag'
                tag: 'v$(version)'
                title: 'Release v$(version)'
                isPreRelease: true
                assets: |
                  $(Pipeline.Workspace)/winappcli-*.zip
                  $(Pipeline.Workspace)/msix-packages/*.msix
                  $(Pipeline.Workspace)/npm-package/*.tgz
                  $(Pipeline.Workspace)/nuget-packages/*.nupkg
                assetUploadMode: 'delete'
                addChangeLog: false
                releaseNotesSource: 'filePath'
                releaseNotesFilePath: '$(Pipeline.Workspace)/release-notes/full-release-notes.md'

    - ${{ if and(eq(parameters.PublishSymbols, 'true'), startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v')) }}:
      - stage: Publish_Symbols
        displayName: Publish Symbols
        # Build supplies the version output; Release_GitHub gates on the release actually shipping, so
        # a failed release cannot leave century-retention symbols published for a build nobody has.
        dependsOn:
          - Build
          - Release_GitHub
        variables:
          version: $[ stageDependencies.Build.Build.outputs['SetMeta.version'] ]
          # Used twice: as the PublishSymbols@2 artifact name and as the request name the symbol API
          # promotes. They must be identical or the request finds nothing to publish. The attempt is
          # part of the name so a re-run creates a fresh request instead of colliding with its own.
          SymbolsArtifactName: 'WinAppCLI_$(version)_$(Build.BuildNumber)_$(System.JobAttempt)'
        jobs:
        - job: publish_symbols
          displayName: Publish Symbols to symweb and MSDL
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: cli-binaries
              targetPath: $(Pipeline.Workspace)/symbolStaging
          steps:
            - task: AzurePowerShell@5
              displayName: Acquire symbol request API token
              inputs:
                azureSubscription: ${{ parameters.symbolsIdentity.serviceConnection }}
                azurePowerShellVersion: LatestVersion
                pwsh: true
                ScriptType: InlineScript
                Inline: |-
                  $token = (Get-AzAccessToken -AsSecureString -ResourceUrl api://30471ccf-0966-45b9-a979-065dbedb24c1).Token |
                      ConvertFrom-SecureString -AsPlainText
                  Write-Host "##vso[task.setvariable variable=SymbolAccessToken;issecret=true]$token"

            # Uploads to the symbol service of the ADO org this pipeline runs in (microsoft), which is
            # why the symbol project's source organization must be `microsoft` rather than the default.
            - task: PublishSymbols@2
              displayName: Upload PDBs to the Azure DevOps symbol service
              inputs:
                SymbolsFolder: $(Pipeline.Workspace)/symbolStaging
                SearchPattern: '**/*.pdb'
                SymbolServerType: TeamServices
                SymbolsProduct: WinAppCLI
                SymbolsVersion: $(version)
                SymbolsArtifactName: $(SymbolsArtifactName)
                # ~100 years. The standalone reference script defaults to 6 days, which would silently
                # expire the symbols for a shipped release.
                SymbolExpirationInDays: 36530
                # Non-mandatory per the requirement, and srcsrv indexing does not map cleanly onto a
                # GitHub-sourced NativeAOT build. Tracked separately.
                IndexSources: false
                DetailedLog: true
                SymbolsMaximumWaitTime: 30

            - pwsh: |-
                $ErrorActionPreference = 'Stop'
                $PSDefaultParameterValues['Invoke-RestMethod:Headers'] = @{ Authorization = "Bearer $(SymbolAccessToken)" }
                $PSDefaultParameterValues['Invoke-RestMethod:ContentType'] = 'application/json'
                $PSDefaultParameterValues['Invoke-RestMethod:Method'] = 'POST'

                # The symbol project name is CASE SENSITIVE and must match the provisioned project
                # exactly, or the request 404s.
                $baseUri = "https://symbolrequestprod.trafficmanager.net/projects/${{ parameters.symbolsIdentity.project }}/requests"

                # Round-trip UTC: the service binds this to a DateTime, and a culture-formatted
                # string would be ambiguous on a non-en-US agent.
                $createBody = @{
                    requestName    = '$(SymbolsArtifactName)'
                    expirationTime = [DateTime]::UtcNow.AddDays(36530).ToString('o')
                }
                Write-Host "Registering symbol request $($createBody.requestName)"
                Invoke-RestMethod -Uri $baseUri -Body ($createBody | ConvertTo-Json -Compress)

                # Public symbols land on MSDL stripped: with no allowed-private-symbols policy on the
                # project, the service strips the private data out of the PDB before it goes external.
                $publishBody = @{
                    publishToInternalServer = $true
                    publishToPublicServer   = $true
                }
                Write-Host "Promoting $($createBody.requestName) to symweb and MSDL"
                Invoke-RestMethod -Uri "$baseUri/$($createBody.requestName)" -Body ($publishBody | ConvertTo-Json -Compress)
              displayName: Request publication to symweb and MSDL

    - ${{ if and(eq(parameters.DoEsrp, 'true'), startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v')) }}:
      - stage: Release_Npm
        displayName: Create Npm Release
        dependsOn: Release_GitHub
        jobs:
        - job: create_npm_release
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: NPM Release
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: npm-package
              targetPath: $(Pipeline.Workspace)/npm-package
          steps:
            - task: PowerShell@2
              displayName: "Echo debug info"
              inputs:
                targetType: 'inline'
                script: |
                  Write-Host "SigningServiceName: ${{ parameters.signingIdentity.serviceName }}"
            - task: EsrpRelease@10
              condition: always()
              inputs:
                ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                usemanagedidentity: false
                keyvaultname: ${{ parameters.signingIdentity.akvName }}
                authcertname: ${{ parameters.signingIdentity.authCertName }}
                signcertname: ${{ parameters.signingIdentity.signCertName }}
                clientid: ${{ parameters.signingIdentity.appId }}
                intent: 'PackageDistribution'
                contenttype: 'npm'
                contentsource: 'Folder'
                folderlocation: $(Pipeline.Workspace)/npm-package/
                waitforreleasecompletion: true
                owners: '$(EsrpOwnersEmail)'
                approvers: '$(EsrpApproversEmail)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: ${{ parameters.signingIdentity.tenantId }}

    - ${{ if and(eq(parameters.DoEsrp, 'true'), startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v')) }}:
      - stage: Release_NuGet
        displayName: Publish the NuGet Release
        dependsOn: Release_GitHub
        jobs:
        - job: create_nuget_release
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: NuGet Release
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: nuget-packages
              targetPath: $(Pipeline.Workspace)/nuget-packages
          steps:
            - task: 1ES.PublishNuget@1
              displayName: 'NuGet push to nuget.org'
              retryCountOnTaskFailure: 2
              inputs:
                # nuget.exe rather than DotNetCoreCLI@2, which cannot use the encrypted API key
                # from the NuGet-WinAppCLI service connection. Lost when #795 reverted the split
                # pipeline back into this file; without it the push fails to authenticate.
                useDotNetTask: false
                packagesToPush: '$(Pipeline.Workspace)/nuget-packages/*.nupkg'
                packageParentPath: '$(Pipeline.Workspace)/nuget-packages'
                nuGetFeedType: external
                publishFeedCredentials: 'NuGet-WinAppCLI'

    - stage: Release_WinGet
      displayName: Create WinGet Release
      # Skipped outside the two branches that legitimately run this pipeline. Both this stage and
      # Release_MSLearn hand GITHUB_TOKEN_2 to scripts read off the source branch, so an unrelated
      # branch must not reach them - the WINGET_SUBMIT / MSLEARN_PUBLISH gates stop the publishing,
      # not the token exposure. (Defense in depth only: the authoritative control is a Branch
      # control check on the service connections, per .pipelines/README.md.)
      condition: >-
        and(succeeded(),
            or(startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v'),
               eq(variables['Build.SourceBranch'], 'refs/heads/main')))
      dependsOn: [Build, Release_GitHub]
      variables:
        version: $[ stageDependencies.Build.Build.outputs['SetMeta.version'] ]
      jobs:
      - job: create_winget_release
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        displayName: WinGet Release
        templateContext:
          type: releaseJob
          isProduction: true
        steps:
          - task: PowerShell@2
            displayName: "Publish to WinGet"
            env:
              # PAT lasts 90 days, regenerate as needed and re-run if it failes due to authentication
              WINGET_CREATE_GITHUB_TOKEN: $(GITHUB_TOKEN_2)
              GH_TOKEN: $(GITHUB_TOKEN_2)
              # Read through env rather than ADO macro expansion, so the value cannot be pasted
              # into the script body as code. Validated below before use.
              WINGET_PKGS_FORK: $(WingetPkgsFork)
              # Always defined, so the script cannot inherit a WINGET_SUBMIT from the agent
              # environment. Only 'true' publishes.
              ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v') }}:
                WINGET_SUBMIT: 'true'
              ${{ else }}:
                WINGET_SUBMIT: 'false'
            inputs:
              targetType: 'inline'
              errorActionPreference: 'stop'
              script: |
                # Download and install C++ Runtime framework package
                Write-Host "Installing VCLibs dependency..."
                $vcLibsFile = "Microsoft.VCLibs.x64.14.00.Desktop.appx"
                Invoke-WebRequest https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx -OutFile $vcLibsFile
                Add-AppxPackage $vcLibsFile
                
                # Install gh with integrity verification
                Write-Host "Installing gh..."
                $tempDir = "$(Agent.TempDirectory)"
                Write-Host "TempDir: $tempDir"
                $ghZipPath = "$tempDir\gh.zip"
                Invoke-WebRequest -Uri "$(GhCliUrl)" -OutFile $ghZipPath
                $actualHash = (Get-FileHash $ghZipPath -Algorithm SHA256).Hash
                if ($actualHash -ne "$(GhCliSha256)") {
                  Write-Error "SHA-256 mismatch for gh.zip! Expected: $(GhCliSha256), Got: $actualHash"
                  exit 1
                }
                Expand-Archive $ghZipPath -DestinationPath "$tempDir\gh"

                # Download and install wingetcreate
                Write-Host "Installing wingetcreate..."
                $wingetCreateBundle = "wingetcreate.msixbundle"
                Invoke-WebRequest https://aka.ms/wingetcreate/latest/msixbundle -OutFile $wingetCreateBundle
                Add-AppxPackage $wingetCreateBundle

                # Validate the fork value before it reaches a command line. Read from env, not ADO
                # macro expansion, so a value containing ';' cannot become a statement separator.
                $wingetFork = $env:WINGET_PKGS_FORK
                if (-not $wingetFork -or $wingetFork -notmatch '^[\w.-]+/[\w.-]+$') {
                  Write-Error "Invalid or missing WingetPkgsFork value: '$wingetFork'. Expected format: 'owner/repo'."
                  exit 1
                }

                # WinGetCreate uses an existing fork of the microsoft/winget-pkgs repo to create the PR
                # that updates the main repo.  This fork will be under the account attached to the token.
                # We need to keep this fork up-to-date, otherwise the wingetcreate command will fail.
                # See: https://github.com/microsoft/winget-create/issues/502
                #
                # Skipped in a rehearsal: syncing mutates the fork, and nothing is submitted anyway.
                # Push access to the fork is asserted by check-release-credentials.ps1 in Build.
                if ($env:WINGET_SUBMIT -eq 'true') {
                  Write-Host "Syncing winget-pkgs fork..."
                  & "$tempDir\gh\bin\gh.exe" repo sync $wingetFork -b master
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to sync winget-pkgs fork. Exit code: $LASTEXITCODE"
                    exit $LASTEXITCODE
                  }
                  Write-Host "Fork synced successfully."
                }
                
                # Get the installer URLs from the GitHub release
                # Order must match the winget manifest: x64 MSIX, arm64 MSIX, x64 portable zip, arm64 portable zip
                $manifestVersion = "$(version)"
                if ($env:WINGET_SUBMIT -ne 'true') {
                  # A rehearsal runs before any release exists for $(version), so its installer URLs
                  # would 404 when wingetcreate downloads them to hash. Rehearse against the last
                  # PUBLISHED release instead - that still exercises the download, the hashing and
                  # the manifest schema, which is where submissions actually break (#568).
                  #
                  # Not /releases/latest: that excludes prereleases, and this pipeline publishes
                  # every release with isPreRelease: true, so it would rehearse an ever-staler
                  # version or 404 once no stable release remains. The list endpoint keeps
                  # prereleases, but an authenticated list also includes DRAFTS - whose assets are
                  # not downloadable - so drop those and take the first real one.
                  $latest = & "$tempDir\gh\bin\gh.exe" api "repos/microsoft/winappcli/releases?per_page=20" `
                    --jq 'map(select(.draft == false)) | .[0].tag_name'
                  if ($LASTEXITCODE -ne 0 -or -not $latest -or $latest.Trim() -eq 'null') {
                    Write-Error "Could not resolve a published (non-draft) release to rehearse against."
                    exit 1
                  }
                  $manifestVersion = $latest.Trim().TrimStart('v')
                  Write-Host "[REHEARSAL] Using last published release v$manifestVersion for URL validation."
                }

                $base = "https://github.com/microsoft/winappcli/releases/download/v$manifestVersion"
                $x64MsixUrl = "$base/winappcli_x64.msix"
                $arm64MsixUrl = "$base/winappcli_arm64.msix"
                $x64ZipUrl = "$base/winappcli-x64.zip"
                $arm64ZipUrl = "$base/winappcli-arm64.zip"
                
                Write-Host "Version: $manifestVersion"
                Write-Host "x64 MSIX: $x64MsixUrl"
                Write-Host "ARM64 MSIX: $arm64MsixUrl"
                Write-Host "x64 Portable: $x64ZipUrl"
                Write-Host "ARM64 Portable: $arm64ZipUrl"
                
                if ($env:WINGET_SUBMIT -eq 'true') {
                  Write-Host "Submitting to WinGet..."
                  wingetcreate update Microsoft.WinAppCli `
                    --version $manifestVersion `
                    --urls $x64MsixUrl $arm64MsixUrl $x64ZipUrl $arm64ZipUrl `
                    --submit
                } else {
                  # Same command minus --submit: manifests are written locally and thrown away.
                  # Nothing is pushed and no PR is opened.
                  Write-Host "[REHEARSAL] Generating manifest without submitting..."
                  $manifestDir = "$tempDir\winget-manifests"
                  wingetcreate update Microsoft.WinAppCli `
                    --version $manifestVersion `
                    --urls $x64MsixUrl $arm64MsixUrl $x64ZipUrl $arm64ZipUrl `
                    --out $manifestDir
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "wingetcreate manifest generation failed. A real submission would also fail. Exit code: $LASTEXITCODE"
                    exit $LASTEXITCODE
                  }
                  $manifests = Get-ChildItem $manifestDir -Recurse -Filter '*.yaml' -ErrorAction SilentlyContinue
                  if (-not $manifests) {
                    Write-Error "wingetcreate produced no manifest files."
                    exit 1
                  }
                  Write-Host "[REHEARSAL] Generated $($manifests.Count) manifest file(s). Nothing submitted."
                }

    - stage: Release_MSLearn
      displayName: Update MS Learn Docs
      # See Release_WinGet above - same reasoning, same gate.
      condition: >-
        and(succeeded(),
            or(startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v'),
               eq(variables['Build.SourceBranch'], 'refs/heads/main')))
      dependsOn: [Build, Release_GitHub]
      variables:
        version: $[ stageDependencies.Build.Build.outputs['SetMeta.version'] ]
      jobs:
      - job: update_mslearn_docs
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        displayName: MS Learn Docs PR
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: mslearn-source
            targetPath: $(Pipeline.Workspace)/mslearn-source
        steps:
          - task: PowerShell@2
            displayName: "Create MS Learn Docs PR"
            env:
              GH_TOKEN: $(GITHUB_TOKEN_2)
              MSLEARN_DOCS_FORK: $(MSLearnDocsFork)
              # Always defined, so the script cannot inherit an MSLEARN_PUBLISH from the agent
              # environment. Only 'true' pushes and opens a PR.
              ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/rel/v') }}:
                MSLEARN_PUBLISH: 'true'
              ${{ else }}:
                MSLEARN_PUBLISH: 'false'
            inputs:
              targetType: 'inline'
              pwsh: true
              errorActionPreference: 'stop'
              script: |
                $version = "$(version)"
                $docsRepoBase = "hub/apps/dev-tools/winapp-cli"
                $docsUpstream = "MicrosoftDocs/windows-dev-docs-pr"
                $branch = "winapp-cli/v$version"

                # Validate docs fork from env var (not ADO macro expansion)
                $docsFork = $env:MSLEARN_DOCS_FORK
                if (-not $docsFork -or $docsFork -notmatch '^[\w-]+/[\w.-]+$') {
                  Write-Error "Invalid or missing MSLearnDocsFork value: '$docsFork'. Expected format: 'owner/repo'."
                  exit 1
                }
                $docsForkOwner = $docsFork.Split('/')[0]

                # Install gh with integrity verification
                Write-Host "Installing gh..."
                $tempDir = "$(Agent.TempDirectory)"
                $ghZipPath = "$tempDir\gh.zip"
                Invoke-WebRequest -Uri "$(GhCliUrl)" -OutFile $ghZipPath
                $actualHash = (Get-FileHash $ghZipPath -Algorithm SHA256).Hash
                if ($actualHash -ne "$(GhCliSha256)") {
                  Write-Error "SHA-256 mismatch for gh.zip! Expected: $(GhCliSha256), Got: $actualHash"
                  exit 1
                }
                Expand-Archive $ghZipPath -DestinationPath "$tempDir\gh"
                $ghExe = "$tempDir\gh\bin\gh.exe"

                # Configure git to authenticate as gh (uses GH_TOKEN) so raw `git push`
                # against the HTTPS remote doesn't prompt for credentials.
                Write-Host "Configuring git credential helper via gh..."
                & $ghExe auth setup-git
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to configure git auth via gh. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }

                # Sync the fork with upstream. Skipped in a rehearsal: it mutates the fork, and
                # nothing gets pushed anyway. Push access is asserted by
                # check-release-credentials.ps1 in Build, which checks the permission rather than
                # just reachability.
                if ($env:MSLEARN_PUBLISH -eq 'true') {
                  Write-Host "Syncing docs repo fork..."
                  & $ghExe repo sync $docsFork -b main
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to sync docs repo fork. Exit code: $LASTEXITCODE"
                    exit $LASTEXITCODE
                  }
                  Write-Host "Fork synced successfully."
                }

                # Clone the fork
                Write-Host "Cloning docs repo fork..."
                $docsDir = "$tempDir\windows-dev-docs-pr"
                & $ghExe repo clone $docsFork $docsDir -- --depth 1
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to clone docs repo. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }

                # Run the port script to generate MS Learn-ready docs
                Write-Host "Running port script..."
                $portOutput = "$tempDir\mslearn-docs"
                & "$(Pipeline.Workspace)\mslearn-source\scripts\port-mslearn-docs.ps1" `
                  -OutputPath $portOutput `
                  -Version $version
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Port script failed. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }

                # Clean target dir to remove stale files, then copy ported docs
                Write-Host "Copying ported docs to docs repo..."
                $targetDir = Join-Path $docsDir $docsRepoBase
                if (Test-Path $targetDir) {
                  Remove-Item "$targetDir\*" -Recurse -Force
                } else {
                  New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
                }
                Copy-Item "$portOutput\*" $targetDir -Recurse -Force

                # Create branch and commit
                Write-Host "Creating branch and committing..."
                Push-Location $docsDir
                git config user.name "winapp-cli-bot"
                git config user.email "winapp-cli-bot@users.noreply.github.com"
                git checkout -B $branch

                # Every page is restamped with today's ms.date, so pages that did not
                # otherwise change would show up as date-only diffs and bury the real
                # edits for the docs-repo reviewer. Drop them before staging.
                & "$(Pipeline.Workspace)\mslearn-source\scripts\prune-date-only-doc-changes.ps1" `
                  -RepoPath $docsDir `
                  -PathSpec $docsRepoBase
                if ($LASTEXITCODE -ne 0) {
                  Pop-Location
                  Write-Error "Failed to prune date-only doc changes. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }

                git add -A
                git diff --cached --quiet
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "No changes detected. Docs are already up to date."
                  Pop-Location
                  exit 0
                }
                git commit -m "Update winapp CLI docs to v$version"
                if ($LASTEXITCODE -ne 0) {
                  Pop-Location
                  Write-Error "Failed to commit. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }

                # A rehearsal stops here. Everything above - clone, port, validate, prune, commit -
                # has run for real against this week's docs, which is where the failures are. The
                # push and the PR are the only parts skipped.
                if ($env:MSLEARN_PUBLISH -ne 'true') {
                  $changed = (git diff --name-only HEAD~1 HEAD | Measure-Object -Line).Lines
                  Pop-Location
                  Write-Host "[REHEARSAL] Docs ported, validated and committed locally ($changed file(s) changed)."
                  Write-Host "[REHEARSAL] Not pushing and not opening a PR."
                  exit 0
                }

                git push --force-with-lease origin $branch
                if ($LASTEXITCODE -ne 0) {
                  Pop-Location
                  Write-Error "Failed to push branch. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }
                Pop-Location

                # Create PR (or update if one already exists for this branch)
                Write-Host "Creating PR..."
                $prTitle = "Update winapp CLI docs to v$version"
                $prBody = @"
                Automated update of winapp CLI documentation for v$version.

                Changes generated by the winapp CLI release pipeline using ``port-mslearn-docs.ps1``.

                Source: [microsoft/winappCli v$version](https://github.com/microsoft/WinAppCli/releases/tag/v$version)

                Please review the changes and merge when ready.
                "@

                # Check if a PR already exists for this branch
                $existingPr = & $ghExe pr list --repo $docsUpstream --head "${docsForkOwner}:${branch}" --json number --jq '.[0].number' 2>$null
                if ($existingPr) {
                  Write-Host "PR #$existingPr already exists. Updating..."
                  & $ghExe pr edit $existingPr `
                    --repo $docsUpstream `
                    --title $prTitle `
                    --body $prBody
                } else {
                  & $ghExe pr create `
                    --repo $docsUpstream `
                    --head "${docsForkOwner}:${branch}" `
                    --base main `
                    --title $prTitle `
                    --body $prBody
                }

                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to create/update PR. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }

                Write-Host "PR created/updated successfully."

    # Runs LAST and only on the rehearsal branch, so a dead credential turns the weekly run RED
    # without preventing the WinGet and MS Learn rehearsals from executing first - those are where
    # releases have actually broken (#568, #685, #777). Deliberately has no continueOnError: an
    # invisible credential check is worse than none, because the whole point of the rehearsal is
    # that someone notices.
    - stage: Verify_Release_Credentials
      displayName: Verify Release Credentials (rehearsal)
      dependsOn: [Build, Release_GitHub, Release_WinGet, Release_MSLearn]
      condition: >-
        and(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
            in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues'))
      jobs:
      - job: verify_credentials
        displayName: Credentials and Service Connections
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Check release credentials
            env:
              GH_TOKEN: $(GITHUB_TOKEN_2)
              GH_MODELS_TOKEN: $(GH_MODELS_TOKEN)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              pwsh: true
              errorActionPreference: stop
              filePath: '$(System.DefaultWorkingDirectory)/scripts/check-release-credentials.ps1'
              arguments: >-
                -WingetPkgsFork "$(WingetPkgsFork)"
                -MSLearnDocsFork "$(MSLearnDocsFork)"
                -ServiceConnections "github-service-connection","$(SigningServiceName)","$(SymbolPublishingServiceConnection)","NuGet-WinAppCLI"