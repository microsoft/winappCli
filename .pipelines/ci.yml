trigger:
  branches:
    include:
      - main
      - dev/**
  tags:
    exclude:
      - '*'
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    sdl:
      policheck:
        enabled: true
        break: true
        severity: 'Warning'
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build
      jobs:
      - job: Build
        # Same build as the release pipeline, which has already exceeded the 60-minute default.
        timeoutInMinutes: 120
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          # Match the VS 18 compiler that GitHub Actions uses; windows-latest still has VS 2022.
          image: windows-2025
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
          - template: ./.pipelines/templates/build-env.yaml@self
          - template: ./.pipelines/templates/build.yaml@self
            parameters:
              stable: 'false'
              DoEsrp: false
              signingIdentity: {}