const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true">${ICONS[name] || ""}</svg>`;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (iso) => {
  if (!iso) return "";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
};
const when = (iso) => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const dur = (iso) => {
  const h = (Date.now() - new Date(iso).getTime()) / 3600000;
  if (!iso || h < 0) return "";
  if (h < 1) return Math.max(1, Math.round(h * 60)) + " min";
  if (h < 48) { const n = Math.round(h); return n + (n === 1 ? " hour" : " hours"); }
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day" : " days");
};

// Safe Markdown: everything is escaped first; only code, bold, italics, http(s)
// links, lists, headings, quotes and pipe tables become markup.
function md(src) {
  const blocks = [];
  const text = String(src ?? "").replace(/\r\n/g, "\n").replace(/```[^\n]*\n([\s\S]*?)(```|$)/g, (_, code) => {
    blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `\n\u0000${blocks.length - 1}\u0000\n`;
  });
  const inline = (s) => {
    const codes = [];
    s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(`<code>${c}</code>`); return `\u0001${codes.length - 1}\u0001`; });
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">Image: ${t || "open"}</a>`)
         .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
         .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
         .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
         .replace(/(^|[\s(])_([^_\s][^_]*)_/g, "$1<em>$2</em>");
    return s.replace(/\u0001(\d+)\u0001/g, (_, i) => codes[i]);
  };
  const out = [];
  let list = null, para = [], table = null, quote = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const flushQuote = () => { if (quote.length) { out.push(`<blockquote>${quote.map(inline).join("<br>")}</blockquote>`); quote = []; } };
  const flushTable = () => {
    if (!table) return;
    const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim())));
    out.push(`<table>${rows.map((r, i) => `<tr>${r.map((c) => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`);
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); flushTable(); };
  for (const line of text.split("\n")) {
    const block = line.match(/^\u0000(\d+)\u0000$/);
    const ul = line.match(/^\s*[-*+]\s+(?:\[[ xX]\]\s+)?(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (block) { flushAll(); out.push(blocks[block[1]]); }
    else if (/^\s*\|/.test(line)) { flushPara(); flushList(); flushQuote(); (table ??= []).push(line); }
    else if (/^\s*>/.test(line)) { flushPara(); flushList(); flushTable(); quote.push(line.replace(/^\s*>\s?/, "")); }
    else if (ul || ol) {
      flushPara(); flushQuote(); flushTable();
      const tag = ul ? "ul" : "ol";
      if (list && list.tag !== tag) flushList();
      list ??= { tag, items: [] };
      list.items.push((ul || ol)[1]);
    } else if (h) { flushAll(); out.push(`<div class="h h${Math.min(h[1].length, 3)}">${inline(h[2])}</div>`); }
    else if (!line.trim()) flushAll();
    else { flushList(); flushQuote(); flushTable(); para.push(line); }
  }
  flushAll();
  return out.join("");
}
const mdInline = (s) => md(s).replace(/^<p>|<\/p>$/g, "");
// PR descriptions: drop template comments and raw HTML tags before rendering.
const cleanBody = (s) => String(s || "").replace(/<!--[\s\S]*?-->/g, "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/?(details|summary|sub|sup|p|div|span|b|i|em|strong|kbd|img|a)\b[^>]*>/gi, "").replace(/\n{3,}/g, "\n\n").trim();

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 5000);
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-PR-Board-Token": TOKEN }, body: JSON.stringify({ repo: REPO, ...body }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

const DONE_TOAST = { review: "Asked the agent for a review", post: "Asked the agent to post the draft", ship: "Asked the agent to ship it", summarize: "Asked the agent for a summary", explain: "Asked the agent to explain it", "post-findings": "Asked the agent to post the review", "open-chat": "Asked the agent to open the chat", reset: "Agent status reset" };
async function act(pr, action, extra = {}) {
  try { await post("/api/action", { pr, action, ...extra }); toast(DONE_TOAST[action] || "Done"); }
  catch (e) { toast("Couldn't do that: " + e.message); }
}

// ---- Status vocabulary ----
const CI = { passing: ["checkCircle", "tone-ok", "CI passing"], failing: ["xCircle", "tone-bad", "CI failing"], pending: ["running", "tone-run", "CI running"], none: ["dash", "tone-mute", "No CI"] };
const REVIEW = { APPROVED: ["checkCircle", "tone-ok", "approved"], CHANGES_REQUESTED: ["xCircle", "tone-bad", "requested changes"], COMMENTED: ["comment", "tone-mute", "commented"], DISMISSED: ["dash", "tone-mute", "dismissed"] };
const AGENT = { running: "Agent working", waiting: "Needs your input", waiting_on_others: "Waiting on others", draft_ready: "Draft ready", done: "Done", failed: "Failed" };
const RISK = { low: ["checkCircle", "tone-ok", "Low risk"], medium: ["alert", "tone-run", "Medium risk"], high: ["alert", "tone-bad", "High risk"] };
// Short chip labels for the waiting reasons computed on the server.
const SHORT = {
  "Waiting on your review": ["eye", "Your review"],
  "Author responded, needs re-review": ["eye", "Your re-review"],
  "Changes requested, no response": ["xCircle", "Author: changes requested"],
  "Draft, author still working": ["pencil", "Draft"],
  "Author still preparing it": ["running", "Author: preparing"],
  "Your agent is preparing it": ["sparkle", "Your agent: preparing"],
  "Author's agent is blocked": ["alert", "Author: blocked"],
  "Merge conflicts": ["alert", "Author: conflicts"],
  "Approval doesn't count": ["person", "Needs approver"],
  "Waiting on a reviewer": ["person", "Needs reviewer"],
  "Waiting on other reviewers": ["person", "Needs reviewer"],
  "Approved, blocked": ["alert", "Approved · blocked"],
  "Approved, waiting on CI": ["running", "Approved · CI"],
  "Auto-merge on": ["queue", "Approved · auto-merge"],
  "Ready to ship": ["checkCircle", "Ready to ship"],
  "In merge queue": ["queue", "In queue"],
  "Agent waiting on others": ["clock", "Waiting on others"],
};
const TONE = { you: "you", agent: "agent", ci: "info", github: "info", done: "ok" };

// One status per PR: tone (whose turn), icon, short label, since, and stuck text.
function statusOf(c) {
  const local = c.local || {};
  const agent = local.agent;
  if (c.group === "merged") return { tone: "ok", icon: "merged", label: "Merged", since: c.mergedAt };
  if (agent?.status === "running") return { tone: "agent", icon: "sparkle", label: agent.kind === "ship" ? "Shipping" : agent.kind === "post" ? "Posting review" : "Agent working", since: agent.updatedAt };
  if (draftOf(c)) return { tone: "you", icon: "pencil", label: "Draft review ready", since: local.draft.attachedAt };
  if (agent?.status === "waiting") return { tone: "you", icon: "comment", label: "Agent needs you", since: agent.updatedAt };
  const r = c.reason;
  const [ic, label] = (r && SHORT[r.label]) || ["clock", r?.label || "Waiting"];
  const s = { tone: c.reason?.label === "Ready to ship" ? "you" : (TONE[c.who] || "neutral"), icon: ic, label: r?.label === "In merge queue" && c.queue ? `In queue #${c.queue.position}` : label, since: r?.since };
  if (r?.stuck) { s.tone = "stuck"; s.icon = "alert"; s.stuck = r.stuck; }
  return s;
}
// "Your move" and "stuck" get solid chips so they stand out in a long list.
function chip(c, { withAge = true } = {}) {
  const s = statusOf(c);
  const solid = s.tone === "you" || s.tone === "stuck" ? " solid" : "";
  const age = withAge && s.since ? ago(s.since) : "";
  return `<span class="chip ${s.tone}${solid}" title="${esc(s.stuck || c.reason?.text || c.waitingOn || "")}">${icon(s.icon, "sm")}<span>${esc(s.label)}</span>${age && age !== "just now" ? `<span class="age">· ${esc(age)}</span>` : ""}</span>`;
}
function sinceLine(c) {
  const s = statusOf(c);
  if (!s.since) return "";
  if (s.stuck) return `<span class="since stuck">Stuck · ${esc(dur(s.since))}</span>`;
  return `<span class="since">for ${esc(dur(s.since))}</span>`;
}

const cardsOf = () => snap?.cards || [];
const current = () => cardsOf().find((c) => c.number === selected) || issuesOf().find((c) => c.number === selected) || null;
const isBusy = (c) => c.local?.agent?.status === "running";
const draftOf = (c) => (c.local?.draft && !c.local.draft.postedAt) ? c.local.draft : null;
const canShip = (c) => c.group !== "merged" && !c.queue && c.reviewDecision === "APPROVED" && c.ci?.state !== "failing" && !isBusy(c);

// A drafted review for the current commit means the next step is posting it, not reviewing.
function waitingText(c) {
  const r = rvOf(c);
  if (r && c.group === "you" && c.review?.state !== "stale" && c.local?.prReview?.result !== "posted") return `Ready for you: post the ${/^approve/.test(r.verdict || "") ? "approval" : "review"}`;
  return c.waitingOn;
}
function nextHtml(text) {
  const i = text.indexOf(":");
  return i > 0 ? `<b>${esc(text.slice(0, i))}</b>${esc(text.slice(i))}` : esc(text);
}
function ciHtml(c) {
  const [ic, tone, label] = CI[c.ci?.state] || CI.none;
  const tip = c.ci?.failing?.length ? "Failing: " + c.ci.failing.join(", ") : c.ci?.pending?.length ? "Running: " + c.ci.pending.join(", ") : label;
  return `<span title="${esc(tip)}">${icon(ic, "sm " + tone)} ${esc(label)}</span>`;
}

// The one action that fits the PR's stage. Only "your move" actions are primary.
function primaryAction(c) {
  const local = c.local || {};
  if (c.group === "merged" || isBusy(c)) return null;
  if (draftOf(c)) return { act: "row-post", label: "Post review", primary: true };
  if (local.agent?.status === "waiting") return { act: "row-answer", label: "Answer", primary: true };
  if (c.shippable && canShip(c)) return armed?.key === c.number + ":ship" ? { act: "ship", label: "Click again to ship", confirm: true } : { act: "ship", label: "Ship", primary: true };
  if (c.group === "you" && !c.isDraft) return { act: "review", label: c.reason?.label === "Author responded, needs re-review" ? "Re-review" : "Review", primary: true };
  if (!local.summary && !local.summarizing) return { act: "summarize", label: "Summarize" };
  return null;
}

const SORTS = {
  newest: ["Newest", (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) || b.number - a.number],
  oldest: ["Oldest", (a, b) => String(a.createdAt).localeCompare(String(b.createdAt)) || a.number - b.number],
  updated: ["Recently updated", (a, b) => String(b.updatedAt || b.mergedAt).localeCompare(String(a.updatedAt || a.mergedAt))],
  number: ["Number", (a, b) => b.number - a.number],
};

// ---- Right: workspace ----
function moreMenu(c) {
  const local = c.local || {};
  const items = [
    local.session ? `<button role="menuitem" data-act="open-chat-link">${icon("comment")}Open full chat</button>` : "",
    local.session ? `<button role="menuitem" data-act="open-chat">${icon("link")}Ask the agent to open the chat</button>` : "",
    `<button role="menuitem" data-act="pin">${icon("pin")}${pins.has(c.number) ? "Unpin from top" : "Pin to top of the list"}</button>`,
    `<a role="menuitem" class="menu-link" href="${esc(c.url)}" target="_blank" rel="noopener">${icon("external")}Open on GitHub</a>`,
    local.agent ? `<button role="menuitem" data-act="reset">${icon("reset")}Reset agent status</button>` : "",
    isUnread(c) ? `<button role="menuitem" data-act="mark-read" data-pr="${c.number}">${icon("checkCircle")}Mark as read</button>` : "",
    trackItem(c, false),
    c.section === "yours" ? `<button role="menuitem" data-act="monitor" data-enable="${watched(c) ? 0 : 1}" data-pr="${c.number}">${icon("eye")}${watched(c) ? "Stop watching (Agent merge off)" : "Watch with Agent merge"}</button>` : "",
  ];
  return `<div class="menu" role="menu" aria-label="More actions">${items.join("")}</div>`;
}

function renderHead(c) {
  const local = c.local || {};
  const draft = draftOf(c);
  const busy = isBusy(c);
  const isOpen = c.group !== "merged";
  const pa = primaryAction(c);
  const postArmed = armed?.key?.startsWith(c.number + ":post:");
  const shipArmed = armed?.key === c.number + ":ship";
  const det = details.get(c.number)?.data;
  const s = statusOf(c);
  const ghv = ghViews.get("pr:" + c.number)?.data;
  const counts = { github: ghv ? ghv.timeline.filter((x) => x.type === "comment" || x.type === "review").length : "", files: det ? det.files.length : c.size?.text?.match(/(\d+) files/)?.[1] || "", thread: (local.thread || []).filter((m) => m.role !== "system").length || "" };
  const rv = rvOf(c);
  counts.architecture = rv?.diagrams.length || "";
  counts.review = rv?.findings.length || "";
  counts.changes = counts.files;
  const TABS = [["overview", "Overview"], ["architecture", "Architecture"], ["changes", "Changes"], ["review", "Review"], ["github", "GitHub"], ["thread", "Thread"]];

  const buttons = [];
  if (isOpen) {
    if (rvOf(c) && !draft) buttons.push(`<button class="primary" data-act="tab" data-tab="review">Post review…</button>`);
    if (draft) buttons.push(`<button data-act="post-menu" class="${postArmed ? "confirm" : "primary"}" ${busy ? "disabled" : ""} aria-haspopup="menu" aria-expanded="${openMenu === "post"}">${postArmed ? "Click again: " + esc(armed.label) : "Post review"}${postArmed ? "" : icon("chevDown", "sm")}</button>`);
    if (pa?.act === "row-answer") buttons.push(`<button class="primary" data-act="row-answer">Answer the agent</button>`);
    if (c.shippable || shipArmed) buttons.push(`<button data-act="ship" class="${shipArmed ? "confirm" : "primary"}" ${canShip(c) ? "" : "disabled"}>${shipArmed ? "Click again to ship" : "Ship"}</button>`);
    const reviewPrimary = pa?.act === "review";
    buttons.push(`<button data-act="review" class="${reviewPrimary ? "primary" : ""}" ${busy ? "disabled" : ""} title="${esc(REVIEW_TIP)} Nothing is posted.">${local.draft || rvOf(c) ? "Re-review" : pa?.label === "Re-review" ? "Re-review" : "Review"}</button>`);
  }
  buttons.push(`<button data-act="summarize" ${local.summarizing ? "disabled" : ""} title="Ask the agent for a plain-words summary and next steps">${icon("sparkle", "sm")}${local.summarizing ? "Summarizing…" : "Summarize"}</button>`);
  buttons.push(`<button data-act="more-menu" class="quiet" aria-haspopup="menu" aria-expanded="${openMenu === "more"}" aria-label="More actions">${icon("more")}More</button>`);

  const nextTone = c.who === "you" ? "you" : c.who === "agent" ? "agent" : "";
  const risk = local.summary?.risk ? (() => { const [ic, tone, l] = RISK[local.summary.risk]; return `<span>${icon(ic, "sm " + tone)} ${l}</span>`; })() : "";
  $("wsHead").innerHTML = `
    <h2>${esc(c.title)} <a href="${esc(c.url)}" target="_blank" rel="noopener" title="Open on GitHub">#${c.number}</a></h2>
    <div class="ws-meta">
      <span><img class="avatar" alt="" src="https://github.com/${encodeURIComponent(c.author)}.png?size=32" onerror="this.remove()"> ${esc(c.author)}</span>
      <span title="${esc(c.size?.text)}">${esc(c.size?.label)} · ${esc(c.size?.text)}</span>
      ${isOpen ? ciHtml(c) : `<span>${icon("merged", "sm tone-ok")} Merged ${esc(ago(c.mergedAt))} ago</span>`}
      ${c.isDraft ? `<span>${icon("pencil", "sm tone-mute")} Draft PR</span>` : ""}
      ${risk}
      ${chip(c)}
      ${watchBadge(c)}${readyMeter(c)}${issueChips(c)}
    </div>
    ${ballLine(c)}
    <div class="actions">${buttons.join("")}
      ${openMenu === "post" ? `<div class="menu" role="menu" aria-label="Post review as">
        <button data-act="post" data-event="approve" role="menuitem">${icon("checkCircle", "tone-ok")}Approve</button>
        <button data-act="post" data-event="request_changes" role="menuitem">${icon("xCircle", "tone-bad")}Request changes</button>
        <button data-act="post" data-event="comment" role="menuitem">${icon("comment")}Comment</button>
      </div>` : ""}
      ${openMenu === "more" ? moreMenu(c) : ""}
    </div>
    <div class="tabs" role="tablist" aria-label="Pull request views">${TABS.map(([id, label]) => `<button role="tab" id="tab-${id}" aria-controls="wsScroll" aria-selected="${tab === id}" tabindex="${tab === id ? 0 : -1}" data-act="tab" data-tab="${id}">${label}${counts[id] !== undefined && counts[id] !== "" ? ` <span class="n">${counts[id]}</span>` : ""}</button>`).join("")}</div>`;
  $("wsScroll").setAttribute("aria-labelledby", "tab-" + tab);
}

function actionButton(c) {
  const a = c.reason?.action;
  if (!a) return "";
  if (a.url) return `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label)} ${icon("external", "sm")}</a>`;
  if (a.act) return `<button data-act="${esc(a.act)}">${esc(a.label)}</button>`;
  return `<button data-act="nudge" title="Puts a draft comment in the message box. Edit it, then press Send to ask the agent to post it.">${esc(a.label)}…</button>`;
}

function overviewHtml(c) { return (c.lifecycle ? readinessHtml(c) : "") + overviewHtmlBase(c); }
function overviewHtmlBase(c) {
  const local = c.local || {};
  const s = local.summary;
  const isOpen = c.group !== "merged";
  const steps = s?.nextSteps?.length && !rvOf(c) ? s.nextSteps : [waitingText(c)];
  const agent = local.agent;
  const r = c.reason;
  const failing = c.ci?.failing?.length ? `<span class="sub">Failing: ${esc(c.ci.failing.join(", "))}</span>` : "";
  const reviews = (c.reviewers || []).map((rv) => { const [ic, tone, w] = REVIEW[rv.state] || REVIEW.COMMENTED; return `<span>${icon(ic, "sm " + tone)} ${esc(rv.login)} ${w}</span>`; }).join("")
    + (c.requested?.length ? `<span>${icon("person", "sm tone-mute")} Requested: ${esc(c.requested.join(", "))}</span>` : "") || "No reviews yet";
  const draft = local.draft;
  const d = draft ? drafts.get(draftKey(c)) : null;
  const stuck = isOpen && r?.stuck;
  return `
    ${stuck ? `<div class="callout" role="note">${icon("alert")}<div class="body"><div>${esc(r.stuck.replace(/^⚠️\s*/, ""))}. ${esc(r.text)}</div>${actionButton(c)}${r.action?.nudge ? `<span class="hint">Pre-fills a draft comment below. Nothing is posted until you send it.</span>` : ""}</div></div>` : ""}
    ${explainerHtml(c)}
    ${reviewHeadHtml(c)}
    ${rvOf(c) ? "" : `<section class="sec"><h3>What this PR does <span class="note">${s ? `${icon("sparkle", "sm")} Agent summary · ${esc(ago(s.at))}${ago(s.at) === "just now" ? "" : " ago"}` : "From the description"}</span></h3>
      <div class="summary">${s ? mdInline(s.text) : esc(local.summarizing ? "Summarizing…" : (c.fallbackSummary || "No description."))}</div>
      ${s || local.summarizing ? "" : `<div style="margin-top:var(--s3)"><button data-act="summarize">${icon("sparkle", "sm")}Get a plain-words summary and next steps</button></div>`}
    </section>`}
    ${isOpen ? `<section class="sec"><h3>Next steps</h3><ol class="steps">${steps.map((t) => `<li>${nextHtml(t)}</li>`).join("")}</ol></section>` : ""}
    <section class="sec"><h3>Status</h3><dl class="grid">
      ${r && isOpen ? `<dt>Why</dt><dd><b>${esc(r.label)}</b>${r.since ? `<span class="tone-mute">for ${esc(dur(r.since))} · since ${esc(when(r.since))}</span>` : ""}<span class="sub">${esc(r.text)}</span></dd>` : ""}
      ${r?.action && isOpen && !stuck && !(r.action.act && r.action.act === primaryAction(c)?.act) ? `<dt>Suggested</dt><dd>${actionButton(c)}${r.action.nudge ? `<span class="sub">Pre-fills a draft comment below. Nothing is posted until you send it.</span>` : ""}</dd>` : ""}
      ${isOpen ? `<dt>Checks</dt><dd>${ciHtml(c)}${failing}</dd>` : `<dt>Merged</dt><dd>${esc(when(c.mergedAt))}</dd>`}
      <dt>Reviews</dt><dd>${reviews}</dd>
      ${c.queue ? `<dt>Merge queue</dt><dd>Position ${c.queue.position}</dd>` : ""}
      ${agent ? `<dt>Agent</dt><dd>${icon("sparkle", "sm")} <b>${esc(AGENT[agent.status] || agent.status)}</b><span class="sub">${esc(agent.outcome || "")}</span></dd>` : ""}
      ${local.session ? `<dt>Session</dt><dd>${icon("comment", "sm tone-mute")} ${esc(local.session.name || local.session.id)}</dd>` : ""}
    </dl></section>
    ${draft ? `<details class="panel" data-k="draft" open><summary>${icon("chevRight", "sm chev")}Draft review <span class="note">recommends ${esc((draft.recommendation || "").replace("_", " "))}${draft.postedAt ? " · posted" : ""}</span></summary>
      <div class="body">${d ? (d.error ? `<div class="hint">${esc(d.error)}</div>` : `<div class="md">${md(d.text)}</div>`) : `<div class="hint">Loading…</div>`}</div></details>` : ""}
    <details class="panel" data-k="desc" open><summary>${icon("chevRight", "sm chev")}Description</summary><div class="body md">${md(cleanBody(c.description)) || `<span class="hint">No description.</span>`}</div></details>
    <details class="panel" data-k="timeline"><summary>${icon("chevRight", "sm chev")}Timeline</summary><div class="body">${timelineHtml(c)}</div></details>
    <details class="panel" data-k="more"><summary>${icon("chevRight", "sm chev")}Details <span class="note">size, opened, labels</span></summary><div class="body"><dl class="grid">
      <dt>Size</dt><dd>${esc(c.size?.label)} · ${esc(c.size?.text)}</dd>
      <dt>Opened</dt><dd>${esc(when(c.createdAt))} by ${esc(c.author)}</dd>
      ${c.labels?.length ? `<dt>Labels</dt><dd>${c.labels.map((l) => `<span class="pill">${esc(l)}</span>`).join("")}</dd>` : ""}
    </dl></div></details>`;
}

// ---- GitHub tab: the PR or issue as it is on GitHub, read-only ----
// Bodies are GitHub's own rendered HTML (tables, task lists, images), passed through a strict allowlist.
const GH_TAGS = new Set(["a", "p", "br", "hr", "h1", "h2", "h3", "h4", "h5", "h6", "strong", "b", "em", "i", "del", "s", "ins", "code", "pre", "blockquote", "ul", "ol", "li", "table", "thead", "tbody", "tr", "th", "td", "img", "details", "summary", "span", "div", "sup", "sub", "kbd", "input", "g-emoji", "dl", "dt", "dd", "video"]);
const GH_DROP = new Set(["script", "style", "iframe", "object", "embed", "form", "svg", "math", "link", "meta", "template", "button", "textarea", "select"]);
const GH_ATTRS = new Set(["href", "src", "alt", "title", "width", "height", "align", "open", "colspan", "rowspan", "start", "type", "checked"]);
function safeHtml(html) {
  const doc = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
  const walk = (el) => {
    for (const ch of [...el.children]) {
      const tag = ch.tagName.toLowerCase();
      if (GH_DROP.has(tag)) { ch.remove(); continue; }
      walk(ch);
      if (!GH_TAGS.has(tag)) { ch.replaceWith(...ch.childNodes); continue; }
      for (const a of [...ch.attributes]) if (!GH_ATTRS.has(a.name)) ch.removeAttribute(a.name);
      for (const name of ["href", "src"]) {
        const v = ch.getAttribute(name);
        if (v !== null && !(name === "href" ? /^(https?:|mailto:)/i : /^https:/i).test(v.trim())) ch.removeAttribute(name);
      }
      if (tag === "a") { ch.setAttribute("target", "_blank"); ch.setAttribute("rel", "noopener noreferrer"); }
      if (tag === "img") { ch.setAttribute("loading", "lazy"); ch.setAttribute("referrerpolicy", "no-referrer"); }
      if (tag === "video") ch.setAttribute("controls", "");
      if (tag === "input") { if (ch.getAttribute("type") !== "checkbox") { ch.remove(); continue; } ch.setAttribute("disabled", ""); }
    }
  };
  const root = doc.body.firstElementChild;
  walk(root);
  return root.innerHTML;
}

const ghViews = new Map(); // "pr:123" -> { loading } | { data } | { error }
async function loadGitHubView(kind, n, force = false) {
  const key = `${kind}:${n}`;
  const cur = ghViews.get(key);
  if (cur?.loading) return;
  if (cur?.data && !force && Date.now() - cur.at < 4 * 60_000) return;
  ghViews.set(key, { ...(cur || {}), loading: true });
  try {
    const res = await fetch(`/api/github?repo=${encodeURIComponent(REPO)}&kind=${kind}&n=${n}${force ? "&force=1" : ""}`);
    const data = await res.json();
    ghViews.set(key, res.ok ? { data, at: Date.now() } : { error: data.error || "HTTP " + res.status, data: cur?.data, at: cur?.at });
  } catch (e) { ghViews.set(key, { error: e.message, data: cur?.data, at: cur?.at }); }
  rerenderGitHub(kind, n);
}
function rerenderGitHub(kind, n) {
  if (fly && fly.kind === kind && fly.number === n) renderFlyout();
  if (current()?.number === n && view === "detail") render();
}

const GH_REVIEW = { APPROVED: ["checkCircle", "tone-ok", "approved these changes"], CHANGES_REQUESTED: ["xCircle", "tone-bad", "requested changes"], COMMENTED: ["comment", "tone-mute", "reviewed"], DISMISSED: ["dash", "tone-mute", "review was dismissed"], PENDING: ["clock", "tone-mute", "has a pending review"] };
const GH_CHECK = (s) => /^(SUCCESS|NEUTRAL|SKIPPED)$/.test(s) ? ["checkCircle", "tone-ok", s === "SUCCESS" ? "passed" : s.toLowerCase()] : /^(FAILURE|ERROR|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE|STALE)$/.test(s) ? ["xCircle", "tone-bad", s.toLowerCase().replace(/_/g, " ")] : ["running", "tone-run", s.toLowerCase().replace(/_/g, " ")];
const ghAvatar = (p) => p?.avatar ? `<img class="gh-av" alt="" src="${esc(p.avatar)}${p.avatar.includes("?") ? "&" : "?"}s=40" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : `<span class="gh-av ph" aria-hidden="true"></span>`;
const ghWhen = (at, url) => at ? (url ? `<a class="gh-when" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(new Date(at).toLocaleString())}">${esc(ago(at))} ago</a>` : `<span class="gh-when" title="${esc(new Date(at).toLocaleString())}">${esc(ago(at))} ago</span>`) : "";
const ghLabel = (l) => { const hex = /^[0-9a-f]{6}$/i.test(l.color || "") ? l.color : "8b949e"; const lum = parseInt(hex.slice(0, 2), 16) * 0.299 + parseInt(hex.slice(2, 4), 16) * 0.587 + parseInt(hex.slice(4, 6), 16) * 0.114; return `<span class="gh-label" style="background:#${hex};color:${lum > 150 ? "#1f2328" : "#ffffff"}">${esc(l.name)}</span>`; };
const ghBody = (html) => html && html.trim() ? `<div class="gh-md">${safeHtml(html)}</div>` : "";
const ghLink = (l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${l.pr ? icon("pr", "sm") : ""}#${l.number} ${esc(l.title)}</a> <span class="gh-state s-${esc(l.state.replace(/\s.*/, ""))}">${esc(l.state)}</span>`;

function ghThread(t) {
  const hunk = String(t.hunk || "").split("\n").map((l) => `<span class="${l.startsWith("+") ? "ad" : l.startsWith("-") ? "de" : l.startsWith("@@") ? "hh" : ""}">${esc(l)}</span>`).join("\n");
  return `<details class="gh-th" ${t.resolved || t.outdated ? "" : "open"}><summary>${icon("chevRight", "sm chev")}${icon("file", "sm tone-mute")}<span class="path" title="${esc(t.path)}${t.line ? `:${t.line}` : ""}">${esc(t.path.split("/").length > 2 ? "…/" + t.path.split("/").slice(-2).join("/") : t.path)}${t.line ? `:${t.line}` : ""}</span>${t.outdated ? `<span class="gh-tag">Outdated</span>` : ""}${t.resolved ? `<span class="gh-tag ok">Resolved</span>` : ""}<span class="tone-mute n">${t.comments.length} comment${t.comments.length === 1 ? "" : "s"}</span></summary>
    ${hunk ? `<pre class="gh-hunk">${hunk}</pre>` : ""}
    ${t.comments.map((m) => `<div class="gh-tc"><div class="gh-h">${ghAvatar(m.who)}<b>${esc(m.who.login)}</b>${ghWhen(m.at, m.url)}</div>${ghBody(m.html)}</div>`).join("")}
  </details>`;
}

function ghTimeline(items) {
  const out = [];
  for (let i = 0; i < items.length; i++) {
    const e = items[i];
    if (e.type === "commit") {
      const run = [e];
      while (items[i + 1]?.type === "commit") run.push(items[++i]);
      const who = [...new Set(run.map((k) => k.who.login))];
      out.push(`<details class="gh-ev gh-commits" ${run.length <= 3 ? "open" : ""}><summary>${icon("pr", "sm tone-mute")}${ghAvatar(run[0].who)}<span><b>${esc(who.join(", "))}</b> added ${run.length} commit${run.length === 1 ? "" : "s"}</span>${ghWhen(run[run.length - 1].at)}</summary>
        <ul>${run.map((k) => `<li><a class="sha" href="${esc(k.url)}" target="_blank" rel="noopener noreferrer">${esc(k.sha)}</a> ${esc(k.text)}</li>`).join("")}</ul></details>`);
      continue;
    }
    if (e.type === "comment") { out.push(`<article class="gh-card"><div class="gh-h">${ghAvatar(e.who)}<b>${esc(e.who.login)}</b><span class="tone-mute">commented</span>${ghWhen(e.at, e.url)}</div>${ghBody(e.html) || `<div class="gh-md hint">No text.</div>`}</article>`); continue; }
    if (e.type === "review") {
      const [ic, tone, verb] = GH_REVIEW[e.state] || GH_REVIEW.COMMENTED;
      const body = ghBody(e.html);
      out.push(`<article class="gh-card gh-review r-${esc(e.state)}"><div class="gh-h">${icon(ic, "sm " + tone)}${ghAvatar(e.who)}<b>${esc(e.who.login)}</b><span class="${tone}">${verb}</span>${ghWhen(e.at, e.url)}</div>${body}${e.threads.length ? `<div class="gh-ths">${e.threads.map(ghThread).join("")}</div>` : ""}</article>`);
      continue;
    }
    if (e.type === "thread") { out.push(`<article class="gh-card"><div class="gh-h">${icon("comment", "sm tone-mute")}${ghAvatar(e.who)}<b>${esc(e.who.login)}</b><span class="tone-mute">commented on a line</span>${ghWhen(e.at, e.thread.url)}</div><div class="gh-ths">${ghThread(e.thread)}</div></article>`); continue; }
    out.push(`<div class="gh-ev">${icon(e.icon === "merge" ? "merged" : ICONS[e.icon] ? e.icon : "dash", "sm tone-mute")}${ghAvatar(e.who)}<span><b>${esc(e.who.login)}</b> ${esc(e.text)}${e.label ? " " + ghLabel(e.label) : ""}${e.ref ? " " + ghLink({ ...e.ref, state: "" }).replace(/ <span class="gh-state[^>]*><\/span>$/, "") : ""}</span>${ghWhen(e.at)}</div>`);
  }
  return out.join("");
}

function ghChecks(checks) {
  if (!checks.length) return `<div class="hint">No checks on the latest commit.</div>`;
  const rank = (s) => { const t = GH_CHECK(s)[1]; return t === "tone-bad" ? 0 : t === "tone-run" ? 1 : 2; };
  const sorted = [...checks].sort((a, b) => rank(a.state) - rank(b.state) || a.name.localeCompare(b.name));
  const n = { bad: 0, warn: 0, ok: 0 };
  for (const c of checks) n[{ "tone-bad": "bad", "tone-run": "warn", "tone-ok": "ok" }[GH_CHECK(c.state)[1]]]++;
  const row = (c) => { const [ic, tone, word] = GH_CHECK(c.state); return `<li>${icon(ic, "sm " + tone)}<span class="nm">${c.workflow ? `<span class="tone-mute">${esc(c.workflow)} /</span> ` : ""}${esc(c.name)}</span><span class="${tone} st">${esc(word)}</span>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Details</a>` : ""}</li>`; };
  const problems = sorted.filter((c) => rank(c.state) < 2);
  const fine = sorted.filter((c) => rank(c.state) === 2);
  return `<div class="gh-sum">${n.bad ? `<span class="tone-bad">${n.bad} failing</span>` : ""}${n.warn ? `<span class="tone-run">${n.warn} running</span>` : ""}<span class="tone-ok">${n.ok} passed</span></div>
    ${problems.length ? `<ul class="gh-checks">${problems.map(row).join("")}</ul>` : ""}
    ${fine.length ? `<details class="gh-pass" ${problems.length ? "" : ""}><summary>${icon("chevRight", "sm chev")}${fine.length} successful or skipped check${fine.length === 1 ? "" : "s"}</summary><ul class="gh-checks">${fine.map(row).join("")}</ul></details>` : ""}`;
}

// One renderer for both the flyout's GitHub tab and the detail view's GitHub tab.
const ghHtmlCache = new Map();
function githubTabHtml(kind, n) {
  const key = `${kind}:${n}`;
  const v = ghViews.get(key);
  if (!v || (!v.data && v.loading)) { setTimeout(() => loadGitHubView(kind, n)); return `<div class="hint gh-loading">${spinner("Loading")} Loading #${n} from GitHub…</div>`; }
  if (!v.data) return `<div class="hint">Couldn't load it from GitHub: ${esc(v.error)} <button data-act="gh-refresh" data-kind="${kind}" data-pr="${n}">Try again</button></div>`;
  if (Date.now() - v.at > 4 * 60_000 && !v.loading) setTimeout(() => loadGitHubView(kind, n));
  const d = v.data;
  const hit = ghHtmlCache.get(key);
  if (hit?.fetchedAt === d.fetchedAt) return hit.html;
  const pr = d.kind === "pr";
  const meta = [
    d.labels.length ? `<dt>Labels</dt><dd>${d.labels.map(ghLabel).join(" ")}</dd>` : "",
    `<dt>Assignees</dt><dd>${d.assignees.length ? d.assignees.map(esc).join(", ") : `<span class="tone-mute">No one</span>`}</dd>`,
    pr ? `<dt>Reviewers</dt><dd>${d.requested.length ? `requested: ${d.requested.map(esc).join(", ")}` : `<span class="tone-mute">No pending requests</span>`}</dd>` : "",
    `<dt>${pr ? "Fixes" : "Linked PRs"}</dt><dd>${d.linked.length ? d.linked.map(ghLink).join("<br>") : `<span class="tone-mute">None</span>`}</dd>`,
  ].join("");
  const html = `<div class="gh-view" data-gh="${esc(key)}">
    <header class="gh-top"><div class="gh-title"><span class="gh-state s-${esc(d.state.replace(/\s.*/, ""))}">${esc(d.state)}</span>
      <span>${ghAvatar(d.author)}<b>${esc(d.author.login)}</b> ${pr ? `wants to merge <code>${esc(d.head)}</code> into <code>${esc(d.base)}</code>` : "opened this"} ${ghWhen(d.createdAt)}</span></div>
      <dl class="gh-meta">${meta}</dl></header>
    <section class="gh-sec"><h3>Description</h3>${ghBody(d.html) || `<div class="hint">No description provided.</div>`}</section>
    ${pr ? `<section class="gh-sec"><h3>Checks</h3>${ghChecks(d.checks)}</section>` : ""}
    <section class="gh-sec"><h3>Timeline <span class="tone-mute">oldest first</span></h3><div class="gh-tl">${ghTimeline(d.timeline) || `<div class="hint">Nothing yet.</div>`}</div>
      ${d.truncated ? `<div class="hint">Only the first 1,000 timeline items are shown. <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">See the rest on GitHub</a></div>` : ""}</section>
    <div class="gh-foot hint">Read from GitHub ${esc(ago(d.fetchedAt))} ago · <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">Open on GitHub ${icon("external", "sm")}</a> · <button class="quiet" data-act="gh-refresh" data-kind="${kind}" data-pr="${n}">${icon("refresh", "sm")}Refresh</button></div>
  </div>`;
  ghHtmlCache.set(key, { fetchedAt: d.fetchedAt, html });
  return html;
}

// Re-rendering a long GitHub view would reload its images and close its <details>, so keep the old
// DOM when the data hasn't changed.
const ghSlotKey = (kind, n) => { const v = ghViews.get(`${kind}:${n}`); return `${kind}:${n}:${v?.data?.fetchedAt || (v?.error ? "err" : "loading")}`; };
function fillGhSlot(container, oldSlot, kind, n) {
  const slot = container.querySelector(".gh-slot");
  if (!slot) return;
  if (oldSlot && oldSlot.dataset.k === slot.dataset.k) slot.replaceWith(oldSlot);
  else slot.innerHTML = githubTabHtml(kind, n);
}

function filesHtml(c) {
  const det = details.get(c.number);
  if (!det || det.loading) return `<div class="hint">Loading files…</div>`;
  if (det.error) return `<div class="hint">Couldn't load files: ${esc(det.error)}</div>`;
  const files = det.data.files;
  const max = Math.max(1, ...files.map((f) => f.additions + f.deletions));
  return `<div class="hint">${files.length} files · ${esc(c.size?.text?.split(",")[0] || "")} · largest first</div>
    <table class="files">${files.map((f) => `<tr><td class="path">${esc(f.path)}</td><td class="add">+${f.additions}</td><td class="del">−${f.deletions}</td>
      <td><span class="bar" aria-hidden="true"><i class="a" style="width:${(f.additions / max) * 60}px"></i><i class="d" style="width:${(f.deletions / max) * 60}px"></i></span></td></tr>`).join("")}</table>`;
}

// ---- Unread replies ----
// An item is unread when the agent's newest reply (a thread answer, a draft or a structured review) is newer
// than the last time you viewed it here. Older replies than snap.readBaseline never count.
const tms = (s) => (s ? new Date(s).getTime() || 0 : 0);
function latestReplyAt(c) {
  const l = c?.local || {};
  let at = 0;
  for (const m of l.thread || []) if (m.role === "agent") at = Math.max(at, tms(m.at));
  return Math.max(at, tms(l.reviewSetAt), tms(l.draft?.attachedAt));
}
const seenAt = (c) => Math.max(tms(c?.local?.lastSeenAt), tms(snap?.readBaseline));
const isUnread = (c) => !!c && latestReplyAt(c) > seenAt(c);
const isReplying = (c) => !!c?.local?.pending;
// An issue with a PR on the board has no row of its own: the PR row stands for both.
const listIssues = () => issuesOf().filter((i) => !i.covered);
// What an item is, in the same place on every row: a PR (or draft PR) or an issue.
const typeTag = (c) => c.kind === "issue"
  ? `<span class="num t-issue">${icon("issue", "sm")}Issue #${c.number}</span>`
  : `<span class="num t-pr">${icon(c.isDraft ? "prDraft" : c.section === "merged" ? "merged" : "pr", "sm")}${c.isDraft ? "Draft PR" : "PR"} #${c.number}</span>`;
const issueChips = (c) => (c.issues || []).map((i) => `<button class="issue-chip" data-act="issue-chip" data-pr="${i.number}" title="Issue #${i.number}: ${esc(i.title)}. Opens the issue.">${icon("issue", "sm")}Fixes Issue #${i.number}</button>`).join("");
const allItems = () => [...cardsOf().filter((c) => c.section !== "merged" && !c.local?.hidden), ...listIssues().filter((c) => !c.hidden)];
let unreadOnly = false;
let ballFilter = null; // "you" | "agent" | "waiting" | "snoozed" | "backlog"
// The item you're looking at, and where its unread part started when you opened it (for the "New" divider).
let viewing = null; // { key, at, scrolled }
function noteViewing(c) {
  const key = streamKey(c);
  if (viewing?.key !== key) viewing = { key, at: isUnread(c) ? seenAt(c) : null, scrolled: false };
}
const seenBusy = new Set();
function markSeen(c) {
  const key = streamKey(c);
  if (!isUnread(c) || seenBusy.has(key) || document.visibilityState !== "visible") return;
  seenBusy.add(key);
  post("/api/seen", { pr: c.number, kind: c.kind === "issue" ? "issue" : "pr" }).catch(() => {}).finally(() => setTimeout(() => seenBusy.delete(key), 1500));
}
function viewedItem() {
  if (fly) return itemOf(fly.kind, fly.number);
  if (view === "detail" && ["thread", "review", "overview"].includes(tab)) return current();
  return null;
}
function markViewed() {
  const c = viewedItem();
  if (c) markSeen(c);
  const n = allItems().filter(isUnread).length;
  document.title = n ? `(${n}) PR board` : "PR board";
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") markViewed(); });
function replyMarks(c) {
  if (isUnread(c)) return `<span class="chip new" title="The agent replied since you last looked. Open it to read.">${icon("comment", "sm")}<span>New reply</span></span>`;
  if (isReplying(c)) return `<span class="chip agent" title="You asked something; the agent is still answering.">${icon("running", "sm")}<span>Replying…</span></span>`;
  return "";
}

// Live progress for a pending reply, pushed by the extension as "stream" events while the agent works.
const streams = new Map();
const streamKey = (c) => `${c.kind === "issue" ? "issue" : "pr"}:${c.number}`;
function streamInner(c, s) {
  const mins = c?.local?.pending ? (Date.now() - new Date(c.local.pending.at).getTime()) / 60000 : 0;
  const dots = `<span class="thinking" aria-hidden="true"><span>●</span><span>●</span><span>●</span></span>`;
  if (s?.text) return `<div class="who">Agent · writing…</div><div class="md">${md(s.text)}</div>`;
  if (s?.step) return `<div class="who">Agent</div><div class="step">${dots}<span>${esc(s.step)}…</span></div>`;
  return `<div class="who">Agent</div>${dots}${mins > 5 ? ` <span class="hint">No reply yet. The agent may be busy; the answer will show up here.</span>` : ""}`;
}

// "Explain like I'm 5" and "Where we are": plain-language text the agent writes with pr_board_set_explainer.
function explainerStale(c) {
  const x = c.local?.explainer;
  if (!x?.updatedAt) return "";
  if (c.headSha && x.basis?.headSha && c.headSha !== x.basis.headSha) return "new commits since";
  if (tms(c.updatedAt) > tms(x.updatedAt) + 60000) return "new activity on GitHub since";
  return "";
}
function explainerHtml(c) {
  const x = c.local?.explainer;
  const kind = c.kind === "issue" ? "issue" : "pr";
  const pending = c.local?.explainerPending && (!x?.updatedAt || tms(c.local.explainerPending) > tms(x.updatedAt));
  const btn = (label) => pending
    ? `<span class="hint">${icon("running", "sm")} Asking the agent…</span>`
    : `<button data-act="explain-item" data-pr="${c.number}" data-kind="${kind}" title="Ask the agent to explain this in plain words and summarize where we are">${icon("sparkle", "sm")}${label}</button>`;
  if (!x || (!x.eli5 && !x.progress)) {
    return `<section class="sec explainer empty"><h3>Explain like I'm 5</h3><p class="hint">No plain-language explanation yet: what this is, why it matters, and where we are.</p>${btn("Explain this")}</section>`;
  }
  const stale = explainerStale(c);
  const meta = `<span class="note">${x.fromIssue ? `from Issue #${x.fromIssue} · ` : ""}updated ${esc(ago(x.updatedAt))}${ago(x.updatedAt) === "just now" ? "" : " ago"}${stale ? ` · ${esc(stale)}` : ""}</span>`;
  return `<section class="sec explainer">
    <div class="ex-head"><h3>Explain like I'm 5</h3>${meta}<span class="sp"></span>${stale || pending ? btn("Update") : ""}</div>
    ${x.eli5 ? `<div class="md">${md(x.eli5)}</div>` : ""}
    ${x.progress ? `<h3>Where we are</h3><div class="md">${md(x.progress)}</div>` : ""}
  </section>`;
}

function threadHtml(c) {
  const local = c.local || {};
  const divAt = viewing?.key === streamKey(c) ? viewing.at : null;
  let divDone = divAt === null;
  const divider = (m) => { if (divDone || m.role !== "agent" || tms(m.at) <= divAt) return ""; divDone = true; return `<div class="new-div" role="separator" aria-label="New replies"><span>New</span></div>`; };
  const msgs = (local.thread || []).map((m) => divider(m) + (m.role === "system"
    ? `<div class="sys">${esc(m.text)}${m.issue ? ` · Issue #${m.issue}` : ""} · ${esc(when(m.at))}</div>`
    : `<div class="msg ${m.role === "user" ? "user" : "agent"}"><div class="who">${m.role === "user" ? "You" : esc(m.from || "Agent")}${m.issue ? ` <span class="from-issue">${icon("issue", "sm")}from Issue #${m.issue}</span>` : ""} · ${esc(when(m.at))}</div><div class="md">${md(m.text)}</div></div>`)).join("");
  const sk = streamKey(c);
  const pending = local.pending ? `<div class="msg agent streaming" aria-live="polite" data-stream-key="${sk}">${streamInner(c, streams.get(sk))}</div>` : "";
  return `<div class="thread">${msgs || (pending ? "" : `<div class="hint">Ask anything about this PR, for example "What's still blocking this?" or "Explain the risky part in simple terms." The agent answers here.</div>`)}${pending}</div>`;
}

function timelineHtml(c) {
  const t = [...(c.events || []), ...(c.local?.history || []).map((h) => ({ ...h, source: "board" }))].sort((a, b) => a.at.localeCompare(b.at));
  return t.length ? `<ul class="timeline">${t.map((e) => `<li><time>${esc(when(e.at))}</time>${esc(e.text)}${e.source === "github" ? ` <span class="tone-mute">· GitHub</span>` : ""}</li>`).join("")}</ul>` : `<div class="hint">No events yet.</div>`;
}

// ---- PR detail: structured review (Architecture, Changes, Review) ----
const diagramMod = import("/diagram.js").catch(() => null);
let archSel = null;   // { pr, diagram, node }
let rvPreview = null; // { pr, event, data | error | loading }
const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
const VERDICT = { approve: ["checkCircle", "tone-ok", "Recommends approve"], "approve-with-comments": ["checkCircle", "tone-ok", "Approve with comments"], "needs-discussion": ["comment", "tone-run", "Needs discussion"], "request-changes": ["xCircle", "tone-bad", "Recommends changes"] };
const EVENT_WORD = { approve: "Approve", request_changes: "Request changes", comment: "Comment" };
const rvOf = (c) => c.local?.review || null;
const triOf = (c) => c.local?.triage || {};
const decisionOf = (c, id) => triOf(c)[id]?.decision || "undecided";
const fileLink = (f) => `<a href="${esc(f.href || "#")}" target="_blank" rel="noopener" class="path" title="${esc(f.path)}">${esc(f.path).replace(/\//g, "/<wbr>")}${f.line ? `:${f.line}${f.endLine && f.endLine !== f.line ? "-" + f.endLine : ""}` : ""}</a>`;
const askBtn = (q) => `<button class="quiet" data-act="ask-about" data-q="${esc(q)}">${icon("comment", "sm")}Ask about this</button>`;

function noReviewHtml(c, what) {
  const running = c.local?.agent?.status === "running" && c.local.agent.kind === "review";
  return `<div class="empty-rv"><div><b>No ${what} yet.</b> ${running ? "An agent is reviewing this PR now; it fills in as it goes." : "Run Review: an agent follows the repo's pr-review skill and fills in a summary, diagrams, changes by system and file, and findings you can pick to post."}</div>
    ${running ? "" : `<button class="primary" data-act="review">Review this PR</button>`}</div>`;
}

function reviewHeadHtml(c, { compact = false } = {}) {
  const r = rvOf(c);
  if (!r) return "";
  const sha = (r.headSha || "").slice(0, 7);
  const stale = c.review?.state === "stale" || (r.headSha && c.headSha && r.headSha !== c.headSha);
  const [vi, vt, vl] = VERDICT[r.verdict] || ["dash", "tone-mute", "No verdict"];
  const rk = r.risk ? RISK[r.risk] : null;
  const n = r.findings.length, posted = r.findings.filter((f) => decisionOf(c, f.id) === "post").length;
  return `<section class="sec"><h3>Review <span class="note">${icon("sparkle", "sm")} by the agent${c.local.reviewSetAt ? ` · ${esc(ago(c.local.reviewSetAt))} ago` : ""}${sha ? ` · on <code>${esc(sha)}</code>` : ""}${stale ? ` · <b class="tone-bad">new commits since</b>` : ""}</span></h3>
    <div class="verdict"><span>${icon(vi, "sm " + vt)} <b>${esc(vl)}</b></span>${rk ? `<span>${icon(rk[0], "sm " + rk[1])} ${rk[2]}</span>` : ""}
      <button class="quiet" data-act="tab" data-tab="review">${n} finding${n === 1 ? "" : "s"}${posted ? ` · ${posted} to post` : ""}</button>
      <button class="quiet" data-act="tab" data-tab="architecture">${r.diagrams.length} diagram${r.diagrams.length === 1 ? "" : "s"}</button></div>
    ${r.summary ? `<div class="md" style="margin-top:var(--s2)">${md(r.summary)}</div>` : ""}
    ${!compact && r.functionality.length ? `<ul class="steps" style="list-style:disc;margin-top:var(--s2)">${r.functionality.map((x) => `<li><b>${esc(x.title)}</b>${x.detail ? ` — ${mdInline(x.detail)}` : ""}</li>`).join("")}</ul>` : ""}
  </section>`;
}

function architectureHtml(c) {
  const r = rvOf(c);
  if (!r || !r.diagrams.length) return noReviewHtml(c, "architecture diagrams");
  const sel = archSel?.pr === c.number ? archSel : null;
  return r.diagrams.map((d) => {
    let panel = "";
    if (sel && sel.diagram === d.id) {
      const n = (d.nodes || d.participants || []).find((x) => x.id === sel.node);
      if (n) {
        const comp = r.components.find((x) => x.id === n.component);
        const files = [...(n.files || []), ...(comp?.files || [])];
        const fs = r.findings.filter((f) => f.diagramRefs.some((x) => x.diagram === d.id && x.node === n.id));
        panel = `<div class="nodepanel"><h4>${n.status ? `<span class="stc st-${esc(n.status)}">${esc(n.status)}</span>` : ""}${esc(n.label)}<span class="sp" style="flex:1"></span><button class="quiet ico" data-act="node-close" aria-label="Close">${icon("x", "sm")}</button></h4>
          ${n.description || comp?.role ? `<div>${mdInline(n.description || comp.role)}</div>` : ""}
          ${files.length ? `<div><div class="hint">Files</div><ul class="flist">${files.map((f) => `<li>${fileLink(f)}</li>`).join("")}</ul></div>` : ""}
          ${fs.length ? `<div><div class="hint">Findings</div>${fs.map((f) => `<div><span class="sev s-${esc(f.severity)}">${esc(f.severity)}</span> <button class="quiet" data-act="goto-finding" data-id="${esc(f.id)}">${esc(f.title)}</button></div>`).join("")}</div>` : ""}
          <div>${askBtn(`the "${n.label}" part of the diagram "${d.title}"`)}</div></div>`;
      }
    }
    return `<section class="sec diag"><h3>${esc(d.title)} <span class="note">${esc(d.kind)}</span></h3>
      ${d.description ? `<div class="md">${md(d.description)}</div>` : ""}
      <div class="diag-host" data-diagram="${esc(d.id)}" aria-label="Diagram: ${esc(d.title)}"></div>
      <div class="legend"><span><i class="l-added"></i>New</span><span><i class="l-modified"></i>Changed</span><span><i class="l-removed"></i>Removed</span><span><i class="l-unchanged"></i>Unchanged</span><span>Click a box for its files and findings</span></div>
      ${panel}</section>`;
  }).join("");
}

async function mountDiagrams(c) {
  const mod = await diagramMod;
  const r = rvOf(c);
  if (!mod || !r) return;
  for (const host of document.querySelectorAll("#wsScroll .diag-host")) {
    const d = r.diagrams.find((x) => x.id === host.dataset.diagram);
    if (!d) continue;
    const badges = new Map();
    for (const f of r.findings) for (const ref of f.diagramRefs) {
      if (ref.diagram !== d.id || !ref.node) continue;
      const b = badges.get(ref.node) || { count: 0, worst: "info" };
      b.count++;
      if (SEV_ORDER[f.severity] < SEV_ORDER[b.worst]) b.worst = f.severity;
      badges.set(ref.node, b);
    }
    const sel = archSel?.pr === c.number && archSel.diagram === d.id ? archSel.node : null;
    const svg = mod.renderDiagram(d, { view: "diff", selected: sel, badges, fitTo: { w: Math.max(320, host.clientWidth - 16), h: 640 }, onSelect: (id) => { archSel = { pr: c.number, diagram: d.id, node: id }; render(true); } });
    svg.style.maxWidth = svg.dataset.width + "px";
    host.replaceChildren(svg);
  }
}

function changesTabHtml(c) {
  const r = rvOf(c);
  const det = details.get(c.number)?.data;
  const stats = new Map((det?.files || []).map((f) => [f.path, f]));
  const nums = (path) => { const s = stats.get(path); return s ? `<span class="nums"><span class="tone-ok">+${s.additions}</span> <span class="tone-bad">−${s.deletions}</span></span>` : `<span></span>`; };
  const fileRows = (list) => list.map((f) => `<li>${fileLink(f)}${nums(f.path)}${f.summary ? `<span class="what">${mdInline(f.summary)}</span>` : ""}</li>`).join("");
  let systems = "";
  if (r?.components.length) {
    systems = `<section class="sec"><h3>By system</h3><div style="display:flex;flex-direction:column;gap:var(--s3)">${r.components.map((k) => {
      const files = (r.changedFiles.filter((f) => f.component === k.id).length ? r.changedFiles.filter((f) => f.component === k.id) : k.files);
      const add = files.reduce((s, f) => s + (stats.get(f.path)?.additions || 0), 0), del = files.reduce((s, f) => s + (stats.get(f.path)?.deletions || 0), 0);
      return `<div class="sysc"><div class="sys-head">${k.status ? `<span class="stc st-${esc(k.status)}">${esc(k.status)}</span>` : ""}<b>${esc(k.name)}</b><span class="hint">${files.length} file${files.length === 1 ? "" : "s"}${det ? ` · <span class="tone-ok">+${add}</span> <span class="tone-bad">−${del}</span>` : ""}</span><span class="ask-end">${askBtn(`the "${k.name}" changes`)}</span></div>
        ${k.role ? `<div>${mdInline(k.role)}</div>` : ""}
        ${files.length ? `<details><summary class="hint" style="cursor:pointer">Files</summary><ul class="flist">${fileRows(files)}</ul></details>` : ""}</div>`;
    }).join("")}</div></section>`;
  }
  const byFile = r?.changedFiles.length ? r.changedFiles : (det?.files || []).map((f) => ({ path: f.path, href: `${c.url}/files` }));
  if (!byFile.length && !systems) return det ? `<div class="hint">No changed files.</div>` : `<div class="hint">Loading files…</div>`;
  return `${r ? "" : noReviewHtml(c, "plain-words summary of the changes")}${systems}
    <section class="sec"><h3>By file <span class="note">${byFile.length} file${byFile.length === 1 ? "" : "s"}${r?.changedFiles.length ? "" : " · no summaries yet"}</span></h3><ul class="flist">${fileRows(byFile)}</ul></section>`;
}

function reviewTabHtml(c) {
  const r = rvOf(c);
  if (!r) return noReviewHtml(c, "review findings");
  const tri = triOf(c);
  const fs = [...r.findings].sort((a, b) => SEV_ORDER[a.severity] - SEV_ORDER[b.severity]);
  const cnt = { post: 0, ignore: 0, undecided: 0 };
  for (const f of fs) cnt[decisionOf(c, f.id)]++;
  const expl = c.local?.explanations || {}, explaining = c.local?.explaining || {};
  const pv = rvPreview?.pr === c.number ? rvPreview : null;
  const isOpen = c.group !== "merged";
  const defEv = /^approve/.test(r.verdict || "") ? "approve" : r.verdict === "request-changes" ? "request_changes" : "comment";
  const evIcon = { approve: icon("checkCircle", "tone-ok"), request_changes: icon("xCircle", "tone-bad"), comment: icon("comment") };
  const preview = pv ? (pv.loading ? `<div class="preview"><div class="hint">Building the preview…</div></div>` : pv.error ? `<div class="preview"><div class="hint">${esc(pv.error)}</div></div>` : `<div class="preview" role="region" aria-label="Preview of the review to post">
      <div class="fh"><b>Preview: ${EVENT_WORD[pv.event]}</b> <span class="hint">${pv.data.counts.inline} inline comment${pv.data.counts.inline === 1 ? "" : "s"}, ${pv.data.counts.inBody} in the summary, ${pv.data.counts.ignored} ignored, ${pv.data.counts.undecided} undecided (not posted)</span></div>
      <div><div class="hint">Summary comment</div><div class="md">${md(pv.data.body) || `<span class="hint">(empty)</span>`}</div></div>
      ${pv.data.comments.map((x) => `<div class="inl"><div class="hint">Inline on <code>${esc(x.path)}:${x.line}</code></div><div class="md">${md(x.body)}</div></div>`).join("")}
      <div class="rv-bar"><button class="primary" data-act="rv-post" data-event="${pv.event}">Post this as ${EVENT_WORD[pv.event]}</button><button data-act="rv-cancel">Cancel</button><span class="hint">The agent posts exactly this with gh. Nothing else is posted.</span></div></div>`) : "";
  const postBtns = isOpen ? `<span class="split-btn"><button class="primary" data-act="rv-preview" data-event="${defEv}" title="Preview, then post it to GitHub">${evIcon[defEv]}${EVENT_WORD[defEv]}…</button><button class="primary" data-act="rv-menu" aria-haspopup="menu" aria-expanded="${openMenu === "rpost"}" aria-label="Post as something else">${icon("chevDown", "sm")}</button></span>
      ${openMenu === "rpost" ? `<div class="menu" role="menu" aria-label="Post review as" style="right:0;top:32px">${["approve", "request_changes", "comment"].filter((e) => e !== defEv).map((e) => `<button role="menuitem" data-act="rv-preview" data-event="${e}">${evIcon[e]}${EVENT_WORD[e]}…</button>`).join("")}</div>` : ""}` : "";
  const noteVal = tri._note && typeof tri._note.note === "string" ? tri._note.note : r.summary || "";
  return `${reviewHeadHtml(c, { compact: true })}
    ${fs.length ? `<div class="rv-bar"><span class="count"><b>${cnt.post}</b> to post · ${cnt.ignore} ignored · ${cnt.undecided} undecided</span><span style="flex:1"></span>${postBtns}</div>`
      : `<div class="empty-rv rv-none"><div><b>No findings.</b> ${esc((VERDICT[r.verdict] || [, , "No verdict"])[2])}. Nothing needs to change before merge.</div><div class="rv-bar" style="width:100%">${postBtns}</div></div>`}
    ${preview}
    <section class="sec"><h3>Your note <span class="note">goes at the top of the posted review; it starts as the review summary</span></h3><textarea class="rv-note" data-finding="_note" rows="4" placeholder="Optional overall comment">${esc(noteVal)}</textarea></section>
    ${fs.map((f) => {
      const d = decisionOf(c, f.id);
      const ex = expl[f.id];
      return `<article class="finding d-${d}" id="finding-${esc(f.id)}">
        <div class="fh"><span class="sev s-${esc(f.severity)}">${esc(f.severity)}</span><span class="hint">${esc(f.category)}${f.confidence ? ` · ${esc(f.confidence)} confidence` : ""}</span><b>${esc(f.title)}</b></div>
        ${f.files.length ? `<div class="flist" style="flex-direction:row;flex-wrap:wrap;gap:var(--s2)">${f.files.map(fileLink).join("")}</div>` : ""}
        ${f.description ? `<div class="md">${md(f.description)}</div>` : ""}
        ${f.recommendation ? `<div class="md"><b>Suggestion:</b> ${mdInline(f.recommendation)}</div>` : ""}
        ${ex ? `<div class="expl">${icon("sparkle", "sm tone-agent")} <b>Explanation</b><div class="md">${md(ex.text)}</div></div>` : explaining[f.id] ? `<div class="expl hint">Explaining…</div>` : ""}
        <div class="rv-bar"><div class="seg" role="group" aria-label="Decision for ${esc(f.title)}">
          ${c.lifecycle
            ? `${triOf(c)[f.id]?.fixRequestedAt ? `<span class="hint">Fix requested</span>` : `<button data-act="finding-fix" data-pr="${c.number}" data-id="${esc(f.id)}">Fix</button>`}<button data-act="triage" data-id="${esc(f.id)}" data-decision="ignore" aria-pressed="${d === "ignore"}">Not needed</button><button data-act="triage" data-id="${esc(f.id)}" data-decision="undecided" aria-pressed="${d === "undecided"}">Undecided</button>`
            : ["post", "ignore", "undecided"].map((k) => `<button data-act="triage" data-id="${esc(f.id)}" data-decision="${k}" aria-pressed="${d === k}">${{ post: "Post", ignore: "Ignore", undecided: "Undecided" }[k]}</button>`).join("")}</div>
          <button class="quiet" data-act="explain" data-id="${esc(f.id)}" ${explaining[f.id] ? "disabled" : ""}>${icon("sparkle", "sm")}Explain</button>
          ${askBtn(`the finding "${f.title}"`)}</div>
        <textarea data-finding="${esc(f.id)}" placeholder="Note to add when posting (optional)">${esc(tri[f.id]?.note || "")}</textarea>
      </article>`;
    }).join("")}`;

async function saveTriage(pr, findingId, patch) {

  if (ch.error) return `<section class="sec changes"><h3>What changed since your review</h3><div class="hint">Couldn't compare: ${esc(ch.error)}</div></section>`;
  const d = ch.data;
  const add = d.files.reduce((s, f) => s + f.additions, 0), del = d.files.reduce((s, f) => s + f.deletions, 0);
  return `<section class="sec changes"><h3>What changed since your review <span class="note">${d.reviewedAt ? `you reviewed ${esc(ago(d.reviewedAt))} ago` : ""}</span></h3>
    ${d.note ? `<div class="hint">${esc(d.note)}</div>` : ""}
    ${d.commits.length ? `<div><b>${d.commits.length} commit${d.commits.length === 1 ? "" : "s"}</b>, ${d.files.length} file${d.files.length === 1 ? "" : "s"} <span class="add">+${add}</span> <span class="del">−${del}</span></div>
      <ul>${d.commits.slice(-12).map((k) => `<li><span class="sha">${esc(k.sha.slice(0, 7))}</span>${esc(k.message)} <span class="hint">· ${esc(k.author)} · ${esc(ago(k.at))}${ago(k.at) === "just now" ? "" : " ago"}</span></li>`).join("")}</ul>
      <ul>${d.files.slice(0, 25).map((f) => `<li class="file"><span title="${esc(f.path)}">${esc(f.path)}</span><span class="add">+${f.additions}</span><span class="del">−${f.deletions}</span></li>`).join("")}${d.files.length > 25 ? `<li class="hint">…and ${d.files.length - 25} more</li>` : ""}</ul>
      <div class="hint">The agent's plain-words summary of these changes will appear in the thread below.</div>` : ""}
  </section>`;
}

const REVIEW_TIP = "Run pr-review in a session and draft findings for you to post. Also keeps the PR under Reviewing.";
const TRACK_TIP = "Keep this PR in your Reviewing list. Doesn't run a review or change anything on GitHub.";
// Quick commands that fit a row. short = the label used inline on the Overview row.
function quickCmds(c, kind) {
  const busy = isBusy(c);
  if (kind === "issue") return [
    { act: "status-update", label: "Status update", short: "Status" },
    c.local?.session?.id ? null : { act: "start-issue", label: "Start working on it", short: "Start working" },
    { act: "focus-ask", label: "Ask a question", short: "Ask" },
  ].filter(Boolean);
  if (c.section === "yours") {
    const am = c.local?.sync?.agentMerge;
    return [
      { act: "status-update", label: "Status update", short: "Status" },
      { act: "focus-ask", label: "Ask a question", short: "Ask" },
      am?.enabled ? { act: "monitor", label: "Turn off monitoring", short: "Monitoring off", extra: 'data-enable="0"' } : { act: "monitor", label: "Turn on monitoring", short: "Monitor", extra: 'data-enable="1"' },
      { act: "summarize", label: "Summarize", short: "Summarize" },
    ];
  }
  if (c.section === "reviewing") return [
    { act: "what-changed", label: "What changed since my review?", short: "What changed?" },
    { act: "summarize-replies", label: "Summarize the author's replies", short: "Author's replies" },
    { act: "review", label: c.review?.state === "none" ? "Review" : "Re-run review", short: c.review?.state === "none" ? "Review" : "Re-review", extra: busy ? "disabled" : "", tip: REVIEW_TIP },
    { act: "focus-ask", label: "Ask a question", short: "Ask" },
  ];
  return [
    { act: "review", label: "Review", short: "Review", extra: busy ? "disabled" : "", tip: REVIEW_TIP },
    { act: "focus-ask", label: "Quick question", short: "Ask" },
    { act: "summarize", label: "Summarize", short: "Summarize" },
  ];
}

// Inline on each Overview row: the first command, the next two on hover, and ⋯ for the flyout.
function rowActs(c, kind) {
  const cmds = quickCmds(c, kind).slice(0, 3);
  const b = (x, i) => `<button class="${i === 0 ? "" : "more"}" data-act="row-${x.act}" data-pr="${c.number}" data-kind="${kind}" ${x.tip ? `title="${esc(x.tip)}"` : ""} ${x.extra || ""}>${esc(x.short)}</button>`;
  return `<div class="ov-acts">${cmds.map(b).join("")}<button class="quiet" data-act="flyout" data-pr="${c.number}" data-kind="${kind}" aria-label="All actions and chat for #${c.number}">${icon("more", "sm")}</button></div>`;
}

function flyCommands(c, kind) {
  return quickCmds(c, kind).map((x, i) => `<button class="${i === 0 ? "primary" : ""}" data-act="${x.act}" data-pr="${c.number}" data-kind="${kind}" ${x.tip ? `title="${esc(x.tip)}"` : ""} ${x.extra || ""}>${esc(x.label)}</button>`).join("");
}

function trackItem(c, isIssue) {
  if (isIssue || c.section === "yours" || c.section === "merged") return "";
  return c.local?.tracked === "reviewer"
    ? `<button role="menuitem" data-act="untrack" data-pr="${c.number}" title="Take it out of your Reviewing list. Nothing changes on GitHub.">Stop tracking</button>`
    : c.section === "reviewing" ? "" : `<button role="menuitem" data-act="track" data-pr="${c.number}" title="${esc(TRACK_TIP)}">Track under Reviewing</button>`;
}

  if (ft === "github") fillGhSlot(host, oldGh, fly.kind, c.number);

function openFlyout(kind, number, from) {
  if (!fly || fly.kind !== kind || fly.number !== number) flyDraft = "";
  fly = { kind, number };
  flyMore = false;
  flyReturnFocus = from || null;

}
function closeFlyout() {
  fly = null;
  viewing = null;
  flyMore = false;
  renderFlyout();
  flyReturnFocus?.isConnected ? flyReturnFocus.focus() : null;
}

async function loadChanges(n) {
  changes.set(n, { loading: true });
  renderFlyout();
  try {
    const res = await fetch(`/api/changes?repo=${encodeURIComponent(REPO)}&pr=${n}`);
    const data = await res.json();
    changes.set(n, res.ok ? { data } : { error: data.error || "HTTP " + res.status });
    if (res.ok && data.base && data.base !== data.head && data.commits.length) await post("/api/action", { pr: n, action: "explain-changes" }).catch(() => {});
  } catch (e) { changes.set(n, { error: e.message }); }
  renderFlyout();
}

function renderOverview() {
  const el = $("overview");
  const scroll = el.scrollTop;
  for (const inp of el.querySelectorAll(".ov-ask input, .ov-ask-inline input")) answers.set(Number(inp.dataset.pr), inp.value);
  const f = document.activeElement?.closest?.("#overview [data-act], #overview input, #overview select");
  const fk = f ? [f.tagName, f.dataset.act || "", f.dataset.pr || "", f.dataset.answer || "", f.dataset.enable || ""].join("|") : null;
  const cards = cardsOf();
  const unreadN = allItems().filter(isUnread).length;
  if (!unreadN && unreadOnly && !allItems().some(isReplying)) unreadOnly = false;
  const all = allItems();
  const ballOf = new Map(all.map((c) => [(c.kind === "issue" ? "i" : "p") + c.number, ball(c)]));
  const bOf = (c) => ballOf.get((c.kind === "issue" ? "i" : "p") + c.number) || ball(c);
  const GROUPS = [["you", "Your move", (b) => BALL[b.st].you], ["agent", "Agent working", (b) => b.st === "agent"], ["waiting", "Waiting on others", (b) => b.st === "waiting"], ["snoozed", "Snoozed", (b) => b.st === "snoozed"], ["backlog", "Not started", (b) => b.st === "backlog"], ["watching", "Watching", (b, c) => watched(c)]];
  const gCount = Object.fromEntries(GROUPS.map(([id, , f]) => [id, all.filter((c) => f(bOf(c), c)).length]));
  if (ballFilter && !gCount[ballFilter]) ballFilter = null;
  const gPass = ballFilter ? GROUPS.find((g) => g[0] === ballFilter)[2] : null;
  const keep = (c) => (!unreadOnly || isUnread(c) || isReplying(c)) && (!gPass || gPass(bOf(c), c));
  const yourMove = all.filter((c) => BALL[bOf(c).st].you).sort((a, b) => tsOf(bOf(a).since) - tsOf(bOf(b).since));
  const glyphFor = { you: "ready", agent: "agent", waiting: "waiting", snoozed: "snoozed", backlog: "backlog" };
  const { rows: secRows, merged } = sectionRows(keep);
  el.innerHTML = `<div class="ov-inner">
    <div class="ov-bar"><nav class="ov-jump" aria-label="Filter by whose move it is">${unreadN || unreadOnly ? `<button class="unread-chip${unreadOnly ? " on" : ""}" data-act="unread-only" aria-pressed="${unreadOnly}" title="${unreadOnly ? "Show everything again" : "Show only items with a reply you haven't read, or one still being written"}"><span class="unread-dot" aria-hidden="true"></span>Unread <span class="n">${unreadN}</span></button>${unreadN ? `<button class="quiet" data-act="mark-all-read">Mark all read</button>` : ""}` : ""}${GROUPS.filter(([id]) => gCount[id] || ballFilter === id).map(([id, label]) => `<button class="state-chip${ballFilter === id ? " on" : ""}" data-act="ball-filter" data-g="${id}" aria-pressed="${ballFilter === id}" ${id === "watching" ? 'title="PRs Agent merge is watching: it addresses reviews, fixes CI and resolves conflicts as they come in"' : ""}>${id === "watching" ? `<span class="g g-watch">${icon("eye", "sm")}</span>` : ballGlyph({ st: glyphFor[id] })}${esc(label)} <span class="n">${gCount[id]}</span></button>`).join("")}</nav>
      <span class="right"><label for="ovSort">Sort</label><select id="ovSort">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${k === sortBy ? "selected" : ""}>${l}</option>`).join("")}</select></span></div>
    ${ballFilter || unreadOnly ? "" : yourMoveBox(yourMove)}
    ${SECTIONS.map(([id, title, hint, cols], i) => {
      const rows = secRows[i];
      return `<section class="ov-sec" id="sec-${id}" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><span class="n">${rows.length}</span><p>${esc(hint)}</p></header>
        <div role="list">${rows.map((c) => ovRow(c, id)).join("") || `<div class="ov-empty">Nothing here.</div>`}</div></section>`;
    }).join("")}
    ${merged.length && !unreadOnly ? `<details class="ov-merged"><summary>${icon("chevRight", "sm chev")}Merged today <span class="n">${merged.length}</span></summary><div role="list">${merged.map((c) => ovRow(c, "merged")).join("")}</div></details>` : ""}
    ${(() => {
      const hidden = [...cards.filter((c) => c.section !== "merged" && c.local?.hidden), ...listIssues().filter((c) => c.hidden)];
      return hidden.length && !unreadOnly ? `<details class="ov-hidden"><summary>${icon("chevRight", "sm chev")}Removed from the board <span class="n">${hidden.length}</span></summary><ul style="list-style:none;padding:0;margin:var(--s2) 0 0">${hidden.map((h) => `<li>${h.kind === "issue" ? "Issue" : "PR"} #${h.number} · ${esc(h.title)} <button data-act="unhide" data-pr="${h.number}" data-kind="${h.kind === "issue" ? "issue" : "pr"}">Put back</button></li>`).join("")}</ul></details>` : "";
    })()}

  el.scrollTop = scroll;

    const sel = tag === "SELECT" ? "#ovSort" : tag === "INPUT" ? `.ov-ask-inline input[data-pr="${pr}"]` : `[data-act="${act}"]${pr ? `[data-pr="${pr}"]` : ""}${ans ? `[data-answer="${CSS.escape(ans)}"]` : ""}${en ? `[data-enable="${en}"]` : ""}`;
