<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PR board</title>
<style>
/* Theme: the app injects these tokens; values after the comma are fallbacks for a plain browser. */
:root {
  --status-bar-color: var(--background-color-default, #ffffff);
  --bg: var(--background-color-default, #ffffff);
  --fg: var(--text-color-default, #1f2328);
  --muted: var(--text-color-muted, #59636e);
  --border: var(--border-color-default, #d1d9e0);
  --focus: var(--color-focus-outline, #0969da);
  --red: var(--true-color-red, #cf222e);
  --red-muted: var(--true-color-red-muted, rgba(207,34,46,.12));
  --green: var(--true-color-green, #1a7f37);
  --green-muted: var(--true-color-green-muted, rgba(26,127,55,.12));
  --blue: var(--true-color-blue, #0969da);
  --blue-muted: var(--true-color-blue-muted, rgba(9,105,218,.12));
  --yellow: var(--true-color-yellow, #9a6700);
  --yellow-muted: var(--true-color-yellow-muted, rgba(154,103,0,.14));
  --purple: var(--true-color-purple, #8250df);
  --purple-muted: var(--true-color-purple-muted, rgba(130,80,223,.12));
  --orange: var(--true-color-orange, #bc4c00);
  --orange-muted: var(--true-color-orange-muted, rgba(188,76,0,.12));
  --subtle: color-mix(in srgb, var(--fg) 4%, var(--bg));
  --hairline: color-mix(in srgb, var(--border) 60%, transparent);
  --selected: color-mix(in srgb, var(--blue) 8%, var(--bg));
  --mono: var(--font-mono, "SFMono-Regular", Consolas, monospace);

  /* Type scale: 4 sizes, 2 weights. */
  --t-meta: 12px;
  --t-small: 13px;
  --t-body: var(--text-body-medium, 14px);
  --t-title: var(--text-title-small, 16px);
  --w-strong: var(--font-weight-semibold, 600);

  /* Spacing scale (4px base). */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;

  --list-w: 300px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--t-body); line-height: var(--leading-body-medium, 20px);
  display: flex; flex-direction: column; overflow: hidden;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.i.sm { width: 14px; height: 14px; vertical-align: -2px; }

/* Buttons: one primary per view; everything else secondary or quiet. */
button, a.btn { font: inherit; font-size: var(--t-small); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; line-height: 20px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover:not(:disabled), a.btn:hover { background: var(--subtle); text-decoration: none; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--blue); color: var(--color-white, #fff); border-color: var(--blue); }
button.primary:hover:not(:disabled) { background: var(--blue); filter: brightness(1.08); }
button.confirm { background: var(--orange); color: var(--color-white, #fff); border-color: var(--orange); }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 6px; }
button.quiet:hover:not(:disabled) { color: var(--fg); }
code { font-family: var(--mono); font-size: var(--t-meta); background: var(--subtle); padding: 0 4px; border-radius: 4px; }

/* Status chip: icon (colored) + label (always --fg for contrast) on a tint. */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px 1px 6px; font-size: var(--t-meta); line-height: 18px; font-weight: var(--w-strong); color: var(--fg); background: var(--subtle); white-space: nowrap; }
.chip .age { font-weight: 400; color: var(--fg); opacity: .8; }
.chip.you { background: var(--orange-muted); } .chip.you .i { color: var(--orange); }
.chip.agent { background: var(--purple-muted); } .chip.agent .i { color: var(--purple); }
.chip.info { background: var(--blue-muted); } .chip.info .i { color: var(--blue); }
.chip.ok { background: var(--green-muted); } .chip.ok .i { color: var(--green); }
.chip.stuck { background: var(--red-muted); } .chip.stuck .i { color: var(--red); }
.row-hint { color: var(--text-color-muted, #59636e); font-weight: normal; }
.chip.neutral .i { color: var(--muted); }
/* ---- Ball: one glyph per state, so color is never the only signal ---- */
.g { width: 20px; height: 20px; flex: none; display: inline-grid; place-items: center; border-radius: 50%; }
.g svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.g-decide, .g-ready { background: var(--orange); color: var(--bg); }
.g-blocked { background: var(--red); color: var(--bg); }
.g-nextpr { background: var(--blue-muted); color: var(--blue); }
.g-waiting { border: 1.5px solid var(--muted); width: 18px; height: 18px; margin: 1px; }
.g-quiet { color: var(--green); }
.g-backlog, .g-snoozed { color: var(--muted); }
.spin { width: 16px; height: 16px; flex: none; animation: spin .9s linear infinite; color: var(--purple); margin: 2px; }
.spin circle { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 26 40; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.tone-you-text { color: var(--orange); }
.owner { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-meta); color: var(--muted); white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.owner .avatar { width: 18px; height: 18px; }
.pill { font-size: var(--t-meta); border-radius: 999px; padding: 0 8px; line-height: 18px; background: var(--subtle); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.stuck { background: var(--red-muted); color: var(--fg); font-weight: var(--w-strong); }
.btns { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btns button { font-size: var(--t-meta); padding: 1px 9px; }
.snooze-opts { display: inline-flex; gap: 2px; border: 1px solid var(--border); border-radius: 6px; padding: 1px; }
.ball-line { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; font-size: var(--t-small); padding: 6px 10px; border-radius: 8px; background: var(--subtle); }
.ball-line .txt { flex: 1 1 14em; min-width: 0; }
.ball-line.t-you { background: color-mix(in srgb, var(--orange) 10%, var(--bg)); }
.ball-line.t-stuck { background: var(--red-muted); }
.ball-line.t-agent { background: var(--purple-muted); }
.state-chip { border-radius: 999px; padding: 2px 10px 2px 4px; font-size: var(--t-small); gap: 6px; }
.state-chip .g { width: 18px; height: 18px; } .state-chip .g svg { width: 12px; height: 12px; }
.state-chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.state-chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); } .state-chip.on .n { color: inherit; opacity: .75; }
/* Your move box */
.ym { border: 1px solid var(--orange); border-radius: 12px; padding: var(--s3) var(--s4) var(--s4); background: color-mix(in srgb, var(--orange) 5%, var(--bg)); }
.ym.empty { border-color: var(--border); background: var(--subtle); padding: var(--s3) var(--s4); }
.ym-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); flex-wrap: wrap; }
.ym.empty .ym-head { margin: 0; }
.ym-head h2 { margin: 0; font-size: var(--t-title); }
.ym-head .n { color: var(--muted); }
.ym-head .hint { font-size: var(--t-meta); color: var(--muted); margin-left: var(--s2); }
.ym-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--s3); }
.ym-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.ym-card.st-blocked { border-color: var(--red); }
.ym-h { display: flex; align-items: center; gap: var(--s2); }
.ym-h .sp { flex: 1; }
.ym-kind { font-size: var(--t-meta); font-weight: var(--w-strong); color: var(--orange); }
.ym-card.st-blocked .ym-kind { color: var(--red); }
.ym-card.st-nextpr .ym-kind { color: var(--blue); }
.ym-t { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.ym-t .ov-title { font-size: var(--t-body); }
.ym-ask { font-size: var(--t-small); }
.ov-ask-inline { display: flex; gap: 6px; flex-wrap: wrap; }
.ov-ask-inline input { flex: 1; min-width: 140px; font: inherit; font-size: var(--t-small); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
.ov-ask-inline button { font-size: var(--t-meta); padding: 1px 9px; }
/* Rows: a status rail, the item and its ask, then owner and age */
.ov-row.r2 { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; column-gap: var(--s3); align-items: center; padding: 8px var(--s3) 8px var(--s2); border-left: 3px solid transparent; }
.ov-row.r2.mine { border-left-color: var(--orange); background: color-mix(in srgb, var(--orange) 4%, var(--bg)); }
.ov-row.r2.st-blocked { border-left-color: var(--red); }
.ov-row.r2.st-quiet, .ov-row.r2.st-backlog, .ov-row.r2.st-snoozed { opacity: .72; }
.ov-row.r2 .rail { display: grid; place-items: center; }
.ov-row.r2 .num { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; font-size: var(--t-small); }
.ov-row.r2 .ask { font-size: var(--t-small); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-row.r2.mine .ask { color: var(--fg); }
.ov-row.r2 .right { display: flex; align-items: center; gap: var(--s2); }
.ov-row.r2 .right > button { font-size: var(--t-meta); padding: 1px 9px; }
.ov-row.r2 .ov-acts { margin: 0; }
.ov-row.r2 .ov-acts > button:not(.quiet) { display: none; }
.ov-row.r2:hover .ov-acts > button:not(.more), .ov-row.r2:focus-within .ov-acts > button:not(.more) { display: inline-flex; }
body.ovnarrow .ov-row.r2 { grid-template-columns: 26px minmax(0, 1fr); }
body.ovnarrow .ov-row.r2 .right { grid-column: 2; flex-wrap: wrap; margin-top: 4px; }
body.ovnarrow .ov-row.r2 .ov-main { grid-column: 2; }
body.ovnarrow .ov-row.r2 .rail { grid-row: 1 / span 2; align-self: start; padding-top: 2px; }
.rask { font-size: var(--t-meta); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rask.t-you b { color: var(--orange); } .rask.t-stuck b { color: var(--red); } .rask.t-agent { color: var(--purple); }
.rrow .l1 .g, .rrow .l1 .spin { align-self: center; }
.rrow .l1 .g { width: 16px; height: 16px; } .rrow .l1 .g svg { width: 11px; height: 11px; } .rrow .l1 .g-waiting { width: 14px; height: 14px; }
.rrow .l1 .spin { width: 14px; height: 14px; margin: 1px; }
.chip-link { border: 0; background: none; padding: 0; margin: 0; cursor: pointer; text-decoration: none; color: inherit; font: inherit; display: inline-flex; border-radius: 999px; }
.chip-link:hover .chip { outline: 1px solid var(--border); }
.kind-tag { font-size: var(--t-meta); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); line-height: 16px; }
.explainer .ex-head { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.explainer .ex-head h3 { margin: 0; font-size: var(--t-small); font-weight: var(--w-strong); }
.explainer .ex-head .note { font-weight: 400; color: var(--muted); font-size: var(--t-meta); }
.explainer > h3 { margin: var(--s3) 0 var(--s1); }
.explainer .ex-head .sp { flex: 1; }
.explainer h3 + .md, .explainer .md + h3 { margin-top: var(--s2); }
.explainer .md { max-width: 72ch; }
.explainer.empty .hint { margin: var(--s1) 0 var(--s2); }
.chip.new { background: var(--blue); color: var(--bg); } .chip.new .i { color: var(--bg); }
.unread-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); margin-right: 6px; vertical-align: middle; flex: none; }
.ov-row.unread .ov-title { font-weight: var(--w-strong); }
.ov-title-row .chip { flex: none; }
.unread-chip { border: 1px solid var(--blue); border-radius: 999px; background: var(--blue-muted); color: var(--fg); font-size: var(--t-small); padding: 2px 10px; display: inline-flex; align-items: center; }
.unread-chip.on { background: var(--blue); color: var(--bg); } .unread-chip.on .unread-dot { background: var(--bg); } .unread-chip.on .n { color: var(--bg); }
.new-div { display: flex; align-items: center; gap: var(--s2); color: var(--blue); font-size: var(--t-meta); font-weight: var(--w-strong); margin: var(--s2) 0; }
.new-div::before, .new-div::after { content: ""; flex: 1; border-top: 1px solid var(--blue); }
/* "Your move" and "stuck" are the two states that must jump out: solid fills. */
.chip.you.solid { background: var(--orange); color: var(--bg); } .chip.you.solid .i, .chip.you.solid .age { color: var(--bg); opacity: 1; }
.chip.stuck.solid { background: var(--red); color: var(--bg); } .chip.stuck.solid .i, .chip.stuck.solid .age { color: var(--bg); opacity: 1; }
.tone-you { color: var(--orange); } .tone-agent { color: var(--purple); }
.tone-ok { color: var(--green); } .tone-bad { color: var(--red); } .tone-run { color: var(--yellow); } .tone-mute { color: var(--muted); }

/* ---- Header ---- */
header.top { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--border); flex: none; min-width: 0; }
header.top h1 { margin: 0; font-size: var(--t-body); font-weight: var(--w-strong); white-space: nowrap; }
header.top h1 span { color: var(--muted); font-weight: 400; }
.meta { color: var(--muted); font-size: var(--t-meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.banner { margin: var(--s2) var(--s4) 0; padding: var(--s2) var(--s3); border-radius: 6px; background: var(--red-muted); color: var(--fg); flex: none; display: flex; gap: var(--s2); }
.banner .i { color: var(--red); }
.toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; font-size: var(--t-small); opacity: 0; transition: opacity .2s ease-out; pointer-events: none; max-width: 80%; z-index: 20; }
.toast.show { opacity: .95; }
.layout { flex: 1; display: flex; min-height: 0; }

/* ---- Rail: a compact copy of the Overview's sections, beside the detail view ---- */
aside { width: var(--list-w); min-width: 240px; max-width: 50%; flex: none; overflow-y: auto; padding-bottom: var(--s4); background: var(--bg); }
.split { width: 5px; flex: none; cursor: col-resize; border-left: 1px solid var(--border); }
.split:hover, .split.drag { background: var(--blue-muted); }
.rail-head { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); font-size: var(--t-small); }
.rail-head b { font-weight: var(--w-strong); }
.rail-head .sp { flex: 1; }
.rsec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: var(--s2) var(--s3) var(--s1); font-size: var(--t-meta); font-weight: var(--w-strong); color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
.rsec > summary::-webkit-details-marker { display: none; }
.rsec > summary .chev { transition: transform .15s ease-out; }
.rsec[open] > summary .chev { transform: rotate(90deg); }
.rsec > summary .n { font-weight: 400; font-variant-numeric: tabular-nums; }
.rsec > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }
.rrow { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 6px var(--s3) 7px; cursor: pointer; border-left: 3px solid transparent; }
.rrow:hover { background: var(--subtle); }
.rrow.sel { background: var(--selected); border-left-color: var(--blue); }
.rrow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.rrow .l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: var(--t-small); }
.rrow .num { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.rrow .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rrow.unread .tt { font-weight: var(--w-strong); }
.rrow .unread-dot { margin-right: 0; align-self: center; }
.rrow .l2 { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.rrow .l2 .chip { max-width: 100%; }
.rrow .l2 .chip > span:not(.age) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-empty { color: var(--muted); font-size: var(--t-meta); padding: 2px var(--s3) var(--s2) calc(var(--s3) + 3px); }
#railToggle { display: none; }
body:not(.ovmode) #railToggle { display: inline-flex; }
body.rail-off aside, body.rail-off .split { display: none; }
/* Narrow panels: the rail floats over the workspace and closes after you pick something. */
body.railover .layout { position: relative; }
body.railover aside { position: absolute; z-index: 15; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); max-width: none; box-shadow: 0 8px 28px rgba(0,0,0,.28); border-right: 1px solid var(--border); }
body.railover .split { display: none; }
.avatar { width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px; background: var(--subtle); }
.sep { opacity: .6; }

/* ---- Workspace ---- */
.ws { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ws-head { padding: var(--s4) var(--s5) 0; border-bottom: 1px solid var(--border); flex: none; display: flex; flex-direction: column; gap: var(--s2); }
.ws-head h2 { margin: 0; font-size: var(--t-title); line-height: 22px; font-weight: var(--w-strong); }
.ws-head h2 a { color: var(--muted); font-weight: 400; white-space: nowrap; }
.ws-meta { display: flex; gap: var(--s2) var(--s3); flex-wrap: wrap; align-items: center; font-size: var(--t-meta); color: var(--muted); }
.ws-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.next { display: flex; align-items: flex-start; gap: var(--s2); font-size: var(--t-small); padding: 6px 10px; border-radius: 6px; background: var(--subtle); }
.next.you { background: var(--orange-muted); } .next.you .i { color: var(--orange); }
.next.agent { background: var(--purple-muted); } .next.agent .i { color: var(--purple); }
.next b { font-weight: var(--w-strong); }
.actions { display: flex; gap: var(--s2); flex-wrap: wrap; position: relative; align-items: center; margin-top: var(--s1); }
.menu { position: absolute; top: 32px; z-index: 5; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; padding: var(--s1); min-width: 220px; }
.menu button { border: 0; justify-content: flex-start; padding: 6px 10px; }
.menu button:focus-visible { outline-offset: -2px; }
.tabs { display: flex; gap: var(--s1); margin-top: var(--s2); overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px 8px; color: var(--muted); background: none; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue); font-weight: var(--w-strong); }
.tabs .n { font-size: var(--t-meta); color: var(--muted); font-weight: 400; }

.scroll { flex: 1; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
.sec > h3 { margin: 0 0 var(--s2); font-size: var(--t-small); font-weight: var(--w-strong); display: flex; gap: var(--s2); align-items: baseline; }
.sec > h3 .note { font-weight: 400; color: var(--muted); font-size: var(--t-meta); }
.summary { font-size: 15px; line-height: 22px; max-width: 72ch; }
.summary .i { color: var(--purple); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--s1); max-width: 72ch; }
.steps b { font-weight: var(--w-strong); }
.callout { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: 8px; background: var(--red-muted); max-width: 80ch; }
.callout .i { color: var(--red); margin-top: 2px; }
.callout .body { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
.grid { display: grid; grid-template-columns: minmax(84px, max-content) 1fr; gap: var(--s2) var(--s4); font-size: var(--t-small); margin: 0; max-width: 80ch; }

.ov-cols { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--cols), 168px); gap: var(--s3); padding: 0 var(--s3) var(--s1); font-size: var(--t-meta); color: var(--muted); border-bottom: 1px solid var(--border); }
.ov-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--cols), 168px); gap: var(--s1) var(--s3); padding: var(--s3); border-bottom: 1px solid var(--hairline); align-items: start; }
.ov-row { cursor: pointer; }
.ov-row:hover { background: var(--subtle); }
.ov-line { display: flex; align-items: center; gap: var(--s1) var(--s3); flex-wrap: wrap; min-width: 0; }
.ov-line .ov-where { flex: 1 1 14em; min-width: 0; }
.ov-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ov-jump { display: flex; gap: 4px; flex-wrap: wrap; }
.ov-jump button { font-size: var(--t-small); padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--fg); }
.ov-jump button:hover { background: var(--subtle); }
.ov-jump .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 2px; }
.ov-sec { scroll-margin-top: var(--s3); }
.msg.streaming .step { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--t-small); }
.menu a.menu-link { display: flex; align-items: center; gap: var(--s2); color: var(--fg); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: var(--t-small); }
.menu a.menu-link:hover { background: var(--subtle); }
.menu a.menu-link:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.ov-acts button { font-size: var(--t-meta); padding: 0 8px; line-height: 22px; }
.ov-acts .more { display: none; }
.ov-row:hover .ov-acts .more, .ov-row:focus-within .ov-acts .more { display: inline-flex; }
.fly-menu { position: absolute; right: var(--s5); top: 44px; z-index: 2; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; padding: var(--s1); min-width: 200px; }
.fly-menu button { border: 0; justify-content: flex-start; padding: 6px 10px; }
.fly-head { position: relative; }
.ov-hidden > summary { cursor: pointer; font-size: var(--t-small); font-weight: var(--w-strong); list-style: none; display: flex; gap: var(--s2); align-items: center; color: var(--muted); }
.ov-hidden > summary::-webkit-details-marker { display: none; }
.ov-hidden[open] > summary .chev { transform: rotate(90deg); }
.ov-hidden li { display: flex; gap: var(--s2); align-items: center; font-size: var(--t-small); padding: 4px 0; }
.ov-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ov-title { all: unset; cursor: pointer; font-weight: var(--w-strong); font-size: var(--t-body); line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-title:hover { text-decoration: underline; }
.ov-title:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.ov-sub { font-size: var(--t-meta); color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-where { font-size: var(--t-small); color: var(--fg); display: flex; gap: 6px; align-items: flex-start; }
.ov-where .i { margin-top: 2px; }
.ov-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.ov-cell .chip { max-width: 100%; }
.ov-cell .chip > span:not(.age) { overflow: hidden; text-overflow: ellipsis; }
.ov-cell .since { font-size: var(--t-meta); color: var(--muted); font-variant-numeric: tabular-nums; }
.ov-cell .since.stuck { color: var(--fg); font-weight: var(--w-strong); }
.ov-cell .k { display: none; font-size: var(--t-meta); color: var(--muted); }
.ov-cell button { font-size: var(--t-meta); padding: 0 8px; line-height: 20px; }
.ov-story { font-size: var(--t-meta); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ov-story b { color: var(--fg); font-weight: 400; }
.ov-ask { grid-column: 1 / -1; display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); border-radius: 8px; background: var(--orange-muted); }
.ov-ask .q { display: flex; gap: var(--s2); font-size: var(--t-small); }
.ov-ask .q .i { color: var(--orange); margin-top: 2px; }
.ov-ask .row2 { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.ov-ask input { flex: 1; min-width: 180px; font: inherit; font-size: var(--t-small); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
.ov-ask input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.ov-empty { color: var(--muted); font-size: var(--t-small); padding: var(--s3); }
.ov-merged > summary { cursor: pointer; font-size: var(--t-small); font-weight: var(--w-strong); list-style: none; display: flex; gap: var(--s2); align-items: center; }
.ov-merged > summary::-webkit-details-marker { display: none; }
.ov-merged[open] > summary .chev { transform: rotate(90deg); }
.syncinfo { font-size: var(--t-meta); color: var(--muted); white-space: nowrap; }
body.ovmode .layout { display: none; }
body:not(.ovmode) .ov { display: none; }
body:not(.ovmode) #sync, body:not(.ovmode) #syncInfo { display: none; }
body.ovmode #toOverview { display: none; }
/* Narrow overview: the status columns stack under the title, each with its label. */
body.ovnarrow .ov-cols { display: none; }
body.ovnarrow .ov-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
body.ovnarrow .ov-main { grid-column: 1 / -1; }
body.ovnarrow .ov-cell .k { display: block; }
body.ovnarrow .ov { padding: var(--s3) var(--s4) var(--s5); }

/* ---- Flyout: a right-side drawer over the Overview ---- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 30; }
.fly { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 94vw); z-index: 31; background: var(--bg); border-left: 1px solid var(--border); box-shadow: -12px 0 32px rgba(0,0,0,.22); display: flex; flex-direction: column; }
.fly-head { padding: var(--s4) var(--s5) var(--s3); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--s2); }
.fly-head .top { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-meta); color: var(--muted); }
.fly-head .top .sp { flex: 1; }
.fly-head h2 { margin: 0; font-size: var(--t-title); line-height: 22px; font-weight: var(--w-strong); }
.fly-body { flex: 1; overflow-y: auto; padding: var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
.fly-cmds { display: flex; flex-wrap: wrap; gap: var(--s2); }
.fly .chips { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.changes { display: flex; flex-direction: column; gap: var(--s2); font-size: var(--t-small); }
.changes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.changes .sha { font-family: var(--mono); font-size: var(--t-meta); color: var(--muted); margin-right: 6px; }
.changes .file { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--s2); font-family: var(--mono); font-size: var(--t-meta); }
.changes .file span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changes .add { color: var(--green); font-variant-numeric: tabular-nums; } .changes .del { color: var(--red); font-variant-numeric: tabular-nums; }
.fly .composer { padding: var(--s3) var(--s5); }
button.ico, a.ico { padding: 3px 6px; }
.ov-title-row { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.ov-title-row .ov-title { min-width: 0; }
.ov-title-row a.ico { border-color: transparent; color: var(--muted); }
.ov-title-row a.ico:hover { color: var(--fg); }

/* Diagram styles adapted from angelser's pr-arch-review, https://gist.github.com/angelser/01c49ffdd3296f58b25d78194bfe1ebe */
:root { --surface: color-mix(in srgb, var(--fg) 4%, var(--bg)); --surface-2: color-mix(in srgb, var(--fg) 8%, var(--bg));
  --c-added: var(--green); --c-added-bg: var(--green-muted); --c-modified: var(--orange); --c-modified-bg: var(--orange-muted);
  --c-removed: var(--red); --c-removed-bg: var(--red-muted);
  --sev-critical: var(--red); --sev-high: color-mix(in srgb, var(--red) 70%, var(--orange)); --sev-medium: var(--orange); --sev-low: var(--blue); --sev-info: var(--muted);
  --gc0: var(--blue); --gc1: var(--purple); --gc2: var(--orange); --gc3: var(--yellow); --gc4: var(--green); --gc5: var(--red); --gc6: var(--muted); --gc7: var(--yellow); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--border); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 2px solid; }
.legend .l-added { border-color: var(--c-added); background: var(--c-added-bg); }
.legend .l-modified { border-color: var(--c-modified); background: var(--c-modified-bg); }
.legend .l-removed { border-color: var(--c-removed); background: var(--c-removed-bg); border-style: dashed; }
.legend .l-unchanged { border-color: var(--border); background: var(--surface); }
.legend .l-external { border-color: var(--muted); border-style: dashed; background: transparent; }
.legend .line { display: inline-block; width: 26px; height: 0; border-top: 2.5px solid var(--muted); vertical-align: middle; margin-right: 5px; }
.legend .line.dashed { border-top-style: dashed; }
.legend .line.dotted { border-top-style: dotted; }
/* SVG */
svg.diagram { font-family: var(--font-sans, "Segoe UI", sans-serif); }
.node { cursor: pointer; transition: opacity 0.15s; }
.node-shape { fill: var(--surface); stroke: var(--border); stroke-width: 2; filter: url(#node-shadow); }
.node-detail { fill: none; stroke: var(--border); stroke-width: 1.5; }
.node-label { font-size: 18px; font-weight: 600; fill: var(--fg); }
.node-sublabel { font-size: 14px; fill: var(--muted); }
.node.st-added .node-shape { fill: color-mix(in srgb, var(--c-added) 12%, var(--bg)); stroke: var(--c-added); stroke-width: 2.5; }
.node.st-modified .node-shape { fill: color-mix(in srgb, var(--c-modified) 12%, var(--bg)); stroke: var(--c-modified); stroke-width: 2.5; }
.node.st-removed .node-shape { fill: color-mix(in srgb, var(--c-removed) 9%, var(--bg)); stroke: var(--c-removed); stroke-dasharray: 7 5; stroke-width: 2.5; }
.node.st-removed .node-label { text-decoration: line-through; fill: var(--muted); }
.node.st-external .node-shape { fill: var(--bg); stroke: var(--muted); stroke-dasharray: 4 4; }
.node.st-added .node-detail { stroke: var(--c-added); }
.node.st-modified .node-detail { stroke: var(--c-modified); }
.view-before .node.st-modified .node-shape, .view-after .node.st-modified .node-shape { stroke: var(--c-modified); }
.node.selected .node-shape { stroke: var(--focus); stroke-width: 3.5; }
.node:focus { outline: none; }
.node:focus-visible .node-shape { stroke: var(--focus); stroke-width: 3.5; }
.status-tag rect { stroke: var(--bg); stroke-width: 2; }
.status-tag text { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; fill: var(--color-white, #fff); }
.status-tag.st-added rect { fill: var(--c-added); }
.status-tag.st-modified rect { fill: var(--c-modified); }
.status-tag.st-removed rect { fill: var(--c-removed); }
.status-tag.st-external rect { fill: var(--muted); }
.badge circle { stroke: var(--bg); stroke-width: 2.5; fill: var(--sev-medium); }
.badge.sev-critical circle, .badge.sev-high circle { fill: var(--sev-critical); }
.badge.sev-low circle, .badge.sev-info circle { fill: var(--sev-low); }
.badge text { font-size: 13px; font-weight: 800; fill: var(--color-white, #fff); }
.group-stripe { opacity: 0.9; }
.gc-0 { fill: var(--gc0); }
.gc-4 { fill: var(--gc4); }
.lane { stroke: var(--border); stroke-width: 1; }
.lane-0 { fill: color-mix(in srgb, var(--fg) 3%, transparent); }
.lane-1 { fill: color-mix(in srgb, var(--fg) 6%, transparent); }
.lane-label { font-size: 15px; font-weight: 750; fill: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
.edge-line { fill: none; stroke: var(--muted); stroke-width: 2.2; transition: opacity 0.15s, stroke-width 0.15s; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; }
.edge.st-added .edge-line { stroke: var(--c-added); stroke-width: 3; }
.edge.st-modified .edge-line { stroke: var(--c-modified); stroke-width: 3; }
.edge.st-removed .edge-line { stroke: var(--c-removed); stroke-dasharray: 8 6; stroke-width: 2.5; }
.edge.style-async .edge-line { stroke-dasharray: 9 6; }
.edge.style-data .edge-line { stroke-dasharray: 2 5; stroke-linecap: round; }
.edge.style-dependency .edge-line { stroke-dasharray: 12 4 2 4; }
.edge.style-return .edge-line { stroke-dasharray: 5 5; }
.arrowhead { fill: var(--muted); }
.arrowhead.st-added { fill: var(--c-added); }
.arrowhead.st-modified { fill: var(--c-modified); }
.arrowhead.st-removed { fill: var(--c-removed); }
.edge-label rect { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }
.edge-label text, .loop-label { font-size: 14px; font-weight: 500; fill: var(--fg); }
.edge-label.st-added rect { stroke: var(--c-added); }
.edge-label.st-modified rect { stroke: var(--c-modified); }
.edge-label.st-removed rect { stroke: var(--c-removed); }
.edge-label.st-removed text { text-decoration: line-through; }
svg.has-focus .node:not(.focus) { opacity: 0.28; }
svg.has-focus .edge:not(.focus), svg.has-focus .edge-label:not(.focus) { opacity: 0.15; }
svg.has-focus .edge.focus .edge-line { stroke-width: 3.5; }
.lifeline { stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 6; }
.msg-label { font-size: 15px; font-weight: 500; fill: var(--fg); }
.msg.st-removed .msg-label { text-decoration: line-through; fill: var(--muted); }
.msg.st-added .msg-label { fill: var(--c-added); font-weight: 650; }
.msg-note { font-size: 13px; fill: var(--muted); font-style: italic; }
.msg-num circle { fill: var(--surface-2); stroke: var(--border); }
.msg-num.st-added circle { fill: var(--c-added); stroke: none; }
.msg-num.st-modified circle { fill: var(--c-modified); stroke: none; }
.msg-num.st-removed circle { fill: var(--c-removed); stroke: none; }
.msg-num text { font-size: 12px; font-weight: 700; fill: var(--fg); }
.msg-num.st-added text, .msg-num.st-modified text, .msg-num.st-removed text { fill: var(--color-white, #fff); }
.seq-divider line { stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 3 4; }
.seq-divider rect { fill: var(--surface-2); }
.seq-divider text { font-size: 14px; font-weight: 700; fill: var(--muted); }
/* ---- PR detail: review tabs ---- */
.verdict { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.diag { display: flex; flex-direction: column; gap: var(--s2); }
.diag-host { border: 1px solid var(--border); border-radius: 8px; padding: var(--s2); overflow: auto; background: var(--bg); }
.diag-host svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--t-meta); color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 2px solid; }
.legend .l-added { border-color: var(--c-added); background: var(--c-added-bg); }
.legend .l-modified { border-color: var(--c-modified); background: var(--c-modified-bg); }
.legend .l-removed { border-color: var(--c-removed); background: var(--c-removed-bg); border-style: dashed; }
.legend .l-unchanged { border-color: var(--border); background: var(--surface); }
.nodepanel { border: 1px solid var(--border); border-radius: 8px; padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2); font-size: var(--t-small); }
.nodepanel h4 { margin: 0; font-size: var(--t-small); display: flex; gap: var(--s2); align-items: center; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.flist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s3); align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
.flist .path { font-family: var(--mono); font-size: var(--t-meta); }
a.path { overflow-wrap: break-word; }
.flist .what { grid-column: 1 / -1; font-size: var(--t-small); color: var(--fg); }
.flist .nums { font-size: var(--t-meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sysc { border: 1px solid var(--border); border-radius: 8px; padding: var(--s3); display: flex; flex-direction: column; gap: var(--s1); }
.sys-head { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.sys-head > .ask-end { margin-left: auto; }
.sys-head b { font-size: var(--t-body); }
.stc { font-size: var(--t-meta); font-weight: var(--w-strong); border-radius: 999px; padding: 0 8px; line-height: 18px; color: var(--fg); background: var(--surface-2); }
.stc.st-added { background: var(--c-added-bg); } .stc.st-modified { background: var(--c-modified-bg); } .stc.st-removed { background: var(--c-removed-bg); }
.rv-bar { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; position: relative; }
.rv-bar .count { font-size: var(--t-small); color: var(--muted); }
.finding { border: 1px solid var(--border); border-radius: 8px; padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.finding.d-post { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
.finding.d-ignore { opacity: .62; }
.finding .fh { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.finding .fh b { font-size: var(--t-body); }
.sev { font-size: var(--t-meta); font-weight: var(--w-strong); border-radius: 999px; padding: 0 8px; line-height: 18px; color: var(--fg); display: inline-flex; gap: 4px; align-items: center; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sev-info); }
.sev.s-critical::before { background: var(--sev-critical); } .sev.s-high::before { background: var(--sev-high); } .sev.s-medium::before { background: var(--sev-medium); } .sev.s-low::before { background: var(--sev-low); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 2px 10px; font-size: var(--t-meta); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.finding textarea, .rv-note { width: 100%; resize: vertical; min-height: 34px; font: inherit; font-size: var(--t-small); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
.expl { background: var(--purple-muted); border-radius: 6px; padding: var(--s2) var(--s3); font-size: var(--t-small); }
.preview { border: 2px solid var(--blue); border-radius: 8px; padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.preview .inl { border-left: 3px solid var(--border); padding-left: var(--s3); }
.split-btn { display: inline-flex; }
.split-btn .i { color: inherit !important; }
.split-btn > button:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split-btn > button + button { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); padding: 3px 6px; }
.empty-rv.rv-none { border-style: solid; border-color: var(--green); background: var(--green-muted); }
.empty-rv { display: flex; flex-direction: column; gap: var(--s3); align-items: flex-start; padding: var(--s4); border: 1px dashed var(--border); border-radius: 8px; }

/* ---- Narrow panel ---- */
body.narrow .ws-head { padding: var(--s3) var(--s4) 0; }
body.narrow .scroll { padding: var(--s4); }
body.narrow .composer { padding: var(--s3) var(--s4); }
body.narrow .grid { grid-template-columns: 1fr; gap: 2px; }
body.narrow .grid dd { margin-bottom: var(--s2); }
body.narrow #sumAll .lbl { display: none; }
</style>
</head>
<body>
<header class="top">
  <button id="toOverview" class="quiet" data-act="to-overview"></button>
  <button id="railToggle" class="quiet" data-act="rail-toggle" aria-controls="list"></button>
  <h1>Pull requests <span id="repo"></span></h1>
  <span class="meta" id="meta">Loading…</span>
  <span class="syncinfo" id="syncInfo"></span>
  <button id="sync" title="Ask the agent to refresh which sessions are working on these PRs, and their state"></button>
  <button id="sumAll" title="Ask the agent for plain-words summaries of the PRs that need you or an agent"></button>
  <button id="refresh" title="Re-read pull requests from GitHub"></button>
</header>
<div id="banner" class="banner" hidden></div>
<main class="ov" id="overview" aria-label="Pull request overview"></main>
<div class="layout">
  <aside id="list" aria-label="All pull requests and issues"></aside>
  <div class="split" id="split" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
  <section class="ws" aria-label="Pull request workspace">
