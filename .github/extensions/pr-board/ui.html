}

function renderSyncInfo() {
  const s = snap?.sync || {};
  const cards = cardsOf();
  const waiting = allItems().filter(isYourMove).length;
  const stuck = cards.filter((c) => c.section !== "merged" && c.reason?.stuck).length;
  const asked = s.requestedAt && (!s.syncedAt || s.requestedAt > s.syncedAt);
  $("syncInfo").textContent = asked ? "Sync requested…" : s.syncedAt ? `Sessions synced ${ago(s.syncedAt)}${ago(s.syncedAt) === "just now" ? "" : " ago"}` : "Sessions not synced yet";
  const open = cards.filter((c) => c.section !== "merged").length;
  const nIssues = listIssues().filter((i) => !i.hidden && i.state !== "CLOSED").length;
  if (view === "overview") $("meta").innerHTML = `<b>${open} open</b>${nIssues ? ` · ${nIssues} issue${nIssues === 1 ? "" : "s"}` : ""} · ${waiting} your move · ${stuck} stuck · updated ${esc(ago(snap.fetchedAt))}${ago(snap.fetchedAt) === "just now" ? "" : " ago"}`;
}

async function requestSync() {
  try { const r = await post("/api/sync", {}); toast(`Asked the agent to sync ${r.tracked} PR${r.tracked === 1 ? "" : "s"}`); }
  catch (e) { toast("Couldn't start a sync: " + e.message); }
}

function render(force = false) {
  if (!snap) return;
  $("repo").textContent = snap.repo;
  $("banner").hidden = !snap.error;
  if (snap.error) $("banner").innerHTML = `${icon("alert")}<span>${esc(snap.error.message)}</span>`;
  const cards = cardsOf();
  const open = cards.filter((c) => c.group !== "merged").length;
  $("meta").textContent = snap.loading && !snap.fetchedAt ? "Loading…" : `${open} open · ${cards.length - open} merged today · ${snap.loading ? "refreshing…" : "updated " + ago(snap.fetchedAt) + (ago(snap.fetchedAt) === "just now" ? "" : " ago")}` + (snap.viewer ? ` · @${snap.viewer}` : "");
  $("meta").title = $("meta").textContent;
  if (!current() && cards.length) { const first = sectionRows().rows.flat().find((c) => c.kind !== "issue"); selected = (first || cards[0]).number; force = true; }
  document.body.classList.toggle("ovmode", view === "overview");
  renderSyncInfo();
  applyRail();
  if (view === "overview") { renderOverview(); renderFlyout(); markViewed(); return; }
  renderRail();
  const c = current();
  $("wsHead").hidden = !c;
  $("input").disabled = $("send").disabled = !c;
  if (!c) return;
  $("input").placeholder = `Ask a question or give direction on #${c.number}…`;
  const focusAct = document.activeElement?.closest?.("#wsHead [data-act]")?.dataset.act;
  if (c.kind === "issue") renderIssueHead(c); else renderHead(c);
  if (focusAct) $("wsHead").querySelector(`[data-act="${focusAct}"]`)?.focus();
  if (["thread", "review", "overview"].includes(tab)) noteViewing(c);
  if (c.kind === "issue") renderIssueScroll(c, force);
  else { renderScroll(c, force); scheduleDetail(c); }
  if (fly) renderFlyout();
  markViewed();
  scrollToNew($("wsScroll"));
}
function scrollToNew(box) {
  const d = box?.querySelector(".new-div");
  if (!d || !viewing || viewing.scrolled) return;
  viewing.scrolled = true;
  d.scrollIntoView({ block: "center" });
}

function select(pr, { tabTo, focus } = {}) {
  if (tabTo) { tab = tabTo; store.set("prb-tab", tab); }
  document.body.classList.add("detail");
  if (pr === selected && !tabTo) { render(); return; }
  selected = pr;
  store.set(SEL_KEY, String(pr));
  openMenu = null;
  armed = null;
  render(true);
  if (focus) $("wsHead").querySelector("h2 a, [data-act]")?.focus();
}

function arm(key, label) {
  clearTimeout(armed?.timer);
  armed = { key, label, timer: setTimeout(() => { armed = null; render(); }, 8000) };
  render();
}

function openMenuAndFocus(name) {
  openMenu = openMenu === name ? null : name;
  render();
  if (openMenu) $("wsHead").querySelector('.menu [role="menuitem"]')?.focus();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    const row = e.target.closest(".ov-row");
    if (row && !e.target.closest("a, button, input, textarea, select, summary")) return row.querySelector(".ov-title")?.click();
    if (flyMore && !e.target.closest(".fly-menu")) { flyMore = false; renderFlyout(); }
    if (openMenu) { openMenu = null; render(); }
    return;
  }
  const a = el.dataset.act;
  const rowPr = el.dataset.pr ? Number(el.dataset.pr) : null;
  if (a === "select") return select(rowPr ?? selected);
  if (a === "rail-toggle") return setRail(!railOpen);
  if (a === "rail-open") {
    if (railMq.matches) { railOpen = false; applyRail(); }
    return select(rowPr, { focus: false });
  }
  if (a === "unread-only") { unreadOnly = !unreadOnly; return render(); }
  if (a === "mark-all-read") return post("/api/seen", { all: true }).then(() => toast("Marked everything as read")).catch((err) => toast("Couldn't do that: " + err.message));
  if (a === "mark-read") { openMenu = null; flyMore = false; const it = itemOf(el.dataset.kind || "pr", rowPr); if (!it) return; return post("/api/seen", { pr: rowPr, kind: el.dataset.kind || "pr" }).then(() => toast("Marked as read")).catch((err) => toast("Couldn't do that: " + err.message)); }
  if (a === "jump") { const s = document.getElementById("sec-" + el.dataset.sec); if (s) { s.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); s.querySelector(".ov-title")?.focus({ preventScroll: true }); } return; }
  if (a === "flyout") return openFlyout(el.dataset.kind || "pr", rowPr, el);
  if (a === "fly-close") return closeFlyout();
  if (a === "issue-chip") { flyTab = "github"; store.set("prb-fly-tab", flyTab); return openFlyout("issue", rowPr, el); }
  if (a === "fly-tab") { flyTab = el.dataset.tab; store.set("prb-fly-tab", flyTab); const b = $("flyHost").querySelector(".fly-body"); if (b) b.scrollTop = 0; renderFlyout(); return $("flyHost").querySelector(`[data-act="fly-tab"][data-tab="${flyTab}"]`)?.focus(); }
  if (a.startsWith("br-")) return brClick(a, el, rowPr);
  if (a === "gh-refresh") return loadGitHubView(el.dataset.kind === "issue" ? "issue" : "pr", Number(el.dataset.pr), true);
  if (a === "focus-ask") return $("flyInput")?.focus();
  if (a === "fly-more") { flyMore = !flyMore; renderFlyout(); return $("flyHost").querySelector(".fly-menu button")?.focus(); }
  if (a === "hide" || a === "unhide") {
    flyMore = false;
    if (a === "hide" && fly?.number === rowPr) closeFlyout();
    return post("/api/action", { pr: rowPr, action: a, kind: el.dataset.kind || "pr" }).then(() => toast(a === "hide" ? "Removed from the board. It's listed under \"Removed from the board\" at the bottom." : "Back on the board")).catch((err) => toast("Couldn't do that: " + err.message));
  }
  if (a.startsWith("row-") && el.closest(".ov-row")) {
    // Inline row commands open the flyout too, so the answer has somewhere to show up.
    const cmd = a.slice(4), kind = el.dataset.kind || "pr";
    openFlyout(kind, rowPr, el.closest(".ov-row").querySelector(".ov-title"));
    if (cmd === "focus-ask") return $("flyInput")?.focus();
    const target = $("flyHost").querySelector(`.fly-cmds [data-act="${cmd}"]`);
    return target?.click();
  }
  if (a === "what-changed") { loadChanges(rowPr); return; }
  if (a === "ball-filter") { ballFilter = ballFilter === el.dataset.g ? null : el.dataset.g; return render(); }
  if (a === "snooze-menu") { snoozeOpen = `${el.dataset.kind || "pr"}:${rowPr}`; render(); renderFlyout(); return document.querySelector(`[data-act="ball-snooze"][data-pr="${rowPr}"]`)?.focus(); }
  if (["ball-done", "ball-snooze", "ball-unsnooze", "choose", "fix", "open-pr"].includes(a)) {
    snoozeOpen = null;
    const body = { pr: rowPr, action: a, kind: el.dataset.kind || "pr", key: el.dataset.key, until: el.dataset.until, choice: el.dataset.choice, what: el.dataset.what };
    const msg = { "ball-done": "Marked done. It comes back if something changes.", "ball-snooze": "Snoozed. It comes back to Your move then.", "ball-unsnooze": "Back in Your move", choose: "Sent your choice to the agent", fix: "Asked the agent to fix it", "open-pr": "Asked the agent to open a PR" }[a];
    return post("/api/action", body).then(() => toast(msg)).catch((err) => toast("Couldn't do that: " + err.message));
  }
  if (a === "ball-reply") { const kind = el.dataset.kind || "pr"; openFlyout(kind, rowPr, el); return $("flyInput")?.focus(); }
  if (a === "ball-post") { fly = null; renderFlyout(); view = "detail"; tab = "review"; store.set("prb-tab", tab); return select(rowPr, { tabTo: "review" }); }
  if (a === "explain-item") return post("/api/action", { pr: rowPr, action: "explain-item", kind: el.dataset.kind || "pr" }).then(() => toast("Asked the agent to explain it; it appears here when ready")).catch((err) => toast("Couldn't ask: " + err.message));
  if (el.dataset.kind === "issue") return post("/api/action", { pr: rowPr, action: a, kind: "issue" }).then(() => toast(a === "untrack" ? "Removed from the board" : "Asked the agent")).catch((err) => toast("Couldn't do that: " + err.message));
  if (a === "track" || a === "untrack") { openMenu = null; flyMore = false; }
  if (a === "track" || a === "untrack") return post("/api/action", { pr: rowPr, action: a }).then(() => toast(a === "track" ? "Tracking it under Reviewing. Nothing changed on GitHub." : "Stopped tracking it")).catch((err) => toast("Couldn't do that: " + err.message));
  if (a === "status-update" || a === "summarize-replies") return post("/api/action", { pr: rowPr, action: a }).then(() => toast("Asked the agent; the answer will appear in the thread")).catch((err) => toast("Couldn't do that: " + err.message));
  if (a === "open") { fly = null; renderFlyout(); view = "detail"; return select(rowPr, { focus: true }); }
  if (a === "to-overview") { view = "overview"; viewing = null; openMenu = null; armed = null; render(); return document.querySelector(`.ov-title[data-pr="${selected}"]`)?.focus(); }
  if (a === "sync") return requestSync();
  if (a === "answer" || a === "answer-text") {
    const answer = a === "answer" ? el.dataset.answer : (el.closest(".ov-ask, .ov-ask-inline")?.querySelector("input")?.value || "").trim();
    if (!answer) { toast("Type an answer first."); return; }
    answers.delete(rowPr);
    return post("/api/action", { pr: rowPr, action: "answer", answer }).then(() => toast("Answer sent to the agent")).catch((e) => toast("Couldn't send: " + e.message));
  }
  if (a === "rev-menu") { revMenu = revMenu === rowPr ? null : rowPr; render(); return document.querySelector(`[data-act="request-reviewer"][data-pr="${rowPr}"]`)?.focus(); }
  if (a === "request-reviewer") { revMenu = null; return post("/api/action", { pr: rowPr, action: "request-reviewer", who: el.dataset.who }).then(() => toast(el.dataset.who === "*" ? "Asked the agent to pick and request a reviewer" : `Asked the agent to request ${el.dataset.who}`)).catch((e) => toast("Couldn't do that: " + e.message)); }
  if (a === "finding-fix") return post("/api/action", { pr: rowPr, action: "fix-finding", findingId: el.dataset.id }).then(() => toast("Asked the agent to fix it")).catch((e) => toast("Couldn't do that: " + e.message));
  if (a === "finding-skip") { const it = itemOf("pr", rowPr); if (it) { it.local.triage = { ...(it.local.triage || {}), [el.dataset.id]: { ...(it.local.triage?.[el.dataset.id] || {}), decision: "ignore" } }; render(true); } return saveTriage(rowPr, el.dataset.id, { decision: "ignore" }).then(() => toast("Marked not needed")); }
  if (a === "fix-description") return post("/api/action", { pr: rowPr, action: "fix-description", issue: Number(el.dataset.issue) }).then(() => toast(`Asked the agent to add "Fixes #${el.dataset.issue}"`)).catch((e) => toast("Couldn't do that: " + e.message));
  if (a === "get-ready") return post("/api/action", { pr: rowPr, action: "get-ready" }).then(() => toast("Asked the agent to get it ready for review, with Agent merge watching")).catch((e) => toast("Couldn't do that: " + e.message));
  if (a === "readiness-refresh") { toast("Rechecking on GitHub…"); return post("/api/action", { pr: rowPr, action: "readiness-refresh" }).catch((e) => toast("Couldn't do that: " + e.message)); }
  if (a === "monitor") return post("/api/action", { pr: rowPr, action: "monitor", enable: el.dataset.enable === "1" }).then(() => toast(el.dataset.enable === "1" ? "Asked the agent to turn monitoring on" : "Asked the agent to turn monitoring off")).catch((e) => toast("Couldn't do that: " + e.message));
  if (a === "dismiss") return post("/api/action", { pr: rowPr, action: "dismiss" }).then(() => toast("Hidden on the board. The question is still open in the session.")).catch((e) => toast("Couldn't do that: " + e.message));
  if (a === "tab") { tab = el.dataset.tab; store.set("prb-tab", tab); render(true); return $("wsHead").querySelector(`[data-tab="${tab}"]`)?.focus(); }
  if (a === "row-post") { select(rowPr ?? selected, { tabTo: "overview" }); return openMenuAndFocus("post"); }
  if (a === "row-answer") { select(rowPr ?? selected, { tabTo: "thread" }); return $("input").focus(); }
  const pr = rowPr ?? selected;
  const c = cardsOf().find((x) => x.number === pr);
  if (!c) return;
  if (a === "ask-about") { if (c.number !== selected) select(c.number); input.value = `About ${el.dataset.q}: `; input.dispatchEvent(new Event("input")); input.focus(); input.setSelectionRange(input.value.length, input.value.length); return; }
  if (a === "node-close") { archSel = null; return render(true); }
  if (a === "goto-finding") { tab = "review"; store.set("prb-tab", tab); render(true); return document.getElementById("finding-" + el.dataset.id)?.scrollIntoView({ block: "center" }); }
  if (a === "triage") { const d = el.dataset.decision; c.local.triage = { ...(c.local.triage || {}), [el.dataset.id]: { ...(c.local.triage?.[el.dataset.id] || {}), decision: d } }; render(true); return saveTriage(c.number, el.dataset.id, { decision: d }); }
  if (a === "explain") return act(c.number, "explain", { findingId: el.dataset.id });
  if (a === "rv-menu") { openMenu = openMenu === "rpost" ? null : "rpost"; render(true); return document.querySelector('#wsScroll .menu [role="menuitem"]')?.focus(); }
  if (a === "rv-preview") { openMenu = null; return loadPreview(c, el.dataset.event); }
  if (a === "rv-cancel") { rvPreview = null; return render(true); }
  if (a === "rv-post") { const ev = el.dataset.event; rvPreview = null; render(true); return act(c.number, "post-findings", { event: ev }); }
  if (a === "reload-detail") { loadDetail(c, { force: true }); return render(true); }
  if (a === "more-menu") return openMenuAndFocus("more");
  if (a === "pin") { openMenu = null; pins.has(pr) ? pins.delete(pr) : pins.add(pr); store.set(PIN_KEY, JSON.stringify([...pins])); toast(pins.has(pr) ? "Pinned to the top of the list" : "Unpinned"); return render(); }
  if (a === "open-chat-link") { openMenu = null; render(); location.href = "ghapp://sessions/" + encodeURIComponent(c.local.session.id); return; }
  if (a === "nudge") {
    const n = c.reason?.action?.nudge;
    if (!n) return;
    input.value = `Please post this comment on #${c.number}:\n\n${n}`;
    input.dispatchEvent(new Event("input"));
    input.focus();
    return toast("Draft comment is in the message box. Edit it, then press Send.");
  }
  if (a === "post-menu") {
    if (armed?.key?.startsWith(pr + ":post:")) { const ev = armed.key.split(":")[2]; clearTimeout(armed.timer); armed = null; render(); return act(pr, "post", { event: ev }); }
    return openMenuAndFocus("post");
  }
  if (a === "post") { openMenu = null; arm(`${pr}:post:${el.dataset.event}`, el.textContent.trim()); return $("wsHead").querySelector('[data-act="post-menu"]')?.focus(); }
  if (a === "ship") {
    if (armed?.key === `${pr}:ship`) { clearTimeout(armed.timer); armed = null; render(); return act(pr, "ship"); }
    return arm(`${pr}:ship`, "ship");
  }
  openMenu = null;
  return act(pr, a);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && fly) { e.preventDefault(); return closeFlyout(); }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.id === "flyInput") { e.preventDefault(); $("flyComposer").requestSubmit(); return; }
  if (e.key === "Escape") {
    if (openMenu) { const which = openMenu; openMenu = null; render(); return $("wsHead").querySelector(`[data-act="${which}-menu"]`)?.focus(); }
    if (armed) { clearTimeout(armed.timer); armed = null; return render(); }
    if (railOpen && railMq.matches && view === "detail") { setRail(false, { remember: false }); return $("railToggle").focus(); }
  }
  // Overview: arrow keys move between PR titles; Enter opens one.
  const ovt = e.target.closest?.(".ov-title");
  if (ovt && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const all = [...document.querySelectorAll(".ov-title")];
    all[all.indexOf(ovt) + (e.key === "ArrowDown" ? 1 : -1)]?.focus();
    return;
  }
  if (e.target.matches?.(".ov-ask input, .ov-ask-inline input") && e.key === "Enter") { e.preventDefault(); e.target.closest(".ov-ask, .ov-ask-inline").querySelector('[data-act="answer-text"]')?.click(); return; }
  if (e.key === "Escape" && snoozeOpen) { snoozeOpen = null; render(); renderFlyout(); return; }
  if (e.key === "Escape" && view === "detail" && !openMenu && !armed && e.target.id !== "input") { $("toOverview").click(); return; }
  // Rail: arrow keys move between rows and section headers; Enter opens.
  const rr = e.target.closest?.("#list .rrow, #list summary");
  if (rr && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const all = [...document.querySelectorAll("#list summary, #list details[open] .rrow")];
    all[all.indexOf(rr) + (e.key === "ArrowDown" ? 1 : -1)]?.focus();
    return;
  }
  // Tabs: left/right arrows, Home/End.
  const t = e.target.closest?.('[role="tab"]');
  if (t && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const i = tabs.indexOf(t);
    const n = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    tabs[n].click();
    return;
  }
  // Menus: up/down arrows.
  const mi = e.target.closest?.('[role="menuitem"]');
  if (mi && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const items = [...mi.parentElement.querySelectorAll('[role="menuitem"]')];
    items[(items.indexOf(mi) + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  }
});

// Resizable split between the list and the workspace.
$("split").addEventListener("pointerdown", (e) => {
  const split = $("split");
  split.classList.add("drag");
  split.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const w = Math.max(240, Math.min(ev.clientX, window.innerWidth * 0.5));
    document.documentElement.style.setProperty("--list-w", w + "px");
    store.set("prb-rail-w", String(Math.round(w)));
  };
  const up = () => { split.classList.remove("drag"); split.removeEventListener("pointermove", move); split.removeEventListener("pointerup", up); };
  split.addEventListener("pointermove", move);
  split.addEventListener("pointerup", up);
});

document.addEventListener("change", (e) => {
  const fid = e.target.dataset?.finding;
  if (fid && current()) { const cur = current(); cur.local.triage = { ...(cur.local.triage || {}), [fid]: { ...(cur.local.triage?.[fid] || {}), note: e.target.value } }; saveTriage(cur.number, fid, { note: e.target.value }); return; }
  if (e.target.id === "ovSort") { sortBy = e.target.value; store.set("prb-sort", sortBy); render(); }
});


// Narrow panels show one pane at a time.
const narrowMq = window.matchMedia("(max-width: 760px)");
const applyNarrow = () => document.body.classList.toggle("narrow", narrowMq.matches);
narrowMq.addEventListener("change", () => { applyNarrow(); render(); });
applyNarrow();

const input = $("input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const c = current();
  const text = input.value.trim();
  if (!c || !text) return;
  $("send").disabled = true;
  input.value = ""; input.style.height = "auto"; stickBottom = true;
  try {
    await post("/api/message", { pr: c.number, kind: c.kind === "issue" ? "issue" : "pr", text });
    if (tab !== "thread") { tab = "thread"; store.set("prb-tab", tab); render(true); }
  } catch (err) { stickBottom = false; if (!input.value) input.value = text; toast("Couldn't send: " + err.message); }
  $("send").disabled = false;
  input.focus();
  if (tab === "thread") { const sc = $("wsScroll"); sc.scrollTop = sc.scrollHeight; }
});

$("sumAll").innerHTML = `${icon("sparkle", "sm")}<span class="lbl">Summarize all needing me</span>`;
$("sumAll").setAttribute("aria-label", "Summarize all needing me");
$("refresh").innerHTML = `${icon("refresh", "sm")}Refresh`;
$("sync").innerHTML = `${icon("reset", "sm")}Sync`;
$("sync").dataset.act = "sync";
$("toOverview").innerHTML = `${icon("chevLeft", "sm")}Overview`;
new ResizeObserver(([entry]) => document.body.classList.toggle("ovnarrow", entry.contentRect.width < 900)).observe(document.body);
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "flyComposer" || !fly) return;
  e.preventDefault();
  const ta = $("flyInput");
  const text = ta.value.trim();
  if (!text) return;
  // Clear first: the board update that follows a send re-renders the flyout and would restore the old text.
  flyDraft = ""; ta.value = ""; stickBottom = true;
  try {
    await post("/api/message", { pr: fly.number, kind: fly.kind, text });
  } catch (err) {
    stickBottom = false;
    const box = $("flyInput"); if (box && !box.value) { box.value = text; flyDraft = text; }
    toast("Couldn't send: " + err.message);
    return;
  }
  const box = $("flyInput"); box?.focus();
  const body = $("flyHost").querySelector(".fly-body"); if (body) body.scrollTop = body.scrollHeight;
});
$("refresh").addEventListener("click", async () => { try { await post("/api/refresh", {}); } catch (e) { toast("Couldn't refresh: " + e.message); } });
$("sumAll").addEventListener("click", async () => {
  try { const r = await post("/api/summarize-all", {}); toast(r.count ? `Asked the agent to summarize ${r.count} PR${r.count === 1 ? "" : "s"}` : "Every PR that needs you already has a summary"); }
  catch (e) { toast("Couldn't start summaries: " + e.message); }
});

// Ages and snoozes change with time, not just with data.
setInterval(() => { if (document.visibilityState === "visible") render(); }, 60000);

function connect() {
  const es = new EventSource(`/events?repo=${encodeURIComponent(REPO)}`);
  es.addEventListener("board", (ev) => {
    snap = JSON.parse(ev.data);
    streams.clear();
    for (const [k, v] of Object.entries(snap.streams || {})) streams.set(k, v);
    render();
  });
  es.addEventListener("stream", (ev) => {
    const u = JSON.parse(ev.data);
    const key = `${u.kind}:${u.number}`;
    if (u.done) streams.delete(key); else streams.set(key, { text: u.text || "", step: u.step || "" });
    const c = itemOf(u.kind, u.number);
    for (const node of document.querySelectorAll(`[data-stream-key="${key}"]`)) {
      const box = node.closest(".ws-scroll, #wsScroll, .fly-body") || node.parentElement;
      const atBottom = box && box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      node.innerHTML = streamInner(c, streams.get(key));
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
  });
  es.onerror = () => { $("meta").textContent = "Reconnecting…"; };
}
setInterval(() => { if (snap) render(); }, 30000);
if (!REPO) { $("banner").hidden = false; $("banner").textContent = "No repo was given to this board."; }
else connect();
</script>
</body>
</html>
