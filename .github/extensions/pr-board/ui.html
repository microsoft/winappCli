<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PR board</title>
<style>
/* Theme: the app injects these tokens; values after the comma are fallbacks for a plain browser. */
:root {
  --status-bar-color: var(--background-color-default, #ffffff);
  --bg: var(--background-color-default, #ffffff);
  --fg: var(--text-color-default, #1f2328);
  --muted: var(--text-color-muted, #59636e);
  --border: var(--border-color-default, #d1d9e0);
  --focus: var(--color-focus-outline, #0969da);
  --red: var(--true-color-red, #cf222e);
  --red-muted: var(--true-color-red-muted, rgba(207,34,46,.12));
  --green: var(--true-color-green, #1a7f37);
  --green-muted: var(--true-color-green-muted, rgba(26,127,55,.12));
  --blue: var(--true-color-blue, #0969da);
  --blue-muted: var(--true-color-blue-muted, rgba(9,105,218,.12));
  --yellow: var(--true-color-yellow, #9a6700);
  --yellow-muted: var(--true-color-yellow-muted, rgba(154,103,0,.14));
  --purple: var(--true-color-purple, #8250df);
  --purple-muted: var(--true-color-purple-muted, rgba(130,80,223,.12));
  --orange: var(--true-color-orange, #bc4c00);
  --orange-muted: var(--true-color-orange-muted, rgba(188,76,0,.12));
  --subtle: color-mix(in srgb, var(--fg) 4%, var(--bg));
  --hairline: color-mix(in srgb, var(--border) 60%, transparent);
  --selected: color-mix(in srgb, var(--blue) 8%, var(--bg));
  --mono: var(--font-mono, "SFMono-Regular", Consolas, monospace);

  /* Type scale: 4 sizes, 2 weights. */
  --t-meta: 12px;
  --t-small: 13px;
  --t-body: var(--text-body-medium, 14px);
  --t-title: var(--text-title-small, 16px);
  --w-strong: var(--font-weight-semibold, 600);

  /* Spacing scale (4px base). */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;

  --list-w: 520px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--t-body); line-height: var(--leading-body-medium, 20px);
  display: flex; flex-direction: column; overflow: hidden;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.i.sm { width: 14px; height: 14px; vertical-align: -2px; }

/* Buttons: one primary per view; everything else secondary or quiet. */
button, a.btn { font: inherit; font-size: var(--t-small); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; line-height: 20px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover:not(:disabled), a.btn:hover { background: var(--subtle); text-decoration: none; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--blue); color: var(--color-white, #fff); border-color: var(--blue); }
button.primary:hover:not(:disabled) { background: var(--blue); filter: brightness(1.08); }
button.confirm { background: var(--orange); color: var(--color-white, #fff); border-color: var(--orange); }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 6px; }
button.quiet:hover:not(:disabled) { color: var(--fg); }
code { font-family: var(--mono); font-size: var(--t-meta); background: var(--subtle); padding: 0 4px; border-radius: 4px; }

/* Status chip: icon (colored) + label (always --fg for contrast) on a tint. */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px 1px 6px; font-size: var(--t-meta); line-height: 18px; font-weight: var(--w-strong); color: var(--fg); background: var(--subtle); white-space: nowrap; }
.chip .age { font-weight: 400; color: var(--fg); opacity: .8; }
.chip.you { background: var(--orange-muted); } .chip.you .i { color: var(--orange); }
.chip.agent { background: var(--purple-muted); } .chip.agent .i { color: var(--purple); }
.chip.info { background: var(--blue-muted); } .chip.info .i { color: var(--blue); }
.chip.ok { background: var(--green-muted); } .chip.ok .i { color: var(--green); }
.chip.stuck { background: var(--red-muted); } .chip.stuck .i { color: var(--red); }
.chip.neutral .i { color: var(--muted); }
/* "Your move" and "stuck" are the two states that must jump out: solid fills. */
.chip.you.solid { background: var(--orange); color: var(--bg); } .chip.you.solid .i, .chip.you.solid .age { color: var(--bg); opacity: 1; }
.chip.stuck.solid { background: var(--red); color: var(--bg); } .chip.stuck.solid .i, .chip.stuck.solid .age { color: var(--bg); opacity: 1; }
.tone-you { color: var(--orange); } .tone-agent { color: var(--purple); }
.tone-ok { color: var(--green); } .tone-bad { color: var(--red); } .tone-run { color: var(--yellow); } .tone-mute { color: var(--muted); }

/* ---- Header ---- */
header.top { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--border); flex: none; min-width: 0; }
header.top h1 { margin: 0; font-size: var(--t-body); font-weight: var(--w-strong); white-space: nowrap; }
header.top h1 span { color: var(--muted); font-weight: 400; }
.meta { color: var(--muted); font-size: var(--t-meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.banner { margin: var(--s2) var(--s4) 0; padding: var(--s2) var(--s3); border-radius: 6px; background: var(--red-muted); color: var(--fg); flex: none; display: flex; gap: var(--s2); }
.banner .i { color: var(--red); }
.toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; font-size: var(--t-small); opacity: 0; transition: opacity .2s ease-out; pointer-events: none; max-width: 80%; z-index: 20; }
.toast.show { opacity: .95; }
.layout { flex: 1; display: flex; min-height: 0; }

/* ---- Inbox list ---- */
aside { width: var(--list-w); min-width: 340px; max-width: 70%; flex: none; overflow-y: auto; padding-bottom: var(--s4); }
.split { width: 5px; flex: none; cursor: col-resize; border-left: 1px solid var(--border); }
.split:hover, .split.drag { background: var(--blue-muted); }
/* List toolbar: filter chips (counts) + sort. Filtering never reorders rows. */
.listbar { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--border); padding: var(--s2) var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border-radius: 999px; padding: 1px 10px; font-size: var(--t-meta); line-height: 20px; gap: 5px; }
.filters button .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters button[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.filters button[aria-pressed="true"] .i { color: inherit !important; }
.sortrow { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-meta); color: var(--muted); }
.sortrow select { font: inherit; font-size: var(--t-meta); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
.sortrow .count { margin-left: auto; }
#list .empty { color: var(--muted); font-size: var(--t-small); padding: var(--s4); }
.row { position: relative; border-bottom: 1px solid var(--hairline); }
.row:hover { background: var(--subtle); }
.row.sel { background: var(--selected); }
/* Each row: a fixed status column (scan it top to bottom), then the PR. */
.row-main { all: unset; display: grid; grid-template-columns: var(--status-w, 156px) minmax(0, 1fr); column-gap: var(--s3); padding: var(--s3) var(--s2) var(--s3) var(--s4); cursor: pointer; min-width: 0; }
.row-main:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }
.row .st { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; padding-top: 1px; }
.row .st .chip { max-width: 100%; }
.row .st .chip > span:not(.age) { overflow: hidden; text-overflow: ellipsis; }
.row .st .since { font-size: var(--t-meta); color: var(--muted); padding-left: 2px; font-variant-numeric: tabular-nums; }
.row .st .since.stuck { color: var(--fg); font-weight: var(--w-strong); }
.row .body { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.row .t { font-size: var(--t-body); font-weight: var(--w-strong); line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t .i { color: var(--muted); margin-right: 4px; }
.row .line2 { display: flex; align-items: center; gap: var(--s2); min-width: 0; font-size: var(--t-meta); color: var(--muted); }
.row .line2 .facts { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: inline-flex; align-items: center; gap: 6px; }
.row .sum { font-size: var(--t-small); line-height: 18px; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .sum .i { color: var(--purple); margin-right: 2px; }
/* The row action floats over the title line, so hidden actions don't steal width. */
.row .act { position: absolute; top: var(--s3); right: var(--s4); visibility: hidden; }
.row.has-act .t { padding-right: 96px; }
.row.you .act, .row:hover .act, .row.sel .act, .row:focus-within .act { visibility: visible; }
.avatar { width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px; background: var(--subtle); }
.sep { opacity: .6; }

/* ---- Workspace ---- */
.ws { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ws-head { padding: var(--s4) var(--s5) 0; border-bottom: 1px solid var(--border); flex: none; display: flex; flex-direction: column; gap: var(--s2); }
.ws-head h2 { margin: 0; font-size: var(--t-title); line-height: 22px; font-weight: var(--w-strong); }
.ws-head h2 a { color: var(--muted); font-weight: 400; white-space: nowrap; }
.ws-meta { display: flex; gap: var(--s2) var(--s3); flex-wrap: wrap; align-items: center; font-size: var(--t-meta); color: var(--muted); }
.ws-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.next { display: flex; align-items: flex-start; gap: var(--s2); font-size: var(--t-small); padding: 6px 10px; border-radius: 6px; background: var(--subtle); }
.next.you { background: var(--orange-muted); } .next.you .i { color: var(--orange); }
.next.agent { background: var(--purple-muted); } .next.agent .i { color: var(--purple); }
.next b { font-weight: var(--w-strong); }
.actions { display: flex; gap: var(--s2); flex-wrap: wrap; position: relative; align-items: center; margin-top: var(--s1); }
.menu { position: absolute; top: 32px; z-index: 5; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; padding: var(--s1); min-width: 220px; }
.menu button { border: 0; justify-content: flex-start; padding: 6px 10px; }
.menu button:focus-visible { outline-offset: -2px; }
.back { display: none; }
.tabs { display: flex; gap: var(--s1); margin-top: var(--s2); overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px 8px; color: var(--muted); background: none; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue); font-weight: var(--w-strong); }
.tabs .n { font-size: var(--t-meta); color: var(--muted); font-weight: 400; }

.scroll { flex: 1; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
.sec > h3 { margin: 0 0 var(--s2); font-size: var(--t-small); font-weight: var(--w-strong); display: flex; gap: var(--s2); align-items: baseline; }
.sec > h3 .note { font-weight: 400; color: var(--muted); font-size: var(--t-meta); }
.summary { font-size: 15px; line-height: 22px; max-width: 72ch; }
.summary .i { color: var(--purple); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--s1); max-width: 72ch; }
.steps b { font-weight: var(--w-strong); }
.callout { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s3); border-radius: 8px; background: var(--red-muted); max-width: 80ch; }
.callout .i { color: var(--red); margin-top: 2px; }
.callout .body { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-start; }
.grid { display: grid; grid-template-columns: minmax(84px, max-content) 1fr; gap: var(--s2) var(--s4); font-size: var(--t-small); margin: 0; max-width: 80ch; }
.grid dt { color: var(--muted); }
.grid dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.grid dd .sub { flex-basis: 100%; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 0 8px; font-size: var(--t-meta); line-height: 20px; border: 1px solid var(--hairline); color: var(--fg); white-space: nowrap; }
details.panel { border-top: 1px solid var(--hairline); padding-top: var(--s3); }
details.panel > summary { cursor: pointer; font-size: var(--t-small); font-weight: var(--w-strong); list-style: none; display: flex; gap: var(--s2); align-items: center; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary .chev { transition: transform .15s ease-out; color: var(--muted); }
details.panel[open] > summary .chev { transform: rotate(90deg); }
details.panel > summary .note { font-weight: 400; color: var(--muted); font-size: var(--t-meta); }
details.panel > .body { padding-top: var(--s3); }
.hint { color: var(--muted); font-size: var(--t-meta); }

.md { overflow-wrap: anywhere; font-size: var(--t-body); line-height: 22px; max-width: 72ch; }
.md p { margin: 0 0 var(--s3); } .md > :last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 var(--s3); padding-left: 22px; }
.md pre { background: var(--subtle); border-radius: 6px; padding: var(--s2) var(--s3); overflow-x: auto; margin: 0 0 var(--s3); font-family: var(--mono); font-size: var(--t-meta); line-height: 18px; white-space: pre-wrap; }
.md pre code { background: none; padding: 0; }
.md .h { font-weight: var(--w-strong); margin: var(--s4) 0 var(--s1); }
.md .h1 { font-size: var(--t-title); }
.md table { border-collapse: collapse; margin: 0 0 var(--s3); font-size: var(--t-small); }
.md th, .md td { border: 1px solid var(--hairline); padding: 4px 8px; text-align: left; }
.md blockquote { margin: 0 0 var(--s3); padding: var(--s2) var(--s3); background: var(--subtle); border-radius: 6px; color: var(--muted); }

.conv { display: flex; flex-direction: column; gap: var(--s3); max-width: 90ch; }
.conv details { border: 1px solid var(--hairline); border-radius: 8px; }
.conv summary { padding: var(--s2) var(--s3); cursor: pointer; font-size: var(--t-small); display: flex; gap: var(--s2); align-items: center; list-style: none; min-width: 0; }
.conv summary::-webkit-details-marker { display: none; }
.conv summary .first { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.conv summary .when { color: var(--muted); font-size: var(--t-meta); margin-left: auto; white-space: nowrap; }
.conv .body { padding: 0 var(--s3) var(--s3); }
.files { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.files td { padding: 6px; border-bottom: 1px solid var(--hairline); }
.files td.path { font-family: var(--mono); font-size: var(--t-meta); word-break: break-all; }
.files .add { color: var(--green); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; } .files .del { color: var(--red); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { display: inline-flex; width: 60px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--subtle); vertical-align: middle; }
.bar i { display: block; height: 100%; } .bar .a { background: var(--green); } .bar .d { background: var(--red); }
.timeline { margin: 0; padding: 0; list-style: none; font-size: var(--t-small); display: flex; flex-direction: column; gap: var(--s2); }
.timeline time { color: var(--muted); font-size: var(--t-meta); margin-right: var(--s2); font-variant-numeric: tabular-nums; }

.thread { display: flex; flex-direction: column; gap: var(--s3); }
.msg { max-width: min(82%, 72ch); padding: var(--s2) var(--s3); border-radius: 12px; font-size: var(--t-small); }
.msg .md { font-size: var(--t-small); line-height: 20px; }
.msg.user { align-self: flex-end; background: var(--blue-muted); border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: var(--subtle); border: 1px solid var(--hairline); border-bottom-left-radius: 4px; }
.msg .who { font-size: var(--t-meta); color: var(--muted); margin-bottom: 2px; }
.sys { align-self: center; font-size: var(--t-meta); color: var(--muted); text-align: center; }
.thinking span { animation: blink 1.4s infinite both; }
.thinking span:nth-child(2) { animation-delay: .2s; } .thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .thinking span { animation: none; opacity: .6; } .toast, details.panel > summary .chev { transition: none; } }
.composer { flex: none; border-top: 1px solid var(--border); padding: var(--s3) var(--s5); display: flex; gap: var(--s2); align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 36px; max-height: 160px; font: inherit; font-size: var(--t-small); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: var(--s2) var(--s3); }
.composer textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.empty-ws { margin: auto; color: var(--muted); text-align: center; }

/* ---- Narrow panel: one pane at a time ---- */
body.narrow aside { width: 100%; max-width: none; min-width: 0; }
body.narrow .split { display: none; }
body.narrow:not(.detail) .ws { display: none; }
body.narrow.detail aside { display: none; }
body.narrow .back { display: inline-flex; align-self: flex-start; }
body.narrow .ws-head { padding: var(--s3) var(--s4) 0; }
body.narrow .scroll { padding: var(--s4); }
body.narrow .composer { padding: var(--s3) var(--s4); }
body.narrow .grid { grid-template-columns: 1fr; gap: 2px; }
body.narrow .grid dd { margin-bottom: var(--s2); }
body.narrow #sumAll .lbl { display: none; }
/* A narrow list puts the status above the title instead of in its own column. */
aside.tight .row-main { grid-template-columns: minmax(0, 1fr); row-gap: var(--s1); }
aside.tight .row .st { flex-direction: row; align-items: center; gap: var(--s2); }
</style>
</head>
<body>
<header class="top">
  <h1>Pull requests <span id="repo"></span></h1>
  <span class="meta" id="meta">Loading…</span>
  <button id="sumAll" title="Ask the agent for plain-words summaries of the PRs that need you or an agent"></button>
  <button id="refresh" title="Re-read pull requests from GitHub"></button>
</header>
<div id="banner" class="banner" hidden></div>
<div class="layout">
  <aside id="list" aria-label="Pull requests"></aside>
  <div class="split" id="split" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
  <section class="ws" aria-label="Pull request workspace">
    <div class="ws-head" id="wsHead" hidden></div>
    <div class="scroll" id="wsScroll" role="tabpanel" aria-labelledby=""><div class="empty-ws">Pick a pull request on the left.</div></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask a question or give direction…" aria-label="Message about this pull request" disabled></textarea>
      <button class="primary" id="send" type="submit" disabled>Send</button>
    </form>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const params = new URLSearchParams(location.search);
const REPO = params.get("repo");
const TOKEN = params.get("t");
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const SEL_KEY = "prb-sel:" + REPO;
let snap = null;
let selected = Number(store.get(SEL_KEY)) || null;
let tab = store.get("prb-tab") || "overview";
let filter = store.get("prb-filter") || "all";
let sortBy = store.get("prb-sort") || "newest";
const PIN_KEY = "prb-pins:" + REPO;
let pins = new Set(JSON.parse(store.get(PIN_KEY) || "[]"));
let openMenu = null; // "post" | "more" | null
let armed = null;
let lastKey = "";
const drafts = new Map();
const details = new Map(); // pr -> { data } | { error } | { loading }

const listW = Number(store.get("prb-list-w"));
if (listW) document.documentElement.style.setProperty("--list-w", listW + "px");

// ---- Icons: one 16px stroke set, used everywhere ----
const ICONS = {
  eye: '<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>',
  check: '<path d="M3 8.5l3 3 7-7"/>',
  checkCircle: '<circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.7-3.8"/>',

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (iso) => {
  if (!iso) return "";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
};
const when = (iso) => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

  if (h < 1) return Math.max(1, Math.round(h * 60)) + " min";
  if (h < 48) { const n = Math.round(h); return n + (n === 1 ? " hour" : " hours"); }
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day" : " days");

// Safe Markdown: everything is escaped first; only code, bold, italics, http(s)
// links, lists, headings, quotes and pipe tables become markup.
function md(src) {
  const blocks = [];
  const text = String(src ?? "").replace(/\r\n/g, "\n").replace(/```[^\n]*\n([\s\S]*?)(```|$)/g, (_, code) => {
    blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `\n\u0000${blocks.length - 1}\u0000\n`;
  });
  const inline = (s) => {
    const codes = [];
    s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(`<code>${c}</code>`); return `\u0001${codes.length - 1}\u0001`; });
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">Image: ${t || "open"}</a>`)
         .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
         .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
         .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
         .replace(/(^|[\s(])_([^_\s][^_]*)_/g, "$1<em>$2</em>");
    return s.replace(/\u0001(\d+)\u0001/g, (_, i) => codes[i]);
  };
  const out = [];
  let list = null, para = [], table = null, quote = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const flushQuote = () => { if (quote.length) { out.push(`<blockquote>${quote.map(inline).join("<br>")}</blockquote>`); quote = []; } };
  const flushTable = () => {
    if (!table) return;
    const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim())));
    out.push(`<table>${rows.map((r, i) => `<tr>${r.map((c) => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`);
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); flushTable(); };
  for (const line of text.split("\n")) {
    const block = line.match(/^\u0000(\d+)\u0000$/);
    const ul = line.match(/^\s*[-*+]\s+(?:\[[ xX]\]\s+)?(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (block) { flushAll(); out.push(blocks[block[1]]); }
    else if (/^\s*\|/.test(line)) { flushPara(); flushList(); flushQuote(); (table ??= []).push(line); }
    else if (/^\s*>/.test(line)) { flushPara(); flushList(); flushTable(); quote.push(line.replace(/^\s*>\s?/, "")); }
    else if (ul || ol) {
      flushPara(); flushQuote(); flushTable();
      const tag = ul ? "ul" : "ol";
      if (list && list.tag !== tag) flushList();
      list ??= { tag, items: [] };
      list.items.push((ul || ol)[1]);
    } else if (h) { flushAll(); out.push(`<div class="h h${Math.min(h[1].length, 3)}">${inline(h[2])}</div>`); }
    else if (!line.trim()) flushAll();
    else { flushList(); flushQuote(); flushTable(); para.push(line); }
  }
  flushAll();
  return out.join("");
}
const mdInline = (s) => md(s).replace(/^<p>|<\/p>$/g, "");
// PR descriptions: drop template comments and raw HTML tags before rendering.
const cleanBody = (s) => String(s || "").replace(/<!--[\s\S]*?-->/g, "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/?(details|summary|sub|sup|p|div|span|b|i|em|strong|kbd|img|a)\b[^>]*>/gi, "").replace(/\n{3,}/g, "\n\n").trim();

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 5000);
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-PR-Board-Token": TOKEN }, body: JSON.stringify({ repo: REPO, ...body }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

const DONE_TOAST = { review: "Asked the agent for a review", post: "Asked the agent to post the draft", ship: "Asked the agent to ship it", summarize: "Asked the agent for a summary", "arch-review": "Asked the agent to open the architecture review", "open-chat": "Asked the agent to open the chat", reset: "Agent status reset" };
async function act(pr, action, extra = {}) {
  try { await post("/api/action", { pr, action, ...extra }); toast(DONE_TOAST[action] || "Done"); }
  catch (e) { toast("Couldn't do that: " + e.message); }
}

// ---- Status vocabulary ----
const CI = { passing: ["checkCircle", "tone-ok", "CI passing"], failing: ["xCircle", "tone-bad", "CI failing"], pending: ["running", "tone-run", "CI running"], none: ["dash", "tone-mute", "No CI"] };
const REVIEW = { APPROVED: ["checkCircle", "tone-ok", "approved"], CHANGES_REQUESTED: ["xCircle", "tone-bad", "requested changes"], COMMENTED: ["comment", "tone-mute", "commented"], DISMISSED: ["dash", "tone-mute", "dismissed"] };
const AGENT = { running: "Agent working", waiting: "Needs your input", waiting_on_others: "Waiting on others", draft_ready: "Draft ready", done: "Done", failed: "Failed" };
const RISK = { low: ["checkCircle", "tone-ok", "Low risk"], medium: ["alert", "tone-run", "Medium risk"], high: ["alert", "tone-bad", "High risk"] };
// Short chip labels for the waiting reasons computed on the server.
const SHORT = {
  "Waiting on your review": ["eye", "Your review"],
  "Author responded, needs re-review": ["eye", "Your re-review"],
  "Changes requested, no response": ["xCircle", "Author: changes requested"],
  "Draft, author still working": ["pencil", "Draft"],
  "Author still preparing it": ["running", "Author: preparing"],
  "Your agent is preparing it": ["sparkle", "Your agent: preparing"],
  "Author's agent is blocked": ["alert", "Author: blocked"],
  "Merge conflicts": ["alert", "Author: conflicts"],
  "Approval doesn't count": ["person", "Needs approver"],
  "Waiting on a reviewer": ["person", "Needs reviewer"],
  "Waiting on other reviewers": ["person", "Needs reviewer"],
  "Approved, blocked": ["alert", "Approved · blocked"],
  "Approved, waiting on CI": ["running", "Approved · CI"],
  "Auto-merge on": ["queue", "Approved · auto-merge"],
  "Ready to ship": ["checkCircle", "Ready to ship"],
  "In merge queue": ["queue", "In queue"],
  "Agent waiting on others": ["clock", "Waiting on others"],
};
const TONE = { you: "you", agent: "agent", ci: "info", github: "info", done: "ok" };

// One status per PR: tone (whose turn), icon, short label, since, and stuck text.
function statusOf(c) {
  const local = c.local || {};
  const agent = local.agent;
  if (c.group === "merged") return { tone: "ok", icon: "merged", label: "Merged", since: c.mergedAt };
  if (agent?.status === "running") return { tone: "agent", icon: "sparkle", label: agent.kind === "ship" ? "Shipping" : agent.kind === "post" ? "Posting review" : "Agent working", since: agent.updatedAt };
  if (draftOf(c)) return { tone: "you", icon: "pencil", label: "Draft review ready", since: local.draft.attachedAt };
  if (agent?.status === "waiting") return { tone: "you", icon: "comment", label: "Agent needs you", since: agent.updatedAt };
  const r = c.reason;
  const [ic, label] = (r && SHORT[r.label]) || ["clock", r?.label || "Waiting"];
  const s = { tone: c.reason?.label === "Ready to ship" ? "you" : (TONE[c.who] || "neutral"), icon: ic, label: r?.label === "In merge queue" && c.queue ? `In queue #${c.queue.position}` : label, since: r?.since };
  if (r?.stuck) { s.tone = "stuck"; s.icon = "alert"; s.stuck = r.stuck; }
  return s;
}
// "Your move" and "stuck" get solid chips so they stand out in a long list.
function chip(c, { withAge = true } = {}) {
  const s = statusOf(c);
  const solid = s.tone === "you" || s.tone === "stuck" ? " solid" : "";
  const age = withAge && s.since ? ago(s.since) : "";
  return `<span class="chip ${s.tone}${solid}" title="${esc(s.stuck || c.reason?.text || c.waitingOn || "")}">${icon(s.icon, "sm")}<span>${esc(s.label)}</span>${age && age !== "just now" ? `<span class="age">· ${esc(age)}</span>` : ""}</span>`;
}
function sinceLine(c) {
  const s = statusOf(c);
  if (!s.since) return "";
  if (s.stuck) return `<span class="since stuck">Stuck · ${esc(dur(s.since))}</span>`;
  return `<span class="since">for ${esc(dur(s.since))}</span>`;
}

const cardsOf = () => snap?.cards || [];
const current = () => cardsOf().find((c) => c.number === selected) || null;
const isBusy = (c) => c.local?.agent?.status === "running";
const draftOf = (c) => (c.local?.draft && !c.local.draft.postedAt) ? c.local.draft : null;
const canShip = (c) => c.group !== "merged" && !c.queue && c.reviewDecision === "APPROVED" && c.ci?.state !== "failing" && !isBusy(c);

function nextHtml(text) {
  const i = text.indexOf(":");
  return i > 0 ? `<b>${esc(text.slice(0, i))}</b>${esc(text.slice(i))}` : esc(text);
}
function ciHtml(c) {
  const [ic, tone, label] = CI[c.ci?.state] || CI.none;
  const tip = c.ci?.failing?.length ? "Failing: " + c.ci.failing.join(", ") : c.ci?.pending?.length ? "Running: " + c.ci.pending.join(", ") : label;
  return `<span title="${esc(tip)}">${icon(ic, "sm " + tone)} ${esc(label)}</span>`;
}
function reviewsInline(c) {
  const rs = c.reviewers || [];
  const pick = rs.filter((r) => r.state === "APPROVED" || r.state === "CHANGES_REQUESTED");
  const show = pick.length ? pick : rs.filter((r) => r.state === "COMMENTED");
  if (!show.length) return c.requested?.length ? `<span>${icon("person", "sm tone-mute")} ${esc(c.requested.join(", "))}</span>` : "";
  return show.map((r) => { const [ic, tone, w] = REVIEW[r.state] || REVIEW.COMMENTED; return `<span title="${esc(r.login + " " + w)}">${icon(ic, "sm " + tone)} ${esc(r.login)}</span>`; }).join("");
}

// The one action that fits the PR's stage. Only "your move" actions are primary.
function primaryAction(c) {
  const local = c.local || {};
  if (c.group === "merged" || isBusy(c)) return null;
  if (draftOf(c)) return { act: "row-post", label: "Post review", primary: true };
  if (local.agent?.status === "waiting") return { act: "row-answer", label: "Answer", primary: true };
  if (c.shippable && canShip(c)) return armed?.key === c.number + ":ship" ? { act: "ship", label: "Click again to ship", confirm: true } : { act: "ship", label: "Ship", primary: true };
  if (c.group === "you" && !c.isDraft) return { act: "review", label: c.reason?.label === "Author responded, needs re-review" ? "Re-review" : "Review", primary: true };
  if (!local.summary && !local.summarizing) return { act: "summarize", label: "Summarize" };
  return null;
}

// ---- Left: inbox ----
function rowHtml(c) {
  const local = c.local || {};
  const pa = primaryAction(c);
  const agentLine = local.agent && ["running", "waiting", "waiting_on_others", "failed"].includes(local.agent.status) && local.agent.outcome;
  const sum = agentLine ? `${icon("sparkle", "sm")}${esc(local.agent.outcome)}`
    : local.summary ? `${icon("sparkle", "sm")}${mdInline(local.summary.text)}`
    : local.summarizing ? `${icon("sparkle", "sm")}Summarizing…`

  const risk = local.summary?.risk && local.summary.risk !== "low" ? (() => { const [ic, tone, l] = RISK[local.summary.risk]; return `<span class="sep">·</span><span>${icon(ic, "sm " + tone)} ${l}</span>`; })() : "";
  const facts = [
    `<span>#${c.number}</span>`,
    `<span><img class="avatar" alt="" src="https://github.com/${encodeURIComponent(c.author)}.png?size=32" onerror="this.remove()"> ${esc(c.author)}</span>`,
    `<span title="${esc(c.size?.text)}">${esc(c.size?.label)}</span>`,
    c.group === "merged" ? "" : ciHtml(c),

  return `<div class="row${c.number === selected ? " sel" : ""}${isYou ? " you" : ""}${pa ? " has-act" : ""}" role="listitem">

  </div>`;
}

// Filters narrow the list; they never change its order.
const FILTERS = [
  ["all", "All open", (c) => c.group !== "merged"],
  ["you", "Needs you", (c) => c.group === "you"],
  ["stuck", "Stuck", (c) => c.group !== "merged" && !!c.reason?.stuck],
  ["others", "Waiting on others", (c) => c.group === "others" || c.group === "queue"],
  ["agent", "Agent working", (c) => c.group === "agent"],
  ["mine", "Mine", (c) => c.group !== "merged" && c.author === snap?.viewer],
  ["drafts", "Drafts", (c) => c.group !== "merged" && c.isDraft],
  ["merged", "Merged today", (c) => c.group === "merged"],
];
const FILTER_ICON = { you: ["person", "tone-you"], stuck: ["alert", "tone-bad"], agent: ["sparkle", "tone-agent"], merged: ["merged", "tone-ok"] };
const SORTS = {
  newest: ["Newest", (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) || b.number - a.number],
  oldest: ["Oldest", (a, b) => String(a.createdAt).localeCompare(String(b.createdAt)) || a.number - b.number],
  updated: ["Recently updated", (a, b) => String(b.updatedAt || b.mergedAt).localeCompare(String(a.updatedAt || a.mergedAt))],
  number: ["Number", (a, b) => b.number - a.number],
};

function visibleCards() {
  const pass = (FILTERS.find((f) => f[0] === filter) || FILTERS[0])[2];
  const sort = (SORTS[sortBy] || SORTS.newest)[1];
  const rows = cardsOf().filter(pass).sort(sort);
  // Pinned PRs stay on top, in the same sort order among themselves.
  return [...rows.filter((c) => pins.has(c.number)), ...rows.filter((c) => !pins.has(c.number))];
}

function renderList() {
  const list = $("list");
  const scroll = list.scrollTop;
  const focused = document.activeElement?.closest?.("#list [data-pr], #list [data-filter], #list select");
  const focusKey = focused ? (focused.dataset.filter ? "f:" + focused.dataset.filter : focused.tagName === "SELECT" ? "sort" : focused.dataset.pr + ":" + focused.dataset.act) : null;
  const cards = cardsOf();
  const rows = visibleCards();
  const chips = FILTERS.map(([id, label, pass]) => {
    const n = cards.filter(pass).length;
    if (!n && id !== "all" && id !== filter) return "";
    const [ic, tone] = FILTER_ICON[id] || [];
    return `<button data-act="filter" data-filter="${id}" aria-pressed="${filter === id}">${ic ? icon(ic, "sm " + tone) : ""}${esc(label)} <span class="n">${n}</span></button>`;
  }).join("");
  const label = (FILTERS.find((f) => f[0] === filter) || FILTERS[0])[1];
  list.innerHTML = `<div class="listbar">
      <div class="filters" role="group" aria-label="Filter pull requests">${chips}</div>
      <div class="sortrow"><label for="sortSel">Sort</label><select id="sortSel" aria-label="Sort pull requests">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${k === sortBy ? "selected" : ""}>${l}</option>`).join("")}</select><span class="count">${rows.length} shown</span></div>
    </div>
    <div role="list" aria-label="${esc(label)}">${rows.map(rowHtml).join("") || `<div class="empty">${filter === "stuck" ? "Nothing is stuck." : "No pull requests match."}</div>`}</div>`;
  list.scrollTop = scroll;
  if (focusKey) {
    if (focusKey === "sort") $("sortSel")?.focus();
    else if (focusKey.startsWith("f:")) list.querySelector(`[data-filter="${focusKey.slice(2)}"]`)?.focus();
    else { const [pr, a] = focusKey.split(":"); list.querySelector(`[data-pr="${pr}"][data-act="${a}"]`)?.focus(); }
  }
}

  const s = statusOf(c);
  const counts = { conversation: det ? det.conversation.length : "", files: det ? det.files.length : c.size?.text?.match(/(\d+) files/)?.[1] || "", thread: (local.thread || []).filter((m) => m.role !== "system").length || "" };
  const TABS = [["overview", "Overview"], ["conversation", "Conversation"], ["files", "Files"], ["thread", "Thread"], ["timeline", "Timeline"]];

  const buttons = [];
  if (isOpen) {
    if (draft) buttons.push(`<button data-act="post-menu" class="${postArmed ? "confirm" : "primary"}" ${busy ? "disabled" : ""} aria-haspopup="menu" aria-expanded="${openMenu === "post"}">${postArmed ? "Click again: " + esc(armed.label) : "Post review"}${postArmed ? "" : icon("chevDown", "sm")}</button>`);
    if (pa?.act === "row-answer") buttons.push(`<button class="primary" data-act="row-answer">Answer the agent</button>`);
    if (c.shippable || shipArmed) buttons.push(`<button data-act="ship" class="${shipArmed ? "confirm" : "primary"}" ${canShip(c) ? "" : "disabled"}>${shipArmed ? "Click again to ship" : "Ship"}</button>`);
    const reviewPrimary = pa?.act === "review";
    buttons.push(`<button data-act="review" class="${reviewPrimary ? "primary" : ""}" ${busy ? "disabled" : ""} title="Ask an agent to draft a review with the pr-review skill. Nothing is posted.">${local.draft ? "Re-review" : pa?.label === "Re-review" ? "Re-review" : "Review"}</button>`);
  }
  buttons.push(`<button data-act="summarize" ${local.summarizing ? "disabled" : ""} title="Ask the agent for a plain-words summary and next steps">${icon("sparkle", "sm")}${local.summarizing ? "Summarizing…" : "Summarize"}</button>`);
  buttons.push(`<button data-act="more-menu" class="quiet" aria-haspopup="menu" aria-expanded="${openMenu === "more"}" aria-label="More actions">${icon("more")}More</button>`);

  const nextTone = c.who === "you" ? "you" : c.who === "agent" ? "agent" : "";
  const risk = local.summary?.risk ? (() => { const [ic, tone, l] = RISK[local.summary.risk]; return `<span>${icon(ic, "sm " + tone)} ${l}</span>`; })() : "";
  $("wsHead").innerHTML = `
    <button class="back quiet" data-act="back">${icon("chevLeft", "sm")}All pull requests</button>
    <h2>${esc(c.title)} <a href="${esc(c.url)}" target="_blank" rel="noopener" title="Open on GitHub">#${c.number}</a></h2>
    <div class="ws-meta">
      <span><img class="avatar" alt="" src="https://github.com/${encodeURIComponent(c.author)}.png?size=32" onerror="this.remove()"> ${esc(c.author)}</span>
      <span title="${esc(c.size?.text)}">${esc(c.size?.label)} · ${esc(c.size?.text)}</span>
      ${isOpen ? ciHtml(c) : `<span>${icon("merged", "sm tone-ok")} Merged ${esc(ago(c.mergedAt))} ago</span>`}
      ${c.isDraft ? `<span>${icon("pencil", "sm tone-mute")} Draft PR</span>` : ""}
      ${risk}
      ${chip(c)}
    </div>
    ${isOpen ? `<div class="next ${nextTone}">${icon(s.tone === "stuck" ? "alert" : nextTone === "you" ? "person" : nextTone === "agent" ? "sparkle" : "clock", "sm")}<span>${nextHtml(c.waitingOn)}</span></div>` : ""}
    <div class="actions">${buttons.join("")}
      ${openMenu === "post" ? `<div class="menu" role="menu" aria-label="Post review as">
        <button data-act="post" data-event="approve" role="menuitem">${icon("checkCircle", "tone-ok")}Approve</button>
        <button data-act="post" data-event="request_changes" role="menuitem">${icon("xCircle", "tone-bad")}Request changes</button>
        <button data-act="post" data-event="comment" role="menuitem">${icon("comment")}Comment</button>
      </div>` : ""}
      ${openMenu === "more" ? moreMenu(c) : ""}
    </div>
    <div class="tabs" role="tablist" aria-label="Pull request views">${TABS.map(([id, label]) => `<button role="tab" id="tab-${id}" aria-controls="wsScroll" aria-selected="${tab === id}" tabindex="${tab === id ? 0 : -1}" data-act="tab" data-tab="${id}">${label}${counts[id] !== undefined && counts[id] !== "" ? ` <span class="n">${counts[id]}</span>` : ""}</button>`).join("")}</div>`;
  $("wsScroll").setAttribute("aria-labelledby", "tab-" + tab);
}

function actionButton(c) {
  const a = c.reason?.action;
  if (!a) return "";
  if (a.url) return `<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label)} ${icon("external", "sm")}</a>`;
  if (a.act) return `<button data-act="${esc(a.act)}">${esc(a.label)}</button>`;
  return `<button data-act="nudge" title="Puts a draft comment in the message box. Edit it, then press Send to ask the agent to post it.">${esc(a.label)}…</button>`;
}

function overviewHtml(c) {
  const local = c.local || {};
  const s = local.summary;
  const isOpen = c.group !== "merged";
  const steps = s?.nextSteps?.length ? s.nextSteps : [c.waitingOn];
  const agent = local.agent;
  const r = c.reason;
  const failing = c.ci?.failing?.length ? `<span class="sub">Failing: ${esc(c.ci.failing.join(", "))}</span>` : "";
  const reviews = (c.reviewers || []).map((rv) => { const [ic, tone, w] = REVIEW[rv.state] || REVIEW.COMMENTED; return `<span>${icon(ic, "sm " + tone)} ${esc(rv.login)} ${w}</span>`; }).join("")
    + (c.requested?.length ? `<span>${icon("person", "sm tone-mute")} Requested: ${esc(c.requested.join(", "))}</span>` : "") || "No reviews yet";
  const draft = local.draft;
  const d = draft ? drafts.get(draftKey(c)) : null;
  const stuck = isOpen && r?.stuck;
  return `
    ${stuck ? `<div class="callout" role="note">${icon("alert")}<div class="body"><div>${esc(r.stuck.replace(/^⚠️\s*/, ""))}. ${esc(r.text)}</div>${actionButton(c)}${r.action?.nudge ? `<span class="hint">Pre-fills a draft comment below. Nothing is posted until you send it.</span>` : ""}</div></div>` : ""}
    <section class="sec"><h3>What this PR does <span class="note">${s ? `${icon("sparkle", "sm")} Agent summary · ${esc(ago(s.at))}${ago(s.at) === "just now" ? "" : " ago"}` : "From the description"}</span></h3>
      <div class="summary">${s ? mdInline(s.text) : esc(local.summarizing ? "Summarizing…" : (c.fallbackSummary || "No description."))}</div>
      ${s || local.summarizing ? "" : `<div style="margin-top:var(--s3)"><button data-act="summarize">${icon("sparkle", "sm")}Get a plain-words summary and next steps</button></div>`}
    </section>
    ${isOpen ? `<section class="sec"><h3>Next steps</h3><ol class="steps">${steps.map((t) => `<li>${nextHtml(t)}</li>`).join("")}</ol></section>` : ""}
    <section class="sec"><h3>Status</h3><dl class="grid">
      ${r && isOpen ? `<dt>Why</dt><dd><b>${esc(r.label)}</b>${r.since ? `<span class="tone-mute">for ${esc(dur(r.since))} · since ${esc(when(r.since))}</span>` : ""}<span class="sub">${esc(r.text)}</span></dd>` : ""}
      ${r?.action && isOpen && !stuck && !(r.action.act && r.action.act === primaryAction(c)?.act) ? `<dt>Suggested</dt><dd>${actionButton(c)}${r.action.nudge ? `<span class="sub">Pre-fills a draft comment below. Nothing is posted until you send it.</span>` : ""}</dd>` : ""}
      ${isOpen ? `<dt>Checks</dt><dd>${ciHtml(c)}${failing}</dd>` : `<dt>Merged</dt><dd>${esc(when(c.mergedAt))}</dd>`}
      <dt>Reviews</dt><dd>${reviews}</dd>
      ${c.queue ? `<dt>Merge queue</dt><dd>Position ${c.queue.position}</dd>` : ""}
      ${agent ? `<dt>Agent</dt><dd>${icon("sparkle", "sm")} <b>${esc(AGENT[agent.status] || agent.status)}</b><span class="sub">${esc(agent.outcome || "")}</span></dd>` : ""}
      ${local.session ? `<dt>Session</dt><dd>${icon("comment", "sm tone-mute")} ${esc(local.session.name || local.session.id)}</dd>` : ""}
    </dl></section>
    ${draft ? `<details class="panel" data-k="draft" open><summary>${icon("chevRight", "sm chev")}Draft review <span class="note">recommends ${esc((draft.recommendation || "").replace("_", " "))}${draft.postedAt ? " · posted" : ""}</span></summary>
      <div class="body">${d ? (d.error ? `<div class="hint">${esc(d.error)}</div>` : `<div class="md">${md(d.text)}</div>`) : `<div class="hint">Loading…</div>`}</div></details>` : ""}
    <details class="panel" data-k="desc" open><summary>${icon("chevRight", "sm chev")}Description</summary><div class="body md">${md(cleanBody(c.description)) || `<span class="hint">No description.</span>`}</div></details>
    <details class="panel" data-k="more"><summary>${icon("chevRight", "sm chev")}Details <span class="note">size, opened, labels</span></summary><div class="body"><dl class="grid">
      <dt>Size</dt><dd>${esc(c.size?.label)} · ${esc(c.size?.text)}</dd>
      <dt>Opened</dt><dd>${esc(when(c.createdAt))} by ${esc(c.author)}</dd>
      ${c.labels?.length ? `<dt>Labels</dt><dd>${c.labels.map((l) => `<span class="pill">${esc(l)}</span>`).join("")}</dd>` : ""}
    </dl></div></details>`;
}

function conversationHtml(c) {
  const det = details.get(c.number);
  if (!det || det.loading) return `<div class="hint">Loading the GitHub conversation…</div>`;
  if (det.error) return `<div class="hint">Couldn't load the conversation: ${esc(det.error)} <button data-act="reload-detail">Try again</button></div>`;
  const items = det.data.conversation;
  if (!items.length) return `<div class="hint">No comments or reviews on GitHub yet.</div>`;
  return `<div class="conv">${items.map((m) => {
    const [ic, tone, w] = m.kind === "review" ? (REVIEW[m.state] || ["comment", "tone-mute", m.state.toLowerCase()]) : ["comment", "tone-mute", "commented"];
    const first = cleanBody(m.body).split("\n").find((l) => l.trim()) || "";
    return `<details ${m.bot ? "" : "open"}><summary>${icon(ic, "sm " + tone)}<b>${esc(m.author)}</b><span class="tone-mute">${esc(w)}${m.bot ? " · bot" : ""}</span>${m.bot ? `<span class="first">${esc(first.replace(/[#*`>]/g, "").slice(0, 90))}</span>` : ""}<span class="when">${esc(when(m.at))}</span></summary>
      <div class="body md">${m.body ? md(cleanBody(m.body)) : `<span class="hint">No comment.</span>`}</div></details>`;
  }).join("")}</div>`;
}

function filesHtml(c) {
  const det = details.get(c.number);
  if (!det || det.loading) return `<div class="hint">Loading files…</div>`;
  if (det.error) return `<div class="hint">Couldn't load files: ${esc(det.error)}</div>`;
  const files = det.data.files;
  const max = Math.max(1, ...files.map((f) => f.additions + f.deletions));
  return `<div class="hint">${files.length} files · ${esc(c.size?.text?.split(",")[0] || "")} · largest first</div>
    <table class="files">${files.map((f) => `<tr><td class="path">${esc(f.path)}</td><td class="add">+${f.additions}</td><td class="del">−${f.deletions}</td>
      <td><span class="bar" aria-hidden="true"><i class="a" style="width:${(f.additions / max) * 60}px"></i><i class="d" style="width:${(f.deletions / max) * 60}px"></i></span></td></tr>`).join("")}</table>`;
}

function threadHtml(c) {
  const local = c.local || {};
  const msgs = (local.thread || []).map((m) => m.role === "system"
    ? `<div class="sys">${esc(m.text)} · ${esc(when(m.at))}</div>`
    : `<div class="msg ${m.role === "user" ? "user" : "agent"}"><div class="who">${m.role === "user" ? "You" : esc(m.from || "Agent")} · ${esc(when(m.at))}</div><div class="md">${md(m.text)}</div></div>`).join("");
  const pending = local.pending ? (() => {
    const mins = (Date.now() - new Date(local.pending.at).getTime()) / 60000;
    return `<div class="msg agent" aria-label="Agent is replying"><div class="who">Agent</div><span class="thinking"><span>●</span><span>●</span><span>●</span></span>${mins > 5 ? ` <span class="hint">No reply yet. The agent may be busy; the answer will show up here.</span>` : ""}</div>`;
  })() : "";
  return `<div class="thread">${msgs || (pending ? "" : `<div class="hint">Ask anything about this PR, for example "What's still blocking this?" or "Explain the risky part in simple terms." The agent answers here.</div>`)}${pending}</div>`;
}

function timelineHtml(c) {
  const t = [...(c.events || []), ...(c.local?.history || []).map((h) => ({ ...h, source: "board" }))].sort((a, b) => a.at.localeCompare(b.at));
  return t.length ? `<ul class="timeline">${t.map((e) => `<li><time>${esc(when(e.at))}</time>${esc(e.text)}${e.source === "github" ? ` <span class="tone-mute">· GitHub</span>` : ""}</li>`).join("")}</ul>` : `<div class="hint">No events yet.</div>`;
}

function renderScroll(c, force) {
  const local = c.local || {};
  const det = details.get(c.number);
  const key = JSON.stringify([c.number, tab, c.updatedAt, c.waitingOn, c.reason?.label, c.reason?.stuck, local.updatedAt, local.pending?.id, det?.data?.fetchedAt, det?.error, drafts.has(draftKey(c)), (c.local?.thread || []).length]);
  if (!force && key === lastKey) return;
  lastKey = key;
  const sc = $("wsScroll");
  const atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 40;
  const prevTop = sc.scrollTop;
  const openState = Object.fromEntries([...sc.querySelectorAll("details[data-k]")].map((d) => [d.dataset.k, d.open]));
  sc.innerHTML = { overview: overviewHtml, conversation: conversationHtml, files: filesHtml, thread: threadHtml, timeline: timelineHtml }[tab](c);
  for (const d of sc.querySelectorAll("details[data-k]")) if (d.dataset.k in openState) d.open = openState[d.dataset.k];
  if (tab === "thread" && (force || atBottom)) sc.scrollTop = sc.scrollHeight;
  else sc.scrollTop = force ? 0 : prevTop;
  if (local.draft && !drafts.has(draftKey(c))) loadDraft(c);
}

const draftKey = (c) => c.number + ":" + (c.local?.draft?.attachedAt || "");
async function loadDraft(c) {
  const k = draftKey(c);
  if (drafts.has(k) || loadDraft.busy?.has(k)) return;
  (loadDraft.busy ??= new Set()).add(k);
  try {
    const res = await fetch(`/api/draft?repo=${encodeURIComponent(REPO)}&pr=${c.number}`);
    const data = await res.json();
    drafts.set(k, res.ok ? data : { error: data.error || "Couldn't load the draft" });
  } catch (e) { drafts.set(k, { error: e.message }); }
  loadDraft.busy.delete(k);
  if (current()?.number === c.number) render();
}

async function loadDetail(c, { force = false } = {}) {
  const cur = details.get(c.number);
  if (cur?.loading) return;
  if (cur && !force && cur.updatedAt === (c.updatedAt || c.mergedAt)) return;
  details.set(c.number, { loading: true, updatedAt: c.updatedAt || c.mergedAt });
  try {
    const res = await fetch(`/api/detail?repo=${encodeURIComponent(REPO)}&pr=${c.number}`);
    const data = await res.json();
    details.set(c.number, res.ok ? { data, updatedAt: c.updatedAt || c.mergedAt } : { error: data.error || "HTTP " + res.status, updatedAt: c.updatedAt || c.mergedAt });
  } catch (e) { details.set(c.number, { error: e.message }); }
  if (current()?.number === c.number) render();
}
let detailTimer = null;
// Arrow-key browsing shouldn't fetch every PR it passes; wait until the selection settles.
const scheduleDetail = (c) => { clearTimeout(detailTimer); detailTimer = setTimeout(() => loadDetail(c), 250); };

function render(force = false) {
  if (!snap) return;
  $("repo").textContent = snap.repo;
  $("banner").hidden = !snap.error;
  if (snap.error) $("banner").innerHTML = `${icon("alert")}<span>${esc(snap.error.message)}</span>`;
  const cards = cardsOf();
  const open = cards.filter((c) => c.group !== "merged").length;
  $("meta").textContent = snap.loading && !snap.fetchedAt ? "Loading…" : `${open} open · ${cards.length - open} merged today · ${snap.loading ? "refreshing…" : "updated " + ago(snap.fetchedAt) + (ago(snap.fetchedAt) === "just now" ? "" : " ago")}` + (snap.viewer ? ` · @${snap.viewer}` : "");
  $("meta").title = $("meta").textContent;
  if (!current() && cards.length) { const vis = visibleCards(); selected = (vis.find((c) => c.group === "you") || vis[0] || cards[0]).number; force = true; }
  renderList();
  const c = current();
  $("wsHead").hidden = !c;
  $("input").disabled = $("send").disabled = !c;
  if (!c) return;
  $("input").placeholder = `Ask a question or give direction on #${c.number}…`;
  const focusAct = document.activeElement?.closest?.("#wsHead [data-act]")?.dataset.act;
  renderHead(c);
  if (focusAct) $("wsHead").querySelector(`[data-act="${focusAct}"]`)?.focus();
  renderScroll(c, force);
  scheduleDetail(c);
}

function select(pr, { tabTo, focus } = {}) {
  if (tabTo) { tab = tabTo; store.set("prb-tab", tab); }
  document.body.classList.add("detail");
  if (pr === selected && !tabTo) { render(); return; }
  selected = pr;
  store.set(SEL_KEY, String(pr));
  openMenu = null;
  armed = null;
  render(true);
  if (focus) document.querySelector(`.row-main[data-pr="${pr}"]`)?.focus();
}

function arm(key, label) {
  clearTimeout(armed?.timer);
  armed = { key, label, timer: setTimeout(() => { armed = null; render(); }, 8000) };
  render();
}

function openMenuAndFocus(name) {
  openMenu = openMenu === name ? null : name;
  render();
  if (openMenu) $("wsHead").querySelector(".menu button")?.focus();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (openMenu) { openMenu = null; render(); } return; }
  const a = el.dataset.act;
  const rowPr = el.dataset.pr ? Number(el.dataset.pr) : null;
  if (a === "select") return select(rowPr ?? selected);
  if (a === "back") { document.body.classList.remove("detail"); return render(); }
  if (a === "filter") { filter = el.dataset.filter; store.set("prb-filter", filter); return render(); }
  if (a === "tab") { tab = el.dataset.tab; store.set("prb-tab", tab); render(true); return $("wsHead").querySelector(`[data-tab="${tab}"]`)?.focus(); }
  if (a === "row-post") { select(rowPr ?? selected, { tabTo: "overview" }); return openMenuAndFocus("post"); }
  if (a === "row-answer") { select(rowPr ?? selected, { tabTo: "thread" }); return $("input").focus(); }
  const pr = rowPr ?? selected;
  const c = cardsOf().find((x) => x.number === pr);
  if (!c) return;
  if (a === "reload-detail") { loadDetail(c, { force: true }); return render(true); }
  if (a === "more-menu") return openMenuAndFocus("more");
  if (a === "pin") { openMenu = null; pins.has(pr) ? pins.delete(pr) : pins.add(pr); store.set(PIN_KEY, JSON.stringify([...pins])); toast(pins.has(pr) ? "Pinned to the top of the list" : "Unpinned"); return render(); }
  if (a === "open-github") { openMenu = null; render(); return window.open(c.url, "_blank", "noopener"); }
  if (a === "open-chat-link") { openMenu = null; render(); location.href = "ghapp://sessions/" + encodeURIComponent(c.local.session.id); return; }
  if (a === "nudge") {
    const n = c.reason?.action?.nudge;
    if (!n) return;
    input.value = `Please post this comment on #${c.number}:\n\n${n}`;
    input.dispatchEvent(new Event("input"));
    input.focus();
    return toast("Draft comment is in the message box. Edit it, then press Send.");
  }
  if (a === "post-menu") {
    if (armed?.key?.startsWith(pr + ":post:")) { const ev = armed.key.split(":")[2]; clearTimeout(armed.timer); armed = null; render(); return act(pr, "post", { event: ev }); }
    return openMenuAndFocus("post");
  }
  if (a === "post") { openMenu = null; arm(`${pr}:post:${el.dataset.event}`, el.textContent.trim()); return $("wsHead").querySelector('[data-act="post-menu"]')?.focus(); }
  if (a === "ship") {
    if (armed?.key === `${pr}:ship`) { clearTimeout(armed.timer); armed = null; render(); return act(pr, "ship"); }
    return arm(`${pr}:ship`, "ship");
  }
  openMenu = null;
  if (a === "arch-review") { if (pr !== selected) select(pr); tab = "thread"; store.set("prb-tab", tab); render(true); }
  return act(pr, a);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (openMenu) { const which = openMenu; openMenu = null; render(); return $("wsHead").querySelector(`[data-act="${which}-menu"]`)?.focus(); }
    if (armed) { clearTimeout(armed.timer); armed = null; return render(); }
    if (document.body.classList.contains("narrow") && document.body.classList.contains("detail") && e.target.id !== "input") { document.body.classList.remove("detail"); render(); return document.querySelector(`.row-main[data-pr="${selected}"]`)?.focus(); }
  }
  // List: arrow keys move between rows.
  const row = e.target.closest?.(".row-main");
  if (row && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const rows = [...document.querySelectorAll(".row-main")];
    const next = rows[rows.indexOf(row) + (e.key === "ArrowDown" ? 1 : -1)];
    if (next) { selected = Number(next.dataset.pr); store.set(SEL_KEY, String(selected)); openMenu = null; armed = null; render(true); document.querySelector(`.row-main[data-pr="${next.dataset.pr}"]`)?.focus(); }
    return;
  }
  // Tabs: left/right arrows, Home/End.
  const t = e.target.closest?.('[role="tab"]');
  if (t && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const i = tabs.indexOf(t);
    const n = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    tabs[n].click();
    return;
  }
  // Menus: up/down arrows.
  const mi = e.target.closest?.('[role="menuitem"]');
  if (mi && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const items = [...mi.parentElement.querySelectorAll('[role="menuitem"]')];
    items[(items.indexOf(mi) + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  }
});

// Resizable split between the list and the workspace.
$("split").addEventListener("pointerdown", (e) => {
  const split = $("split");
  split.classList.add("drag");
  split.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const w = Math.max(340, Math.min(ev.clientX, window.innerWidth * 0.7));
    document.documentElement.style.setProperty("--list-w", w + "px");
    store.set("prb-list-w", String(Math.round(w)));
  };
  const up = () => { split.classList.remove("drag"); split.removeEventListener("pointermove", move); split.removeEventListener("pointerup", up); };
  split.addEventListener("pointermove", move);
  split.addEventListener("pointerup", up);
});

document.addEventListener("change", (e) => {
  if (e.target.id === "sortSel") { sortBy = e.target.value; store.set("prb-sort", sortBy); render(); }
});

// A narrow list stacks the status above the title.
new ResizeObserver(([entry]) => $("list").classList.toggle("tight", entry.contentRect.width < 470)).observe($("list"));

// Narrow panels show one pane at a time.
const narrowMq = window.matchMedia("(max-width: 760px)");
const applyNarrow = () => document.body.classList.toggle("narrow", narrowMq.matches);
narrowMq.addEventListener("change", () => { applyNarrow(); render(); });
applyNarrow();

const input = $("input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const c = current();
  const text = input.value.trim();
  if (!c || !text) return;
  $("send").disabled = true;
  try {
    await post("/api/message", { pr: c.number, text });
    input.value = "";
    input.style.height = "auto";
    if (tab !== "thread") { tab = "thread"; store.set("prb-tab", tab); render(true); }
  } catch (err) { toast("Couldn't send: " + err.message); }
  $("send").disabled = false;
  input.focus();
});

$("sumAll").innerHTML = `${icon("sparkle", "sm")}<span class="lbl">Summarize all needing me</span>`;
$("sumAll").setAttribute("aria-label", "Summarize all needing me");
$("refresh").innerHTML = `${icon("refresh", "sm")}Refresh`;
$("refresh").addEventListener("click", async () => { try { await post("/api/refresh", {}); } catch (e) { toast("Couldn't refresh: " + e.message); } });
$("sumAll").addEventListener("click", async () => {
  try { const r = await post("/api/summarize-all", {}); toast(r.count ? `Asked the agent to summarize ${r.count} PR${r.count === 1 ? "" : "s"}` : "Every PR that needs you already has a summary"); }
  catch (e) { toast("Couldn't start summaries: " + e.message); }
});

function connect() {
  const es = new EventSource(`/events?repo=${encodeURIComponent(REPO)}`);
  es.addEventListener("board", (ev) => { snap = JSON.parse(ev.data); render(); });
  es.onerror = () => { $("meta").textContent = "Reconnecting…"; };
}
setInterval(() => { if (snap) render(); }, 30000);
if (!REPO) { $("banner").hidden = false; $("banner").textContent = "No repo was given to this board."; }
else connect();
</script>
</body>
</html>
