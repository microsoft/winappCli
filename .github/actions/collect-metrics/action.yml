name: Collect Build Metrics
description: Measure artifact sizes, test results, coverage, and CLI startup time, and render them to the run's job summary

inputs:
  solution-path:
    description: Path to the .NET solution file
    default: src/winapp-CLI/winapp.sln
  artifacts-path:
    description: Path to the artifacts directory
    default: artifacts

runs:
  using: composite
  steps:
    - name: Measure artifact sizes
      shell: pwsh
      run: |
        $artifacts = "${{ inputs.artifacts-path }}"
        $sizes = @{}

        # Sum all files excluding PDBs to get total CLI distribution size
        $x64Files = Get-ChildItem "$artifacts/cli/win-x64" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -ne '.pdb' }
        $arm64Files = Get-ChildItem "$artifacts/cli/win-arm64" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -ne '.pdb' }
        $npmPkg = Get-ChildItem "$artifacts/*.tgz" -ErrorAction SilentlyContinue | Select-Object -First 1
        $msixX64 = Get-ChildItem "$artifacts/msix-packages/*x64*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
        $msixArm64 = Get-ChildItem "$artifacts/msix-packages/*arm64*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
        $nugetPkg = Get-ChildItem "$artifacts/nuget/*.nupkg" -ErrorAction SilentlyContinue | Select-Object -First 1

        if ($x64Files) { $sizes["cli-win-x64"] = ($x64Files | Measure-Object -Property Length -Sum).Sum }
        if ($arm64Files) { $sizes["cli-win-arm64"] = ($arm64Files | Measure-Object -Property Length -Sum).Sum }
        if ($npmPkg) { $sizes["npm-package"] = $npmPkg.Length }
        if ($msixX64) { $sizes["msix-x64"] = $msixX64.Length }
        if ($msixArm64) { $sizes["msix-arm64"] = $msixArm64.Length }
        if ($nugetPkg) { $sizes["nuget-package"] = $nugetPkg.Length }

        $sizes | ConvertTo-Json | Set-Content "$artifacts/binary-sizes.json"

        Write-Host "Current artifact sizes:"
        $sizes.GetEnumerator() | Sort-Object Key | ForEach-Object {
          Write-Host "  $($_.Key): $([math]::Round($_.Value / 1MB, 2)) MB ($($_.Value) bytes)"
        }

    - name: Parse test results
      shell: pwsh
      run: |
        $trxFiles = Get-ChildItem "${{ inputs.artifacts-path }}/TestResults/*.trx" -ErrorAction SilentlyContinue
        $totalTests = 0; $passed = 0; $failed = 0; $skipped = 0; $durationMs = 0

        foreach ($trx in $trxFiles) {
          [xml]$xml = Get-Content $trx.FullName
          $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }

          $counters = $xml | Select-Xml "//t:ResultSummary/t:Counters" -Namespace $ns | Select-Object -First 1
          if ($counters) {
            $totalTests += [int]$counters.Node.total
            $passed += [int]$counters.Node.passed
            $failed += [int]$counters.Node.failed
            $skipped += [int]$counters.Node.total - [int]$counters.Node.executed
          }

          $times = $xml | Select-Xml "//t:Times" -Namespace $ns | Select-Object -First 1
          if ($times -and $times.Node.finish -and $times.Node.start) {
            $start = [DateTime]::Parse($times.Node.start)
            $finish = [DateTime]::Parse($times.Node.finish)
            $durationMs += ($finish - $start).TotalMilliseconds
          }
        }

        $testSummary = @{
          total = $totalTests
          passed = $passed
          failed = $failed
          skipped = $skipped
          durationMs = [math]::Round($durationMs)
        }

        $testSummary | ConvertTo-Json | Set-Content "${{ inputs.artifacts-path }}/test-summary.json"

        $durationSec = [math]::Round($durationMs / 1000, 1)
        Write-Host "Tests: $totalTests total, $passed passed, $failed failed, $skipped skipped in ${durationSec}s"

    - name: Parse coverage results
      shell: pwsh
      run: |
        $coverageFiles = @(Get-ChildItem "${{ inputs.artifacts-path }}/TestResults/*.cobertura.xml" -ErrorAction SilentlyContinue)
        if ($coverageFiles.Count -eq 0) {
          Write-Warning "No coverage.cobertura.xml found, skipping coverage metrics"
          @{ lineCoverage = $null; branchCoverage = $null } | ConvertTo-Json | Set-Content "${{ inputs.artifacts-path }}/coverage-summary.json"
          exit 0
        }

        # Each test project emits its own report, and a report covers every assembly that run loaded --
        # so shared assemblies appear in more than one report. Union the reports (a line counts as
        # covered when any run hit it) rather than reading just the first, which would report an
        # assembly's coverage from a run that barely touches it, or summing, which would double-count
        # shared code in the denominator.
        $lineHits = @{}
        $branchTotals = @{}
        $branchCovered = @{}
        $branchReports = @{}
        $lineConditions = @{}
        foreach ($file in $coverageFiles) {
          [xml]$xml = Get-Content $file.FullName
          foreach ($package in $xml.coverage.packages.package) {
            foreach ($class in @($package.classes.class)) {
              if (-not $class) { continue }
              foreach ($line in @($class.lines.line)) {
                if (-not $line) { continue }
                # Keyed by source line, so a line listed under several classes (partials, generics)
                # counts once. That makes the totals slightly smaller than any single report's own
                # counters, which tally per class.
                $key = "$($class.filename)|$($line.number)"
                $hits = [int]$line.hits
                if (-not $lineHits.ContainsKey($key) -or $lineHits[$key] -lt $hits) { $lineHits[$key] = $hits }

                # "75% (3/4)" -- the denominator is the line's branch count, and the numerator is that
                # report's exact covered count. A switch can put many branches behind a single
                # condition, so never assume two per condition.
                if ($line.'condition-coverage' -notmatch '\((\d+)/(\d+)\)') { continue }
                $branchTotals[$key] = [int]$Matches[2]
                $reportCovered = [int]$Matches[1]
                if (-not $branchCovered.ContainsKey($key) -or $branchCovered[$key] -lt $reportCovered) {
                  $branchCovered[$key] = $reportCovered
                }
                $branchReports[$key] = 1 + ($(if ($branchReports.ContainsKey($key)) { $branchReports[$key] } else { 0 }))

                # Union per condition as well, because two runs often cover different conditions on
                # the same line and the per-report numerator alone would keep only the better run.
                # Cobertura gives a percentage per condition rather than which arms ran, so this is an
                # estimate; it is only ever used to raise a line above its best single-run count, and
                # is capped by the line's own branch total.
                if (-not $lineConditions.ContainsKey($key)) { $lineConditions[$key] = @{} }
                foreach ($condition in @($line.conditions.condition)) {
                  if (-not $condition) { continue }
                  $percent = [double]($condition.coverage -replace '%', '')
                  $existing = $lineConditions[$key][$condition.number]
                  if ($null -eq $existing -or $existing -lt $percent) {
                    $lineConditions[$key][$condition.number] = $percent
                  }
                }
              }
            }
          }
        }

        $linesValid = $lineHits.Count
        $linesCovered = @($lineHits.Values | Where-Object { $_ -gt 0 }).Count

        $branchesValid = 0
        $branchesCovered = 0
        foreach ($key in $branchTotals.Keys) {
          $total = $branchTotals[$key]
          $branchesValid += $total

          # Start from the best single run's exact count. Only when more than one run observed the
          # line is the per-condition union worth consulting -- and only then is an estimate involved.
          $covered = $branchCovered[$key]
          $conditions = $lineConditions[$key]
          if ($branchReports[$key] -gt 1 -and $conditions.Count -gt 0) {
            # Each condition accounts for an equal share of the line's branches.
            $perCondition = $total / $conditions.Count
            $unioned = 0.0
            foreach ($percent in $conditions.Values) { $unioned += ($percent / 100) * $perCondition }
            $unioned = [int][math]::Floor($unioned)
            if ($unioned -gt $covered) { $covered = $unioned }
          }
          $branchesCovered += [math]::Min($covered, $total)
        }

        $linePct = if ($linesValid -gt 0) { [math]::Round(100 * $linesCovered / $linesValid, 1) } else { 0 }
        $branchPct = if ($branchesValid -gt 0) { [math]::Round(100 * $branchesCovered / $branchesValid, 1) } else { 0 }

        $coverageSummary = @{
          lineCoverage = $linePct
          branchCoverage = $branchPct
        }

        $coverageSummary | ConvertTo-Json | Set-Content "${{ inputs.artifacts-path }}/coverage-summary.json"
        Write-Host "Coverage across $($coverageFiles.Count) report(s): ${linePct}% lines ($linesCovered/$linesValid), ${branchPct}% branches ($branchesCovered/$branchesValid)"

    - name: Measure CLI startup time
      shell: pwsh
      run: |
        $exe = "${{ inputs.artifacts-path }}/cli/win-x64/winapp.exe"
        if (-not (Test-Path $exe)) {
          Write-Warning "CLI binary not found, skipping startup benchmark"
          @{ medianMs = 0; samples = @() } | ConvertTo-Json | Set-Content "${{ inputs.artifacts-path }}/startup-time.json"
          exit 0
        }

        $times = @()
        # Warm-up run (prime filesystem cache)
        & $exe --version 2>&1 | Out-Null

        # 5 timed runs
        for ($i = 0; $i -lt 5; $i++) {
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & $exe --version 2>&1 | Out-Null
          $sw.Stop()
          $times += $sw.ElapsedMilliseconds
        }

        $sorted = $times | Sort-Object
        $median = $sorted[[math]::Floor($sorted.Count / 2)]

        $startup = @{
          medianMs = $median
          samples = $times
        }

        $startup | ConvertTo-Json | Set-Content "${{ inputs.artifacts-path }}/startup-time.json"

        Write-Host "CLI startup time (--version): ${median}ms median (samples: $($times -join ', ')ms)"

    # Render the collected metrics into the run's job summary so every build
    # (including pushes to main, which never get a PR comment) surfaces its
    # coverage/tests/startup/sizes on the run page without digging into logs.
    - name: Write metrics job summary
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        $artifacts = "${{ inputs.artifacts-path }}"
        $summaryPath = $env:GITHUB_STEP_SUMMARY
        if (-not $summaryPath) {
          Write-Host "GITHUB_STEP_SUMMARY not set; skipping job summary"
          exit 0
        }

        function Read-JsonOrNull($path) {
          if (Test-Path $path) {
            try { return Get-Content $path -Raw | ConvertFrom-Json } catch { return $null }
          }
          return $null
        }

        $coverage = Read-JsonOrNull "$artifacts/coverage-summary.json"
        $tests    = Read-JsonOrNull "$artifacts/test-summary.json"
        $startup  = Read-JsonOrNull "$artifacts/startup-time.json"
        $sizes    = Read-JsonOrNull "$artifacts/binary-sizes.json"

        $md = New-Object System.Collections.Generic.List[string]
        $md.Add('## Build Metrics')
        $md.Add('')

        # Coverage first — this is the value that has no other surface on main.
        $lineCov   = if ($coverage -and $null -ne $coverage.lineCoverage)   { "$($coverage.lineCoverage)%" }   else { 'n/a' }
        $branchCov = if ($coverage -and $null -ne $coverage.branchCoverage) { "$($coverage.branchCoverage)%" } else { 'n/a' }
        $md.Add('### Test Coverage')
        $md.Add('')
        $md.Add('| Metric | Value |')
        $md.Add('| --- | --- |')
        $md.Add("| Line coverage | $lineCov |")
        $md.Add("| Branch coverage | $branchCov |")
        $md.Add('')

        if ($tests -and $tests.total -gt 0) {
          $durSec = [math]::Round(([double]$tests.durationMs) / 1000, 1)
          $md.Add('### Test Results')
          $md.Add('')
          $md.Add('| Total | Passed | Failed | Skipped | Duration |')
          $md.Add('| --- | --- | --- | --- | --- |')
          $md.Add("| $($tests.total) | $($tests.passed) | $($tests.failed) | $($tests.skipped) | ${durSec}s |")
          $md.Add('')
        }

        if ($startup -and $startup.medianMs) {
          $md.Add('### CLI Startup Time')
          $md.Add('')
          $md.Add("Median: **$($startup.medianMs) ms** (x64, " + '`winapp --version`' + ')')
          $md.Add('')
        }

        if ($sizes) {
          $sizeProps = @($sizes.PSObject.Properties | Sort-Object Name)
          if ($sizeProps.Count -gt 0) {
            $md.Add('### Binary Sizes')
            $md.Add('')
            $md.Add('| Artifact | Size |')
            $md.Add('| --- | --- |')
            foreach ($p in $sizeProps) {
              $mb = [math]::Round([double]$p.Value / 1MB, 2)
              $md.Add("| $($p.Name) | $mb MB |")
            }
            $md.Add('')
          }
        }

        ($md -join "`n") | Add-Content -Path $summaryPath -Encoding utf8
        Write-Host "Wrote build metrics to job summary"
