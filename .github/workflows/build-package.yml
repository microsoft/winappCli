name: Build and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [ checks_requested ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Supersede only older runs of the same PR, never main, merge queue, or manual builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs and merge groups that change only Markdown in docs\ or the repo root skip the build
  # and test lanes. docs\npm-usage.md is checked by npm tests, so it counts as code, and so
  # does every non-Markdown file (docs\ holds a schema that CLI tests read). Push and manual
  # runs always build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      restore: ${{ steps.classify.outputs.restore }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Classify changed files
      id: classify
      shell: pwsh
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        MQ_BASE: ${{ github.event.merge_group.base_sha }}
        MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        # Fork and Dependabot PRs get no OIDC token, so their feed restore runs in the merge queue.
        NO_FEED_TOKEN: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
      run: |
        $range = switch ($env:EVENT) {
          'pull_request' { "$env:PR_BASE...$env:PR_HEAD" }
          'merge_group' { "$env:MQ_BASE..$env:MQ_HEAD" }
          default { $null }
        }
        $code = $true
        $restore = $true
        if ($range) {
          # --no-renames lists a moved file's old path too, so moving code into docs\ still builds.
          $files = @(git diff --name-only --no-renames $range)
          if ($LASTEXITCODE -ne 0) { throw "git diff $range failed" }
          $codeFiles = @($files | Where-Object {
            $_ -eq 'docs/npm-usage.md' -or $_ -notlike '*.md' -or ($_ -like '*/*' -and $_ -notlike 'docs/*')
          })
          # An empty diff is not evidence of a docs-only change.
          $code = $files.Count -eq 0 -or $codeFiles.Count -gt 0
          $restoreFiles = @($files | Where-Object {
            $_ -match '\.(csproj|props|targets)$|(^|/)(nuget\.config|global\.json)$' -or
            $_ -in '.pipelines/release-nuget.config', 'scripts/test-internal-feed-restore.ps1', '.github/workflows/build-package.yml'
          })
          $restore = $files.Count -eq 0 -or $restoreFiles.Count -gt 0
          Write-Host "$($files.Count) changed file(s); $($codeFiles.Count) need the full build; $($restoreFiles.Count) affect package restore."
        }
        $restore = $restore -and $env:NO_FEED_TOKEN -ne 'true'
        "code=$($code.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "restore=$($restore.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  # The scripts Pester suite ports the real docs and checks their links and tables.
  docs-tests:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run docs port tests
      run: |
        $pester = Get-Module -Name Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Sort-Object Version -Descending | Select-Object -First 1
        if (-not $pester) { throw 'Pester 5 is required.' }
        Import-Module $pester -Force
        $config = New-PesterConfiguration
        $config.Run.Path = 'scripts/tests/validate-mslearn-docs.Tests.ps1'
        $config.Run.Exit = $true
        $config.Output.Verbosity = 'Detailed'
        Invoke-Pester -Configuration $config

  # Publish each CLI architecture and build each DevTools engine on its own runner;
  # build-artifacts then combines and packages them.
  build-parts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: true
      matrix:
        stage: [Cli, Engine]
        arch: [x64, arm64]
    name: build-parts (${{ matrix.stage }} ${{ matrix.arch }})
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for build number calculation

    - name: Install .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Build ${{ matrix.stage }} ${{ matrix.arch }}
      env:
        STAGE: ${{ matrix.stage }}
        ARCH: ${{ matrix.arch }}
      run: .\scripts\build-cli.ps1 -Stage $env:STAGE -Architecture $env:ARCH -SkipTests -SkipDocs

    - name: Upload part
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: part-${{ matrix.stage }}-${{ matrix.arch }}
        path: artifacts/${{ matrix.stage == 'Cli' && 'cli' || 'devtools' }}/win-${{ matrix.arch }}/
        if-no-files-found: error
        overwrite: true

  build-artifacts:
    needs: build-parts
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for build number calculation
    
    - name: Install .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Download CLI x64
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: part-Cli-x64
        path: artifacts/cli/win-x64

    - name: Download CLI arm64
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: part-Cli-arm64
        path: artifacts/cli/win-arm64

    - name: Download engine x64
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: part-Engine-x64
        path: artifacts/devtools/win-x64

    - name: Download engine arm64
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: part-Engine-arm64
        path: artifacts/devtools/win-arm64
    
    # Combine both architectures and package them; validation consumes these
    # same-run artifacts on separate runners without republishing.
    - name: Build and package (awaiting validation)
      run: .\scripts\build-cli.ps1 -Stage Package -SkipTests -SkipDocs
    
    - name: Upload CLI binaries
      id: cli
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cli-binaries
        path: artifacts/cli/
        if-no-files-found: error
        overwrite: true
    
    - name: Upload npm package
      id: npm
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: npm-package
        path: artifacts/*.tgz
        if-no-files-found: error
        overwrite: true

    - name: Upload MSIX packages
      id: msix
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: msix-packages
        path: artifacts/msix-packages/
        if-no-files-found: error
        overwrite: true

    # CLI tools, both UI Automation libraries, and the WinUI analyzer.
    - name: Upload NuGet packages
      id: nuget
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        if-no-files-found: error
        overwrite: true

    - name: Link downloads awaiting validation
      env:
        CLI_URL: ${{ steps.cli.outputs.artifact-url }}
        NPM_URL: ${{ steps.npm.outputs.artifact-url }}
        MSIX_URL: ${{ steps.msix.outputs.artifact-url }}
        NUGET_URL: ${{ steps.nuget.outputs.artifact-url }}
      run: |
        @"
        ## Downloads - awaiting validation

        These packages are available before tests finish. Download availability is not a passing check.
        Check **build-and-package** before relying on this build.

        | Artifact | Download |
        | --- | --- |
        | CLI (x64 + ARM64) | [cli-binaries]($env:CLI_URL) |
        | npm | [npm-package]($env:NPM_URL) |
        | MSIX | [msix-packages]($env:MSIX_URL) |
        | NuGet (all four packages) | [nuget-packages]($env:NUGET_URL) |
        "@ >> $env:GITHUB_STEP_SUMMARY

  validate-tests:
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: Cli-1
          suite: Cli
          shard: 1
        - lane: Cli-2
          suite: Cli
          shard: 2
        - lane: Cli-4
          suite: Cli
          shard: 4
        - lane: Auxiliary
          suite: Auxiliary
          shard: 0
        - lane: UIAutomation
          suite: UIAutomation
          shard: 0
    name: validate-tests (${{ matrix.lane }})
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Setup Node.js
      if: matrix.suite != 'UIAutomation'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Download CLI binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Download NuGet packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nuget-packages
        path: artifacts/nuget

    - name: Run validation without republishing
      env:
        TEST_SUITE: ${{ matrix.suite }}
        CLI_SHARD: ${{ matrix.shard }}
      run: |
        $testArgs = @{ OnlyTests = $true; UseExistingArtifacts = $true; TestSuite = $env:TEST_SUITE }
        if ($env:TEST_SUITE -eq 'Cli') { $testArgs.CliShard = [int]$env:CLI_SHARD }
        .\scripts\build-cli.ps1 @testArgs

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: validation-results-${{ matrix.lane }}
        path: artifacts/TestResults/
        if-no-files-found: error
        overwrite: true

  validate-docs:
    needs: build-artifacts
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download CLI binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Validate CLI schema and plugin manifests
      env:
        PRE_MERGE: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      run: .\scripts\validate-llm-docs.ps1 -FailOnDrift:($env:PRE_MERGE -eq 'true')

    - name: Validate shipped DevTools engines
      run: |
        .\scripts\test-devtools-engine.ps1 -EngineRoot .\artifacts\cli
        if (-not $?) { throw 'Published engine validation failed' }

  # Builds its own engine and test fixtures, so it starts without waiting for build-artifacts.
  validate-devtools:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Validate native source contracts
      run: |
        # Test builds never write to artifacts\cli, which other gates consume.
        .\src\winapp-devtools\build-devtools.ps1 -Configuration Release -Arch x64 -EngineOut .\artifacts\validation-devtools\win-x64
        if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Native DevTools validation failed' }

    - name: Run CLI native integration shard
      run: |
        $env:WINAPP_NATIVE_TEST_FIXTURE = (Resolve-Path .\src\winapp-devtools\test\bin\native-runtime-tests.exe).Path
        $project = '.\src\winapp-CLI\WinApp.Cli.Tests\WinApp.Cli.Tests.csproj'
        dotnet build $project -c Debug -p:TreatWarningsAsErrors=true
        if ($LASTEXITCODE -ne 0) { throw 'CLI native integration build failed' }
        .\scripts\test-cli-shard.ps1 -Shard 3 -TestProjectPath $project `
          -ResultsDirectory .\artifacts\TestResults\devtools `
          -CoverageSettings .\src\winapp-CLI\coverage.runsettings
        if (-not $? -or $LASTEXITCODE -ne 0) { throw 'CLI native integration tests failed' }

    - name: Run managed binding and startup-hook contracts (.NET 8)
      timeout-minutes: 30
      run: |
        $env:WINAPP_BINDING_TEST_FIXTURE = (Resolve-Path .\src\winapp-devtools\test\bin\binding-transfer-fixture.dll).Path
        .\scripts\test-managed-devtools.ps1 -Framework net8.0-windows10.0.19041.0

    - name: Run managed binding and startup-hook contracts (.NET 10)
      if: ${{ !cancelled() }}
      timeout-minutes: 30
      run: |
        $env:WINAPP_BINDING_TEST_FIXTURE = (Resolve-Path .\src\winapp-devtools\test\bin\binding-transfer-fixture.dll).Path
        .\scripts\test-managed-devtools.ps1 -Framework net10.0-windows10.0.19041.0

    - name: Upload DevTools validation results
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: devtools-validation-results
        path: artifacts/TestResults/devtools/
        if-no-files-found: error
        overwrite: true

  # GitHub restores from nuget.org, but the ADO build restores only from pde-oss_Internal, which
  # saves new nuget.org versions days later. Restore from that feed too, so a version it doesn't
  # have yet fails here instead of breaking the ADO build on main.
  internal-feed-restore:
    needs: changes
    if: needs.changes.outputs.restore == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    # The environment gives the OIDC token a stable subject on every event; it creates no deployments.
    environment:
      name: internal-feed
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore from pde-oss_Internal
      env:
        CLIENT_ID: ${{ vars.INTERNAL_FEED_CLIENT_ID }}
      run: |
        if (-not $env:CLIENT_ID) { throw 'The internal-feed environment has no INTERNAL_FEED_CLIENT_ID variable.' }
        $oidc = Invoke-RestMethod "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
          -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
        # 499b84ac-... is Azure DevOps; 72f988bf-... is the Microsoft tenant.
        $aad = Invoke-RestMethod 'https://login.microsoftonline.com/72f988bf-86f1-41af-91ab-2d7cd011db47/oauth2/v2.0/token' -Method Post -Body @{
          client_id = $env:CLIENT_ID
          scope = '499b84ac-1321-427f-aa17-267ca6975798/.default'
          grant_type = 'client_credentials'
          client_assertion_type = 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'
          client_assertion = $oidc.value
        }
        Write-Host "::add-mask::$($aad.access_token)"
        .\scripts\test-internal-feed-restore.ps1 -Token $aad.access_token

  # Called locally, within this run and with the PR token, including for forks.
  samples:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: build-artifacts
    uses: ./.github/workflows/test-samples.yml
    with:
      use-existing-artifacts: true

  # Keep the existing branch-protection check name outside the reusable workflow.
  test-samples-result:
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs: [changes, samples]
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      shell: pwsh
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        CODE: ${{ needs.changes.outputs.code }}
        SAMPLE_RESULT: ${{ needs.samples.result }}
      run: |
        $expected = if ($env:CODE -eq 'true') { 'success' } else { 'skipped' }
        if ($env:CHANGES_RESULT -ne 'success' -or $env:SAMPLE_RESULT -ne $expected) {
          throw "Sample validation did not meet the required outcome ($env:SAMPLE_RESULT, expected $expected)"
        }

  metrics:
    needs: [build-artifacts, validate-tests, validate-devtools]
    if: ${{ !cancelled() && needs.build-artifacts.result == 'success' && (needs.validate-tests.result == 'success' || needs.validate-tests.result == 'failure') && (needs.validate-devtools.result == 'success' || needs.validate-devtools.result == 'failure') }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write  # Delete the old main metrics baseline cache
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download CLI binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Download npm package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: npm-package
        path: artifacts

    - name: Download MSIX packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: msix-packages
        path: artifacts/msix-packages

    - name: Download NuGet packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nuget-packages
        path: artifacts/nuget

    - name: Download CLI shard 1 results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: validation-results-Cli-1
        path: artifacts/TestResults

    - name: Download CLI shard 2 results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: validation-results-Cli-2
        path: artifacts/TestResults

    - name: Download CLI shard 4 results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: validation-results-Cli-4
        path: artifacts/TestResults

    - name: Download native integration and managed test results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: devtools-validation-results
        path: artifacts/TestResults/devtools

    - name: Download auxiliary test results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: validation-results-Auxiliary
        path: artifacts/TestResults

    - name: Download UI Automation test results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: validation-results-UIAutomation
        path: artifacts/TestResults

    # Keep the public/reporting artifact name even if one lane failed before reporting.
    - name: Upload combined test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: artifacts/TestResults
        if-no-files-found: error
        overwrite: true

    - name: Collect build metrics
      uses: ./.github/actions/collect-metrics

    - name: Report build metrics
      # Failed main/manual validation still publishes test-results above, but
      # must not promote failed measurements to the main comparison baseline.
      # Merge queue runs have no PR to comment on and must not touch the baseline.
      if: github.event_name != 'merge_group' && (github.event_name == 'pull_request' || (needs.validate-tests.result == 'success' && needs.validate-devtools.result == 'success'))
      uses: ./.github/actions/report-metrics
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: The "mark metrics comment as stale" job that used to live here
  # has moved to .github/workflows/mark-metrics-stale.yml so it can run on
  # `pull_request_target` and obtain write permissions for fork PRs.

  # E2E test for winapp ui commands against WinUI 3 sample app
  e2e-test-ui:
    runs-on: windows-latest
    needs: build-artifacts
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Enable Windows Developer Mode
      run: |
        reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /v "AllowDevelopmentWithoutDevLicense" /d 1 /f

    - name: Setup .NET 10
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: "10.0.x"

    - name: Download CLI binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: cli-binaries
        path: artifacts/cli

    # Real builds of packaged WinUI apps with project references (see tests/project-references/README.md).
    - name: Run project-reference build tests
      run: |
        $pester = Get-Module -Name Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Sort-Object Version -Descending | Select-Object -First 1
        if (-not $pester) { throw 'Pester 5 is required.' }
        Import-Module $pester -Force
        $platform = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
        $config = New-PesterConfiguration
        $config.Run.Container = New-PesterContainer -Path tests/project-references/ProjectReferences.Tests.ps1 -Data @{ WinappPath = "artifacts/cli/win-$platform/winapp.exe" }
        $config.Run.Exit = $true
        $config.Output.Verbosity = 'Detailed'
        Invoke-Pester -Configuration $config

    - name: Run WinUI UI E2E test
      run: |
        $platform = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
        .\scripts\test-e2e-winui-ui.ps1 -WinAppPath "artifacts/cli/win-$platform/winapp.exe"

    # Gated cooperative desktop-turn coverage (issue #764). Runs here, on the interactive lane, because
    # it drives real winapp.exe processes against a real foreground window.
    - name: Run UI coordination multiprocess and real-app tests
      run: .\scripts\test-ui-coordination.ps1

    - name: Run native-element binding lifetime regression
      run: .\scripts\test-binding-lifetime.ps1

    - name: Run compiled binding owner regression
      run: |
        $cli = "artifacts\cli\win-x64\winapp.exe"
        $evidence = "artifacts\TestResults\binding-owners"
        .\scripts\test-devtools-binding-owners.ps1 -Cli $cli -EvidenceDirectory $evidence -VerifyComments -PrepareOnly
        .\scripts\test-devtools-binding-owners.ps1 -Cli $cli -EvidenceDirectory $evidence -VerifyComments

    - name: Observe owned DevTools quick-peek UI
      run: |
        $cli = "artifacts\cli\win-x64\winapp.exe"
        $evidence = "artifacts\TestResults\devtools-overlay-observations"
        .\scripts\test-devtools-binding-owners.ps1 -Cli $cli -EvidenceDirectory $evidence -ProbeOverlay -PrepareOnly
        .\scripts\test-devtools-binding-owners.ps1 -Cli $cli -EvidenceDirectory $evidence -ProbeOverlay

    - name: Upload owned DevTools UI observations
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: devtools-overlay-observations
        path: artifacts/TestResults/devtools-overlay-observations/
        if-no-files-found: warn
        overwrite: true

    - name: Upload compiled binding owner results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binding-owner-test-results
        path: artifacts/TestResults/binding-owners/
        if-no-files-found: warn
        overwrite: true

    - name: Upload binding lifetime test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binding-lifetime-test-results
        path: artifacts/TestResults/binding-lifetime/
        if-no-files-found: warn
        overwrite: true

    - name: Upload UI coordination test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui-coordination-test-results
        path: artifacts/TestResults/ui-coordination/
        if-no-files-found: warn
        overwrite: true

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui-test-screenshots
        path: artifacts/screenshots/
        if-no-files-found: warn
        overwrite: true

  # Retain the original required check, but only turn it green after every lane.
  # metrics only reports results, so the check does not wait for it.
  # Docs-only changes expect every build and test lane to be skipped and docs-tests to pass.
  # internal-feed-restore runs only when restore inputs change, so it is expected exactly then.
  build-and-package:
    if: always()
    needs: [changes, docs-tests, build-parts, build-artifacts, validate-tests, validate-docs, validate-devtools, e2e-test-ui, samples, internal-feed-restore]
    runs-on: ubuntu-latest
    steps:
    - name: Require all build and validation jobs
      shell: pwsh
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
        PRE_MERGE: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      run: |
        $results = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
        $code = $results['changes'].outputs.code -eq 'true'
        foreach ($job in $results.Keys) {
          $expected = if ($job -eq 'changes') { 'success' }
            elseif ($job -eq 'internal-feed-restore') { if ($results['changes'].outputs.restore -eq 'true') { 'success' } else { 'skipped' } }
            elseif ($job -eq 'docs-tests') { if ($code) { 'skipped' } else { 'success' } }
            elseif (-not $code) { 'skipped' }
            elseif ($job -eq 'samples' -and $env:PRE_MERGE -ne 'true') { 'skipped' }
            else { 'success' }
          if ($results[$job].result -ne $expected) {
            throw "$job did not meet the required outcome: $($results[$job].result) (expected $expected)"
          }
        }
