name: Build and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Supersede only older runs of the same PR, never main or manual builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-artifacts:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for build number calculation
    
    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    
    # Build both architectures and packages together; validation consumes these
    # same-run artifacts on separate runners without republishing.
    - name: Build and package (awaiting validation)
      run: .\scripts\build-cli.ps1 -SkipTests -SkipDocs
    
    - name: Upload CLI binaries
      id: cli
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cli-binaries
        path: artifacts/cli/
        if-no-files-found: error
    
    - name: Upload npm package
      id: npm
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: npm-package
        path: artifacts/*.tgz
        if-no-files-found: error

    - name: Upload MSIX packages
      id: msix
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: msix-packages
        path: artifacts/msix-packages/
        if-no-files-found: error

    # CLI tools, both UI Automation libraries, and the WinUI analyzer.
    - name: Upload NuGet packages
      id: nuget
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        if-no-files-found: error

    - name: Link downloads awaiting validation
      env:
        CLI_URL: ${{ steps.cli.outputs.artifact-url }}
        NPM_URL: ${{ steps.npm.outputs.artifact-url }}
        MSIX_URL: ${{ steps.msix.outputs.artifact-url }}
        NUGET_URL: ${{ steps.nuget.outputs.artifact-url }}
      run: |
        @"
        ## Downloads - awaiting validation

        These packages are available before tests finish. Download availability is not a passing check.
        Check **build-and-package** before relying on this build.

        | Artifact | Download |
        | --- | --- |
        | CLI (x64 + ARM64) | [cli-binaries]($env:CLI_URL) |
        | npm | [npm-package]($env:NPM_URL) |
        | MSIX | [msix-packages]($env:MSIX_URL) |
        | NuGet (all four packages) | [nuget-packages]($env:NUGET_URL) |
        "@ >> $env:GITHUB_STEP_SUMMARY

  validate-tests:
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: Cli-1
          suite: Cli
          shard: 1
        - lane: Cli-2
          suite: Cli
          shard: 2
        - lane: Auxiliary
          suite: Auxiliary
          shard: 0
        - lane: UIAutomation
          suite: UIAutomation
          shard: 0
    name: validate-tests (${{ matrix.lane }})
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Setup Node.js
      if: matrix.suite != 'UIAutomation'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Download CLI binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Download NuGet packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: artifacts/nuget

    - name: Run validation without republishing
      env:
        TEST_SUITE: ${{ matrix.suite }}
        CLI_SHARD: ${{ matrix.shard }}
      run: |
        $testArgs = @{ OnlyTests = $true; UseExistingArtifacts = $true; TestSuite = $env:TEST_SUITE }
        if ($env:TEST_SUITE -eq 'Cli') { $testArgs.CliShard = [int]$env:CLI_SHARD }
        .\scripts\build-cli.ps1 @testArgs

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: validation-results-${{ matrix.lane }}
        path: artifacts/TestResults/
        if-no-files-found: error

  validate-docs:
    needs: build-artifacts
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download CLI binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Validate CLI schema and plugin manifests
      env:
        IS_PR: ${{ github.event_name == 'pull_request' }}
      run: .\scripts\validate-llm-docs.ps1 -FailOnDrift:($env:IS_PR -eq 'true')

  # Called locally, within this run and with the PR token, including for forks.
  samples:
    if: github.event_name == 'pull_request'
    needs: build-artifacts
    uses: ./.github/workflows/test-samples.yml
    with:
      use-existing-artifacts: true

  # Keep the existing branch-protection check name outside the reusable workflow.
  test-samples-result:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: samples
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      shell: pwsh
      env:
        SAMPLE_RESULT: ${{ needs.samples.result }}
      run: |
        if ($env:SAMPLE_RESULT -ne 'success') {
          throw "Sample validation did not succeed ($env:SAMPLE_RESULT)"
        }

  metrics:
    needs: [build-artifacts, validate-tests]
    if: ${{ !cancelled() && needs.build-artifacts.result == 'success' && (needs.validate-tests.result == 'success' || (github.event_name == 'pull_request' && needs.validate-tests.result == 'failure')) }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write  # Delete the old main metrics baseline cache
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download CLI binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Download npm package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: npm-package
        path: artifacts

    - name: Download MSIX packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: msix-packages
        path: artifacts/msix-packages

    - name: Download NuGet packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: artifacts/nuget

    - name: Download CLI shard 1 results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: validation-results-Cli-1
        path: artifacts/TestResults

    - name: Download CLI shard 2 results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: validation-results-Cli-2
        path: artifacts/TestResults

    - name: Download auxiliary test results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: validation-results-Auxiliary
        path: artifacts/TestResults

    - name: Download UI Automation test results
      if: ${{ !cancelled() }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: validation-results-UIAutomation
        path: artifacts/TestResults

    # Keep the public/reporting artifact name even if one lane failed before reporting.
    - name: Upload combined test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: artifacts/TestResults
        if-no-files-found: error

    - name: Collect build metrics
      uses: ./.github/actions/collect-metrics

    - name: Report build metrics
      uses: ./.github/actions/report-metrics
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: The "mark metrics comment as stale" job that used to live here
  # has moved to .github/workflows/mark-metrics-stale.yml so it can run on
  # `pull_request_target` and obtain write permissions for fork PRs.

  # E2E test for winapp ui commands against WinUI 3 sample app
  e2e-test-ui:
    runs-on: windows-latest
    needs: build-artifacts
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Enable Windows Developer Mode
      run: |
        reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /v "AllowDevelopmentWithoutDevLicense" /d 1 /f

    - name: Setup .NET 10
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: "10.0.x"

    - name: Download CLI binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Run WinUI UI E2E test
      run: |
        $platform = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
        .\scripts\test-e2e-winui-ui.ps1 -WinAppPath "artifacts/cli/win-$platform/winapp.exe"

    # Gated cooperative desktop-turn coverage (issue #764). Runs here, on the interactive lane, because
    # it drives real winapp.exe processes against a real foreground window.
    - name: Run UI coordination multiprocess and real-app tests
      run: .\scripts\test-ui-coordination.ps1

    - name: Upload UI coordination test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ui-coordination-test-results
        path: artifacts/TestResults/ui-coordination/
        if-no-files-found: warn

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ui-test-screenshots
        path: artifacts/screenshots/
        if-no-files-found: warn

  # Retain the original required check, but only turn it green after every lane.
  build-and-package:
    if: always()
    needs: [build-artifacts, validate-tests, validate-docs, e2e-test-ui, samples, metrics]
    runs-on: ubuntu-latest
    steps:
    - name: Require all build and validation jobs
      shell: pwsh
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
        IS_PR: ${{ github.event_name == 'pull_request' }}
      run: |
        $results = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
        foreach ($job in $results.Keys) {
          $expected = if ($job -eq 'samples' -and $env:IS_PR -ne 'true') { 'skipped' } else { 'success' }
          if ($results[$job].result -ne $expected) {
            throw "$job did not meet the required outcome: $($results[$job].result) (expected $expected)"
          }
        }
