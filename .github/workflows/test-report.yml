name: 'Test Report'
on:
  workflow_run:
    workflows: [Build and Package]
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  report:
    if: github.event.workflow_run.conclusion != 'cancelled'
    name: Test
    runs-on: windows-latest
    steps:
    - name: Display test results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      with:
        artifact: test-results
        name: Test - Results
        path: '**/*.trx'
        reporter: dotnet-trx
