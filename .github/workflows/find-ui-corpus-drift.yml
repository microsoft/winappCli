name: find-ui corpus drift

# The find-ui corpus is baked into the CLI at release time so the command works offline
# (issue #704). That snapshot is only as good as the fetchers that produced it, so this job
# bakes on a schedule and compares the result against what is committed.
#
# What it reports, and what it deliberately does not:
#
#   * a source fetched nothing          -> issue. The bake exits non-zero and says so.
#   * a source lost most of its         -> issue. This is the case nothing else catches:
#     scenarios, or vanished entirely      BakeAsync only fails a source at *zero*
#                                          scenarios, so a fetcher that survives an
#                                          upstream restructure while matching a fraction
#                                          of what it used to bakes green and would ship
#                                          a gutted source.
#   * upstream added or reworked        -> run summary only, no issue.
#     samples
#
# That last line is the point of the split. Upstream gaining samples is the steady state
# between releases, not an event: `scripts/build-cli.ps1` re-bakes the corpus on every
# `-Stable` release, and users with network access already get live data. Filing an issue
# for it produced one permanently-open no-action issue that collected a weekly "still
# present" comment, on the same label as the alerts above -- which taught everyone to
# ignore the label that also carries the real signal.
#
# It deliberately does NOT open a pull request. The snapshot only reaches users when they
# upgrade the CLI, so an auto-PR would add bot churn (dependabot is already the #2
# committer here) to refresh data that nothing consumes until the next release bake.
# `permissions` withholds `contents: write` so that stays true by construction.

on:
  schedule:
    # Weekly, Monday 09:15 UTC. Offset from codeql.yml (Sun 20:35) to avoid contending
    # for runners, and early in the week so a broken fetcher is seen before a release.
    - cron: '15 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    # windows-latest, not ubuntu: the bake runs the real CLI, which is Windows-only.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Bake a fresh corpus
        id: bake
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "corpus-drift"
          "output=$out" >> $env:GITHUB_OUTPUT

          dotnet run --project src/winapp-CLI/WinApp.Cli.SnapshotBaker/WinApp.Cli.SnapshotBaker.csproj -c Debug -- $out
          "exitCode=$LASTEXITCODE" >> $env:GITHUB_OUTPUT

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Bake failed with exit code $LASTEXITCODE. Reporting as a fetcher failure."
          }
        # A failed bake is the signal, not an infrastructure error -- keep going and report it.
        continue-on-error: true

      - name: Compare against the committed corpus
        id: diff
        shell: pwsh
        # Passed through the environment rather than interpolated into the script body:
        # `${{ }}` inside PowerShell collides with its own ${...} variable syntax, and
        # env vars keep the step parseable (and lintable) on its own.
        env:
          BAKE_OUTPUT: ${{ steps.bake.outputs.output }}
          BAKE_EXIT_CODE: ${{ steps.bake.outputs.exitCode }}
        run: |
          # Absolute, because Read-Snapshot below reads through System.IO, which resolves a
          # relative path against the *process* working directory rather than PowerShell's
          # location. The two agree in Actions, but silently reading a different corpus than
          # Get-ChildItem enumerated is not a failure worth leaving available.
          $committed = Join-Path $PWD.Path "src/winapp-CLI/WinApp.Cli/Services/Controls/Data"
          $fresh = $env:BAKE_OUTPUT
          $bakeFailed = $env:BAKE_EXIT_CODE -ne "0"

          # A source may legitimately lose a scenario or two when upstream retires a sample.
          # Losing a quarter of them is not upstream editing samples -- it is a fetcher that
          # stopped matching most of what it used to. That is the one failure mode the bake
          # itself cannot see, because BakeAsync only fails a source at *zero* scenarios.
          $regressionThreshold = 0.25

          function Write-Summary([string]$text) {
            Write-Host $text
            if ($env:GITHUB_STEP_SUMMARY) {
              $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

          if ($bakeFailed) {
            "status=bake-failed" >> $env:GITHUB_OUTPUT
            "summary=The scheduled bake failed, so at least one source returned no fetched data." >> $env:GITHUB_OUTPUT
            Write-Summary "## find-ui corpus: bake failed"
            exit 0
          }

          # snapshot-manifest.json is excluded on purpose: bakedAtUtc changes on every run,
          # so including it would report drift 100% of the time and train everyone to ignore
          # this job.
          #
          # Only the Brotli blob is committed, so both sides are decompressed and compared
          # as JSON rather than hashed as bytes. Brotli output is deterministic for
          # identical input today, but comparing the compressed bytes would couple this job
          # to the encoder: a .NET update that changed compression would report drift on
          # every file at once and mean nothing. The decompressed corpus is the thing we
          # actually care about, and it is byte-deterministic for unchanged upstream input.
          $regressions = @()
          $routine = @()
          $corpusFiles = Get-ChildItem $fresh -Filter "snapshot-*.json.br"

          function Read-Snapshot([string]$path) {
            $raw = [System.IO.File]::ReadAllBytes($path)
            $in = New-Object System.IO.MemoryStream(, $raw)
            $out = New-Object System.IO.MemoryStream
            $br = New-Object System.IO.Compression.BrotliStream($in, [System.IO.Compression.CompressionMode]::Decompress)
            $br.CopyTo($out)
            $br.Dispose()
            [System.Text.Encoding]::UTF8.GetString($out.ToArray())
          }

          if ($corpusFiles.Count -eq 0) {
            "status=bake-failed" >> $env:GITHUB_OUTPUT
            "summary=The bake reported success but produced no corpus files." >> $env:GITHUB_OUTPUT
            Write-Summary "## find-ui corpus: bake produced no files"
            exit 0
          }

          foreach ($file in $corpusFiles) {
            $old = Join-Path $committed $file.Name
            if (-not (Test-Path $old)) {
              $routine += "- ``$($file.Name)`` — **new source**, not yet committed"
              continue
            }

            $freshJson = Read-Snapshot $file.FullName
            $oldJson = Read-Snapshot $old

            if ($freshJson -eq $oldJson) {
              continue
            }

            $freshCount = ($freshJson | ConvertFrom-Json).scenarios.Count
            $oldCount = ($oldJson | ConvertFrom-Json).scenarios.Count
            $delta = $freshCount - $oldCount
            $line = "- ``$($file.Name)`` — $oldCount → $freshCount scenarios ($(if ($delta -ge 0) { "+$delta" } else { "$delta" }))"

            if ($oldCount -gt 0 -and $freshCount -lt ($oldCount * (1 - $regressionThreshold))) {
              $lost = [math]::Round((1 - ($freshCount / $oldCount)) * 100)
              $regressions += "$line — **lost $lost% of its scenarios**"
            } else {
              $routine += $line
            }
          }

          # A committed snapshot with no counterpart in a *successful* bake means the source
          # stopped being produced at all. The loop above walks the fresh output, so a source
          # that vanished is simply not there to be compared.
          foreach ($old in Get-ChildItem $committed -Filter "snapshot-*.json.br") {
            if (-not (Test-Path (Join-Path $fresh $old.Name))) {
              $regressions += "- ``$($old.Name)`` — **source vanished**: committed, but the fresh bake produced nothing for it"
            }
          }

          if ($regressions.Count -eq 0 -and $routine.Count -eq 0) {
            "status=clean" >> $env:GITHUB_OUTPUT
            Write-Summary "## find-ui corpus`n`nCommitted corpus matches upstream."
            exit 0
          }

          $regressionText = $regressions -join "`n"
          $routineText = $routine -join "`n"

          Write-Summary "## find-ui corpus`n"
          if ($regressions.Count -gt 0) {
            Write-Summary "### Regressions`n`n$regressionText`n"
          }
          if ($routine.Count -gt 0) {
            Write-Summary "### Routine drift`n`nNo action required — re-baked automatically on the next ``-Stable`` release.`n`n$routineText`n"
          }

          # Routine drift stops here by design: it is reported above and nowhere else.
          if ($regressions.Count -eq 0) {
            "status=routine" >> $env:GITHUB_OUTPUT
            Write-Host "Routine drift only — reported in the run summary, no issue opened."
            exit 0
          }

          "status=regression" >> $env:GITHUB_OUTPUT
          "summary=$($regressions -join '%0A')" >> $env:GITHUB_OUTPUT
          Write-Host "Regression detected."

      - name: Report
        if: steps.diff.outputs.status == 'bake-failed' || steps.diff.outputs.status == 'regression'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_STATUS: ${{ steps.diff.outputs.status }}
          DRIFT_SUMMARY: ${{ steps.diff.outputs.summary }}
        with:
          script: |
            const status = process.env.DRIFT_STATUS;
            const summary = (process.env.DRIFT_SUMMARY || '').replace(/%0A/g, '\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const LABEL = 'find-ui-corpus';
            const BAKE_COMMAND =
              'dotnet run --project src/winapp-CLI/WinApp.Cli.SnapshotBaker -- src/winapp-CLI/WinApp.Cli/Services/Controls/Data';

            // Ensure the label exists before it is used to look issues up. Creating it here
            // rather than relying on issue creation to conjure it keeps the dedup query
            // below meaningful on the very first run, and makes the workflow self-contained
            // if the label is ever deleted.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
                color: 'c5def5',
                description: 'Automated find-ui corpus regression / bake failure reports',
              });
            } catch (error) {
              if (error.status !== 422) throw error;   // 422 == already exists
            }

            // Both statuses are actionable -- routine drift never reaches this step -- but
            // they need different titles and different investigation, so they take one issue
            // slot each and a weekly schedule updates rather than duplicates.
            const isFailure = status === 'bake-failed';
            const title = isFailure
              ? 'find-ui corpus: a source failed to bake'
              : 'find-ui corpus: a source lost most of its scenarios';

            const body = isFailure
              ? [
                  'The scheduled bake could not fetch one or more find-ui sources.',
                  '',
                  summary,
                  '',
                  'This usually means an upstream repository was restructured and the corresponding',
                  'fetcher no longer finds samples. Left unfixed, the next release bakes without that',
                  'source and it silently disappears from `find-ui` — the offline corpus would still',
                  'load, just with a hole in it.',
                  '',
                  `[Workflow run](${runUrl})`,
                ].join('\n')
              : [
                  'The scheduled bake succeeded, but a find-ui source came back with far fewer',
                  'scenarios than the committed corpus holds.',
                  '',
                  summary,
                  '',
                  'A drop this size is not upstream retiring samples — it means the fetcher stopped',
                  'matching most of what it used to, typically after an upstream repository was',
                  'restructured. The bake cannot catch this on its own: it only fails a source that',
                  'returns *zero* scenarios, so a partial loss bakes green and would ship a gutted',
                  'source at the next `-Stable` release.',
                  '',
                  'Check the fetcher for that source under `src/winapp-CLI/WinApp.Cli/Services/Controls/`,',
                  'then re-bake and commit the result:',
                  '',
                  '```',
                  BAKE_COMMAND,
                  '```',
                  '',
                  `[Workflow run](${runUrl})`,
                ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });

            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Still present as of the latest scheduled check.\n\n${summary}\n\n[Workflow run](${runUrl})`,
              });
              console.log(`Updated existing issue #${match.number}.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [LABEL],
            });
            console.log(`Opened issue #${created.data.number}.`);
