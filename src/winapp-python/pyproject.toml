[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-winappcli"
version = "0.1.0.dev0"
description = "Python project integration for the Windows App Development CLI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Microsoft" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "packaging>=24,<27",
    "pip>=24",
    "PyYAML>=6,<7",
    "tomlkit>=0.13,<1",
]

[project.scripts]
winapp = "winapp.cli:main"

[project.urls]
Repository = "https://github.com/microsoft/winappCli"
Documentation = "https://github.com/microsoft/winappCli/blob/main/docs/guides/python.md"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
winapp = ["_native/*", "_native/**/*"]
