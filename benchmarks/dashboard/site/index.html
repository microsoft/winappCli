<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>winapp benchmark results</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to results</a>
  <header class="site">
    <div class="wrap">
      <h1>winapp benchmark results</h1>
      <p class="lede">Do the <code>winapp</code> CLI and its agent skills help AI agents build better Windows apps? Measured on real runs.</p>
      <div class="controls">
        <label for="release">Release</label>
        <select id="release"></select>
        <span id="release-meta" class="muted"></span>
      </div>
    </div>
  </header>
  <main id="main" class="wrap">
    <div id="banner"></div>
    <div role="tablist" aria-label="Result views" id="tabs">
      <button role="tab" id="tab-overview" aria-controls="panel-overview" data-tab="overview">Overview</button>
      <button role="tab" id="tab-apps" aria-controls="panel-apps" data-tab="apps">By app</button>
      <button role="tab" id="tab-skills" aria-controls="panel-skills" data-tab="skills">Skills</button>
      <button role="tab" id="tab-details" aria-controls="panel-details" data-tab="details">Details</button>
    </div>
    <section role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" tabindex="0"></section>
    <section role="tabpanel" id="panel-apps" aria-labelledby="tab-apps" tabindex="0" hidden></section>
    <section role="tabpanel" id="panel-skills" aria-labelledby="tab-skills" tabindex="0" hidden></section>
    <section role="tabpanel" id="panel-details" aria-labelledby="tab-details" tabindex="0" hidden></section>
  </main>
  <footer class="wrap muted" id="footer"></footer>
  <noscript><p class="wrap">This page needs JavaScript to draw the tables. The numbers are in <a href="data.json">data.json</a>.</p></noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
