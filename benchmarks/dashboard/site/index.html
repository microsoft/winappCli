<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>winapp benchmark results</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to results</a>
  <header class="site">
    <div class="wrap">
      <h1>winapp benchmark results</h1>
      <p class="lede">How much the <code>winapp</code> CLI and the winapp and WinUI agent skills help AI agents build Windows apps, measured on real runs.</p>
      <div class="controls">
        <label for="release">Release</label>
        <select id="release"></select>
        <span id="release-meta" class="muted"></span>
      </div>
    </div>
  </header>
  <main id="main" class="wrap">
    <div id="banner"></div>
    <div role="tablist" aria-label="Result views" id="tabs">
      <button role="tab" id="tab-headline" aria-controls="panel-headline" data-tab="headline">Headline</button>
      <button role="tab" id="tab-scenarios" aria-controls="panel-scenarios" data-tab="scenarios">Scenarios</button>
      <button role="tab" id="tab-outcomes" aria-controls="panel-outcomes" data-tab="outcomes">Outcomes</button>
      <button role="tab" id="tab-skills" aria-controls="panel-skills" data-tab="skills">Skills</button>
      <button role="tab" id="tab-tasks" aria-controls="panel-tasks" data-tab="tasks">Tasks</button>
      <button role="tab" id="tab-method" aria-controls="panel-method" data-tab="method">How we measured</button>
    </div>
    <section role="tabpanel" id="panel-headline" aria-labelledby="tab-headline" tabindex="0"></section>
    <section role="tabpanel" id="panel-scenarios" aria-labelledby="tab-scenarios" tabindex="0" hidden></section>
    <section role="tabpanel" id="panel-outcomes" aria-labelledby="tab-outcomes" tabindex="0" hidden></section>
    <section role="tabpanel" id="panel-skills" aria-labelledby="tab-skills" tabindex="0" hidden></section>
    <section role="tabpanel" id="panel-tasks" aria-labelledby="tab-tasks" tabindex="0" hidden></section>
    <section role="tabpanel" id="panel-method" aria-labelledby="tab-method" tabindex="0" hidden></section>
  </main>
  <footer class="wrap muted" id="footer"></footer>
  <noscript><p class="wrap">This page needs JavaScript to draw the tables. The numbers are in <a href="data.json">data.json</a>.</p></noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
